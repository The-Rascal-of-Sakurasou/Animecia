<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>マイページ｜ANIXIA</title>
<meta name="description" content="ANIXIAのマイページ。お気に入り、視聴記録、個人評価、プロフィール、実績を管理できます。">
<link rel="canonical" href="https://the-rascal-of-sakurasou.github.io/anixia/mypage.html">
<style>
.anixia-mypage{width:min(1180px,calc(100% - 36px));margin:0 auto;padding:30px 0 70px}
.anixia-mypage-hero{padding:25px 28px;border:1px solid #293b56;border-radius:16px;background:linear-gradient(135deg,#101c30,#192c46);margin-bottom:18px}
.anixia-mypage-hero small{color:#f2b84d;font-size:10px;font-weight:900;letter-spacing:.16em}
.anixia-mypage-hero h1{color:#fff;font-size:clamp(26px,4vw,38px);margin:6px 0}
.anixia-mypage-hero p{color:#b8c5d7;margin:0;font-size:12px}
.anixia-mypage-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
.anixia-mypage-panel{border:1px solid #293b56;border-radius:14px;background:#111b2b;padding:20px;margin-bottom:15px}
.anixia-mypage-panel h2{font-size:16px;color:#fff;margin:0 0 14px}
.anixia-profile-field{display:grid;gap:6px;margin-bottom:12px}
.anixia-profile-field label{font-size:11px;color:#aebbd0;font-weight:800}
.anixia-profile-field input,.anixia-profile-field textarea{width:100%;border:1px solid #30435f;border-radius:8px;background:#0b1423;color:#f2f5fa;padding:10px;font:inherit;font-size:13px}
.anixia-profile-field textarea{min-height:90px;resize:vertical}
.anixia-profile-form button{width:100%;border:0;border-radius:8px;padding:11px;background:#f2a51a;color:#171b22;font-weight:900}
.anixia-mypage-message{min-height:18px;font-size:11px;color:#f2b84d}
.anixia-mypage-tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
.anixia-mypage-tabs button{border:1px solid #30435f;border-radius:999px;padding:8px 12px;background:#17243a;color:#dce5f2;font-size:11px;font-weight:800}
.anixia-mypage-tabs button.active{background:#f2a51a;color:#171b22;border-color:#f2a51a}
.anixia-library-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.anixia-library-card{border:1px solid #293b56;border-radius:10px;overflow:hidden;background:#0d1727;color:#fff;text-decoration:none}
.anixia-library-card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#263b59}
.anixia-library-card div{padding:9px}
.anixia-library-card b{display:block;font-size:11px;line-height:1.5}
.anixia-library-card small{display:block;color:#9eacc0;font-size:10px;margin-top:5px}
.anixia-library-empty{padding:25px;text-align:center;color:#9eacc0;border:1px dashed #354862;border-radius:10px;font-size:12px}
@media(max-width:850px){.anixia-mypage-grid{grid-template-columns:1fr}.anixia-library-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.anixia-mypage{width:calc(100% - 22px);padding:20px 0 55px}.anixia-mypage-panel{padding:16px}.anixia-library-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.anixia-visibility-note{font-size:11px;color:#aebbd0;line-height:1.6;margin:0 0 8px}.anixia-visibility-options{display:grid;gap:8px}.anixia-visibility-options label{display:flex;align-items:center;gap:9px;color:#dce5f2;font-size:12px;font-weight:650}.anixia-visibility-options input{width:16px;height:16px;accent-color:#03AF6A;flex:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="anixia-client.js?v=20261121-title-card-fallback2"></script>
<script src="anixia-mypage.js" defer></script>
<script src="performance.js" defer></script>
<link rel="preconnect" href="https://trvnxggqzlhqdhoyiliy.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="site-theme.css?v=anixia-design-v5-20261119">
<link rel="preconnect" href="https://bhgdjuwlxvbaeraaivmh.supabase.co">

<link rel="stylesheet" href="/anixia/anixia-unified-theme.css?v=20261121-1">
<script src="/anixia/anixia-global-header.js?v=20261120-4" defer></script>
</head>
<body>
<header class="site-header"><div class="container nav">
<a class="brand" href="index.html">ANIXIA</a>
<nav class="nav-links" aria-label="メインメニュー"><a href="index.html">ホーム</a><a href="anime.html">作品検索</a><a href="ranking.html">ランキング</a><a href="recommendations.html">おすすめ診断</a><a href="quiz.html">クイズ</a></nav>
<div class="nav-actions"><a class="nav-btn" href="login.html" id="auth-action">ログイン</a></div>
</div></header>
<main class="anixia-mypage">
<section class="anixia-mypage-hero"><small>MY ANIXIA</small><h1>マイページ</h1><p>視聴記録やお気に入り、自分の評価をまとめて管理できます。</p></section>
<div id="mypage-loading" class="anixia-library-empty">アカウント情報を確認しています…</div>
<div id="mypage-login" class="anixia-mypage-panel" hidden><h2>ログインが必要です</h2><p>マイページを利用するにはログインしてください。</p><a class="nav-btn primary" href="login.html">ログインする</a></div>
<div id="mypage-content" class="anixia-mypage-grid" hidden>
<aside>
<section class="anixia-mypage-panel">
<h2>プロフィール</h2>
<form id="profile-form" class="anixia-profile-form">
<div class="anixia-profile-field"><label for="display-name">表示名</label><input id="display-name" maxlength="50"></div>
<div class="anixia-profile-field"><label for="username">ユーザーID</label><input id="username" maxlength="30" placeholder="英数字など"></div>
<div class="anixia-profile-field"><label for="bio">自己紹介</label><textarea id="bio" maxlength="300"></textarea></div>
<div class="anixia-profile-field">
<label>プロフィールの公開設定</label>
<p class="anixia-visibility-note">非公開にすると、他のユーザーからプロフィールや公開項目を閲覧できなくなります。</p>
<div class="anixia-visibility-options">
<label><input type="checkbox" id="is-public"> プロフィール全体を公開</label>
<label><input type="checkbox" id="show-posts"> 投稿を公開</label>
<label><input type="checkbox" id="show-favorites"> お気に入りを公開</label>
<label><input type="checkbox" id="show-anime-follows"> 視聴予定を公開</label>
<label><input type="checkbox" id="show-watch-status"> 視聴記録を公開</label>
<label><input type="checkbox" id="show-ratings"> 評価を公開</label>
<label><input type="checkbox" id="show-reviews"> レビューを公開</label>
<label><input type="checkbox" id="show-user-follows"> フォロー・フォロワーを公開</label>
<label><input type="checkbox" id="show-ranking"> 高評価順リストを公開</label>
<p class="anixia-visibility-note">高評価順リストを公開するには、評価も公開する必要があります。</p>
</div>
</div>
<button type="submit">プロフィールを保存</button>
<p id="profile-message" class="anixia-mypage-message" aria-live="polite"></p>
</form>
</section>
<section class="anixia-mypage-panel">
<h2>アカウント</h2><p id="user-email" style="font-size:12px;color:#a3b0c2;overflow-wrap:anywhere"></p>
<button id="logout" type="button" class="nav-btn" style="width:100%">ログアウト</button>
</section>
</aside>
<div>
<section class="anixia-mypage-panel">
<h2>マイライブラリ</h2>
<div class="anixia-mypage-tabs" role="tablist">
<button type="button" data-tab="watch" class="active">視聴記録</button>
<button type="button" data-tab="favorites">お気に入り</button>
<button type="button" data-tab="ratings">自分の評価</button>
<button type="button" data-tab="reviews">レビュー</button>
<button type="button" data-tab="achievements">実績</button>
</div>
<div id="library-content" class="anixia-library-grid"></div>
</section>
</div>
</div>
</main>

<script src="anixia-i18n.js?v=20261119-r8" defer></script>
</body>
</html>
