<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><meta name="robots" content="noindex,nofollow"><title>メール認証コード｜ANIXIA</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d18;color:#f4f7fb;font-family:system-ui,sans-serif}main{width:min(480px,calc(100% - 32px));padding:28px;border:1px solid #293b56;border-radius:16px;background:#111b2b}.field{display:grid;gap:8px;margin:18px 0}label{font-size:12px;color:#b9c6d7;font-weight:800}input{width:100%;height:48px;padding:10px;border:1px solid #30435f;border-radius:8px;background:#0b1423;color:#fff;font:inherit}button{width:100%;padding:12px;border:0;border-radius:8px;background:#f2a51a;color:#171b22;font-weight:900;cursor:pointer}button:disabled{opacity:.55}.secondary{margin-top:10px;background:#24354e;color:#fff}.message{min-height:38px;color:#f2b84d;font-size:12px;line-height:1.7}a{color:#f2b84d}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="anixia-client.js"></script><script defer>
window.addEventListener("DOMContentLoaded",()=>{const q=new URLSearchParams(location.search),email=q.get("email")||"",redirect=q.get("redirect")||"",form=document.getElementById("form"),code=document.getElementById("code"),message=document.getElementById("message"),submit=document.getElementById("submit"),resend=document.getElementById("resend");document.getElementById("email-label").textContent=email||"メールアドレスが指定されていません";const allowed=new Set(["index.html","mypage.html","anime.html","anime-detail.html","ranking.html","quiz.html","recommendations.html","discover.html","season.html","community.html","profile.html","messages.html","memo.html","admin.html"]);function dest(){const f=new URL("mypage.html",location.href);try{const t=new URL(redirect||f.href,location.href),p=t.pathname.split("/").filter(Boolean).pop()||"index.html";return t.origin===location.origin&&allowed.has(p)?t.href:f.href;}catch(_){return f.href;}}if(!email){message.textContent="メールアドレスがありません。新規登録画面からやり直してください。";submit.disabled=true;resend.disabled=true;}form.addEventListener("submit",async e=>{e.preventDefault();if(submit.disabled)return;const token=code.value.replace(/\s/g,"");if(!/^\d{6}$/.test(token)){message.textContent="メールに記載された6桁の認証コードを入力してください。";return;}submit.disabled=true;message.textContent="認証しています…";try{const {data,error}=await ANIXIA.getClient().auth.verifyOtp({email,token,type:"signup"});if(error)throw error;if(!data.session)throw new Error("認証セッションを作成できませんでした。");message.textContent="認証しました。ANIXIAへ移動します…";location.replace(dest());}catch(err){console.error("ANIXIA email OTP verification failed",err);message.textContent="認証できませんでした。コードが正しいか、有効期限内か確認してください。";submit.disabled=false;}});resend.addEventListener("click",async()=>{resend.disabled=true;message.textContent="認証コードを再送信しています…";try{const {error}=await ANIXIA.getClient().auth.resend({type:"signup",email});if(error)throw error;message.textContent="認証コードを再送信しました。受信箱をご確認ください。";}catch(err){console.error("ANIXIA OTP resend failed",err);message.textContent="再送信できませんでした。少し時間をおいて再度お試しください。";}finally{resend.disabled=false;}});});
</script><script src="performance.js" defer></script><link rel="stylesheet" href="site-theme.css?v=anixia-otp-20261117"><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://bhgdjuwlxvbaeraaivmh.supabase.co">
</head>
<body><main><a href="index.html" style="text-decoration:none;font-weight:900">ANIXIA</a><h1>メール認証</h1><p style="color:#a3b0c2;font-size:13px;line-height:1.8">登録したメールアドレスに届いた6桁の認証コードを入力してください。メール内のリンクを開く必要はありません。</p><p id="email-label" style="color:#f2b84d;font-size:13px;overflow-wrap:anywhere"></p><form id="form"><div class="field"><label for="code">認証コード（6桁）</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><button id="submit" type="submit">認証する</button><p id="message" class="message" role="status" aria-live="polite">メールに届いたコードを入力してください。</p></form><button id="resend" class="secondary" type="button">認証コードを再送信</button><p style="font-size:12px"><a href="signup.html">新規登録に戻る</a> ・ <a href="login.html">ログイン</a></p></main></body></html>
