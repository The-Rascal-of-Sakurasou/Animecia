r:#69717d}.search-result button{border:0;border-radius:8px;background:#101827;color:#fff;padding:8px 11px;font-weight:800;cursor:pointer}.search-result button:disabled{background:#ddd;color:#777}@media(max-width:600px){.memo-page{padding:22px 14px 50px}.memo-hero{padding:23px}.memo-hero h1{font-size:28px}.memo-head{align-items:flex-start}.memo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.memo-body{padding:9px}.memo-actions{display:block}.memo-actions a,.memo-actions button{display:block;width:100%;margin-top:6px}.search-row{display:block}.search-row input{width:100%}.search-row button{width:100%;margin-top:8px}}

<script>
const supabaseClient=ANIXIA.getClient();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hasJapanese=v=>/[\u3040-\u30ff\u3400-\u9fff]/u.test(String(v||""));
const titleOf=a=>localStorage.getItem("anixia-language")==="en"?(a?.title_en||(a?.title&&!hasJapanese(a.title)?a.title:"English title unavailable")):(a?.title_ja||a?.title_kana||a?.title||"タイトル未設定");
const key="anixia_memo";let ids=[];let version=0;
function getIds(){try{const x=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(x)?[...new Set(x.map(String).filter(x=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(x)))]:[]}catch{return[]}}
function save(){localStorage.setItem(key,JSON.stringify(ids))}
async function fetchSelected(){if(!ids.length)return[];return await ANIXIA.getPublicAnimeByIds(ids)}
async function render(){
 const v=++version;ids=getIds();document.getElementById("memo-count").textContent=ids.length+"作品を保存中";
 const grid=document.getElementById("memo-grid");
 if(!ids.length){grid.innerHTML='<div class="empty">まだメモに保存された作品はありません。<br>下の検索欄から作品を追加できます。</div>';return}
 try{
  const rows=await fetchSelected();if(v!==version)return;
  grid.innerHTML=rows.map(a=>'<article class="memo-card"><img src="'+esc(a.poster_url||"")+'" alt="'+esc(titleOf(a))+'" onerror="this.style.visibility=\'hidden\'" decoding="async" loading="lazy" fetchpriority="high"><div class="memo-body"><div class="memo-title">'+esc(titleOf(a))+'</div><div class="memo-meta">'+esc(a.release_year||"")+" "+esc(a.season||"")+'</div><div class="memo-actions"><a href="anime-detail.html?id='+encodeURIComponent(a.id)+'">詳細を見る</a><button type="button" data-remove="'+esc(a.id)+'">外す</button></div></div></article>').join("");
  grid.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removeId(b.dataset.remove));
 }catch(e){console.error(e);grid.innerHTML='<div class="empty">メモを読み込めませんでした。</div>'}
}
function addId(id){id=String(id);if(!/^[0-9a-f-]{36}$/i.test(id)||ids.includes(id))return;ids.push(id);save();render();searchWorks("")}
function removeId(id){ids=ids.filter(x=>x!==String(id));save();render();searchWorks(document.getElementById("memo-search").value)}
async function searchWorks(q=""){
 const box=document.getElementById("search-results"),query=q.trim();
 if(!query){box.innerHTML="";return}
 try{
  const data=await ANIXIA.listAnime({query,limit:20,sort:"newest"});
  box.innerHTML=(data||[]).map(a=>{const selected=ids.includes(String(a.id));return '<div class="search-result"><img src="'+esc(a.poster_url||"")+'" alt="" onerror="this.style.visibility=\'hidden\'" decoding="async" loading="lazy"><div><strong>'+esc(titleOf(a))+'</strong><small>'+esc(a.release_year||"")+'</small></div><button type="button" data-add="'+esc(a.id)+'" '+(selected?"disabled":"")+'>'+(selected?"保存中":"メモに追加")+'</button></div>'}).join("")||'<div class="empty">作品が見つかりません。</div>';
  box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addId(b.dataset.add));
 }catch(e){console.error(e);box.innerHTML='<div class="empty">作品を検索できませんでした。</div>'}
}
document.getElementById("clear").onclick=()=>{ids=[];save();render();searchWorks(document.getElementById("memo-search").value)};
document.getElementById("search-button").onclick=()=>searchWorks(document.getElementById("memo-search").value);
document.getElementById("memo-search").addEventListener("input",e=>{clearTimeout(window.memoTimer);window.memoTimer=setTimeout(()=>searchWorks(e.target.value),180)});
ids=getIds();render();
</script>
