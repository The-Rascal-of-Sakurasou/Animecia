<script>
const supabaseClient=AnimeciaAuth.client();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titleOf=a=>a?.title_japanese||a?.title_native||a?.title_user_preferred||a?.title_romaji||a?.title_english||a?.english_title||a?.title||"タイトル未設定";
const key="animecia_memo"; let ids=[]; let version=0;
function getIds(){try{const x=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(x)?[...new Set(x.map(Number).filter(Number.isInteger))]:[]}catch{return[]}}
function save(){localStorage.setItem(key,JSON.stringify(ids))}
async function fetchSelected(){if(!ids.length)return[];const {data,error}=await supabaseClient.rpc("get_anime_comparison_catalog",{p_anime_ids:ids});if(error)throw error;const m=new Map((data||[]).map(a=>[Number(a.id),a]));return ids.map(id=>m.get(id)).filter(Boolean)}
async function render(){const v=++version;ids=getIds();document.getElementById("memo-count").textContent=ids.length+"作品を保存中";const grid=document.getElementById("memo-grid");if(!ids.length){grid.innerHTML='<div class="empty">まだメモに保存された作品はありません。<br>下の検索欄から作品を追加できます。</div>';return}try{const rows=await fetchSelected();if(v!==version)return;grid.innerHTML=rows.map(a=>'<article class="memo-card"><img src="'+esc(a.cover_image||a.banner_image||"")+'" alt="'+esc(titleOf(a))+'" onerror="this.style.visibility=\'hidden\'" decoding="async" loading="eager" fetchpriority="high"><div class="memo-body"><div class="memo-title">'+esc(titleOf(a))+'</div><div class="memo-meta">'+esc(a.season_year||"")+" "+esc(({WINTER:"冬",SPRING:"春",SUMMER:"夏",FALL:"秋"})[a.season]||"")+'</div><div class="memo-actions"><a href="anime-detail.html?id='+encodeURIComponent(a.id)+'">詳細を見る</a><button type="button" data-remove="'+a.id+'">外す</button></div></div></article>').join("");grid.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removeId(Number(b.dataset.remove)))}catch(e){console.error(e);grid.innerHTML='<div class="empty">メモを読み込めませんでした。</div>'}}
function addId(id){id=Number(id);if(!Number.isInteger(id)||ids.includes(id))return;ids.push(id);save();render();searchWorks("")}
function removeId(id){ids=ids.filter(x=>x!==id);save();render();searchWorks(document.getElementById("memo-search").value)}
async function searchWorks(q=""){const box=document.getElementById("search-results");const query=q.trim();if(!query){box.innerHTML="";return}const {data,error}=await supabaseClient.rpc("search_anime_catalog_v2",{p_query:query,p_genre_id:null,p_studio_id:null,p_year:null,p_season:null,p_status:null,p_format:null,p_sort:"default",p_limit:20,p_offset:0});if(error){box.innerHTML='<div class="empty">作品を検索できませんでした。</div>';return}box.innerHTML=(data||[]).map(a=>{const selected=ids.includes(Number(a.id));return '<div class="search-result"><img src="'+esc(a.cover_image||"")+'" alt="" onerror="this.style.visibility=\'hidden\'" decoding="async" loading="lazy"><div><strong>'+esc(titleOf(a))+'</strong><small>'+esc(a.start_date||"")+'</small></div><button type="button" data-add="'+a.id+'" '+(selected?"disabled":"")+'>'+(selected?"保存中":"メモに追加")+'</button></div>'}).join("")||'<div class="empty">作品が見つかりません。</div>';box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addId(b.dataset.add))}
document.getElementById("clear").onclick=()=>{ids=[];save();render();searchWorks(document.getElementById("memo-search").value)};
document.getElementById("search-button").onclick=()=>searchWorks(document.getElementById("memo-search").value);
document.getElementById("memo-search").addEventListener("input",e=>{clearTimeout(window.memoTimer);window.memoTimer=setTimeout(()=>searchWorks(e.target.value),180)});
ids=getIds();render();
</script>
