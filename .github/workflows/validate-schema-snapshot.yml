name: Validate ANIXIA schema snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/schema-snapshot/**"
      - "scripts/validate-schema-snapshot.sh"
      - ".github/workflows/validate-schema-snapshot.yml"
  push:
    branches: [main]
    paths:
      - "supabase/schema-snapshot/**"
      - "scripts/validate-schema-snapshot.sh"
      - ".github/workflows/validate-schema-snapshot.yml"

permissions:
  contents: read

jobs:
  replay-snapshot:
    name: Replay snapshot in isolated local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Validate schema snapshot
        run: bash scripts/validate-schema-snapshot.sh
