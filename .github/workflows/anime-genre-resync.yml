# Animecia genre classifier: keep taxonomy and overlap normalization active.
# Scheduled repair continues until every verified work has 3-5 evidence-based genres.
name: Animecia Genre Resync

on:
  push:
    paths:
      - '.github/workflows/anime-genre-resync.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "一度に分類する作品数（最大500）"
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: animecia-genre-resync
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BATCH_SIZE: ${{ inputs.batch_size || '500' }}
      ANILIST_URL: https://graphql.anilist.co
      MAL_API: https://api.jikan.moe/v4
      CLASSIFICATION_VERSION: "animecia-cross-source-v16-higher-precision"

    steps:
      - name: Classify anime using evidence scoring
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import math
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          ANI = os.environ["ANILIST_URL"]
          VERSION = os.environ["CLASSIFICATION_VERSION"]
          BATCH = max(50, min(500, int(os.environ.get("BATCH_SIZE", "500"))))

          # IMPORTANT:
          # このプログラムは genres テーブルへ新しいジャンルを作成しない。
          # DBに現在存在するジャンルだけを取得して、そのIDへ分類する。
          # したがって分類プログラム側からジャンル体系を変更しない。
          def http(url, method="GET", body=None, retries=5):
              data = None if body is None else json.dumps(body, ensure_ascii=False).encode()
              headers = {
                  "apikey": KEY,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Animecia-GenreClassifier/3.0"
              }
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, data=data, method=method, headers=headers)
                      with urllib.request.urlopen(req, timeout=90) as r:
                          raw = r.read()
                          return json.loads(raw.decode("utf-8")) if raw else []
                  except urllib.error.HTTPError as e:
                      if e.code in (408, 425, 429, 500, 502, 503, 504) and attempt < retries - 1:
                          time.sleep(min(30, 2 ** attempt))
                          continue
                      raise

          def sb(path, method="GET", body=None, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params, doseq=True)
              return http(url, method, body)

          def norm(value):
              return re.sub(r"\\s+", " ", str(value or "").strip().lower())

          # ジャンルIDは現在のDBで固定されている26ジャンル。
          # GitHub Actions側からgenresテーブルを直接読む必要がないよう固定化し、
          # 公開APIの権限差で分類処理が停止しないようにする。
          GENRE_ID = {
              "学園": 90764, "異世界": 90766, "冒険": 90767, "アクション": 90827,
              "コメディ": 90830, "スポーツ": 90831, "ファンタジー": 90834, "SF": 90835,
              "ドラマ": 90837, "魔法少女": 90841, "ホラー": 90847, "恋愛": 90851,
              "日常": 90859, "メカ": 90894, "音楽": 91038, "ミリタリー": 91254,
              "歴史": 98666, "サスペンス": 108591, "ショート": 114798,
              "推理": 115017, "戦争": 115020, "青春": 115023, "アイドル": 115025,
              "ファミリー": 115032, "超自然": 676182, "心理": 676183
          }


          # Animeciaで現在使われているジャンル名。
          # DBに存在しない名前は自動的に無視するため、分類器が新ジャンルを作ることはない。
          ALL_NAMES = [
              "SF","アイドル","アクション","コメディ","サスペンス","ショート","スポーツ","ドラマ",
              "ファミリー","ファンタジー","ホラー","ミリタリー","メカ","冒険","学園",
              "恋愛","戦争","推理","日常","歴史","異世界","青春","音楽","魔法少女","心理","超自然"
          ]

          # AniListの一般ジャンル → Animeciaジャンル。
          # 強い根拠ほど高得点。単なる単語一致より公式ジャンルを優先する。
          SOURCE_GENRE = {
              "action": [("アクション", 1.00)],
              "adventure": [("冒険", 1.00)],
              "comedy": [("コメディ", 1.00)],
              "drama": [("ドラマ", 1.00)],
              "fantasy": [("ファンタジー", 1.00)],
              "horror": [("ホラー", 1.00)],
              "mahou shoujo": [("魔法少女", 1.00)],
              "mecha": [("メカ", 1.00)],
              "music": [("音楽", 1.00)],
              "mystery": [("推理", 1.00)],
              "romance": [("恋愛", 1.00)],
              "sci-fi": [("SF", 1.00)],
              "slice of life": [("日常", 1.00)],
              "sports": [("スポーツ", 1.00)],
              "thriller": [("サスペンス", 1.00)],
              "supernatural": [("超自然", 0.96)],
              "psychological": [("心理", 0.96)],
          }

          # タグはrankが高いほど強い。ただし「spoiler」タグは除外する。
          TAG_RULES = {
              "学園": {
                  "school": 0.82, "school club": 0.78, "school life": 0.84, "college": 0.78,
                  "high school": 0.98, "middle school": 0.98, "university": 0.90
              },
              "異世界": {"isekai": 1.00},
              "冒険": {
                  "adventure": 0.95, "journey": 0.82, "travel": 0.78, "pirates": 0.90, "treasure": 0.90,
                  "treasure hunt": 0.90
              },
              "アクション": {
                  "action": 0.92, "martial arts": 0.92, "swordplay": 0.88,
                  "super power": 0.84, "superhero": 0.88, "assassins": 0.90,
                  "ninja": 0.88, "delinquents": 0.86, "yakuza": 0.86,
                  "revenge": 0.78
              },
              "コメディ": {
                  "comedy": 0.95, "parody": 0.92, "satire": 0.90, "slapstick": 0.88, "gag": 0.88
              },
              "恋愛": {
                  "romance": 0.96, "love triangle": 0.92,
                  "love interest": 0.88, "romantic comedy": 0.82
              },
              "日常": {
                  "slice of life": 0.98, "school club": 0.70,
                  "workplace": 0.66, "episodic": 0.58
              },
              "スポーツ": {
                  "sports": 0.96, "athletics": 0.90, "baseball": 0.98, "basketball": 0.98,
                  "soccer": 0.98, "volleyball": 0.98, "tennis": 0.98, "swimming": 0.94,
                  "cycling": 0.94, "boxing": 0.94, "racing": 0.90
              },
              "ホラー": {
                  "horror": 0.98, "gore": 0.84, "vampire": 0.72,
                  "zombie": 0.88, "ghost": 0.80, "psychological horror": 0.94
              },
              "サスペンス": {
                  "thriller": 0.98,
                  "survival": 0.90, "crime": 0.90, "conspiracy": 0.90,
                  "noir": 0.86, "espionage": 0.86, "revenge": 0.70
              },
              "推理": {
                  "mystery": 0.98, "detective": 0.98, "police": 0.78,
                  "crime": 0.70
              },
              "歴史": {
                  "historical": 1.00, "samurai": 0.88,
                  "edo period": 0.96, "sengoku period": 0.96,
                  "ancient china": 0.96, "ancient japan": 0.96
              },
              "戦争": {
                  "war": 1.00, "warfare": 0.96,
                  "military conflict": 0.96
              },
              "ミリタリー": {
                  "military": 1.00, "tanks": 0.96, "guns": 0.78,
                  "aviation": 0.82, "espionage": 0.72
              },
              "ドラマ": {
                  "drama": 0.94, "family life": 0.70,
                  "coming of age": 0.70, "workplace": 0.64
              },
              "青春": {
                  "coming of age": 0.98
              },
              "音楽": {
                  "music": 1.00, "musical": 0.96,
                  "dancing": 0.74
              },
              "アイドル": {"idol": 1.00},
              "ファミリー": {
                  "family": 0.90, "family life": 0.88,
                  "kids": 0.72
              },
              "SF": {
                  "sci-fi": 1.00, "cyberpunk": 0.98, "space": 0.92,
                  "space opera": 0.96, "aliens": 0.84,
                  "artificial intelligence": 0.94, "android": 0.84, "augmented reality": 0.86,
                  "virtual world": 0.84, "time manipulation": 0.78,
                  "post-apocalyptic": 0.80, "steampunk": 0.84
              },
              "ファンタジー": {
                  "fantasy": 1.00, "fairy tale": 0.94, "mythology": 0.90,
                  "demons": 0.78, "vampire": 0.72, "dragons": 0.92, "fairies": 0.90, "youkai": 0.82,
                  "magic": 0.92, "witches": 0.90, "alchemy": 0.76,
                  "urban fantasy": 0.88, "high fantasy": 0.98,
                  "dark fantasy": 0.98
              },
              "メカ": {
                  "mecha": 1.00, "real robot": 0.98,
                  "super robot": 0.98, "robots": 0.96, "android": 0.84
              },
          }

          def tag_score(tags, wanted):
              best = 0.0
              for tag in tags:
                  name = norm(tag.get("name"))
                  rank = tag.get("rank")
                  if rank is None:
                      rank_factor = 0.75
                  else:
                      rank_factor = max(0.50, min(1.0, float(rank) / 100.0))
                  for key, weight in wanted.items():
                      if name == key:
                          best = max(best, weight * rank_factor)
              return best

          def text_score(text, words):
              for w in words:
                  if w in text:
                      return 0.52
              return 0.0

          def classify(media, existing_ids=None, mal_genres=None):
              genres = {norm(x) for x in media.get("genres") or []}
              tags = [
                  t for t in (media.get("tags") or [])
                  if not t.get("isMediaSpoiler") and not t.get("isGeneralSpoiler")
              ]
              text = norm(" ".join([
                  (media.get("title") or {}).get("native") or "",
                  (media.get("title") or {}).get("romaji") or "",
                  (media.get("title") or {}).get("english") or "",
                  media.get("description") or ""
              ]))

              scores = {name: 0.0 for name in ALL_NAMES if name in GENRE_ID}
              reasons = {name: [] for name in scores}

              # 1. AniListの公式genre。最も強い根拠。
              for source, targets in SOURCE_GENRE.items():
                  if source in genres:
                      for name, score in targets:
                          if name in scores:
                              scores[name] = max(scores[name], score)
                              reasons[name].append("AniList genre: " + source)


              # 1.5 MyAnimeListのジャンル。AniListと一致する場合は確信度を上げ、
              # 一方だけに存在する場合も補助根拠として利用する。
              MAL_GENRE = {
                  "Action":"アクション","Adventure":"冒険","Comedy":"コメディ","Drama":"ドラマ",
                  "Fantasy":"ファンタジー","Horror":"ホラー","Mystery":"推理","Romance":"恋愛",
                  "Sci-Fi":"SF","Sports":"スポーツ","School":"学園",
                  "Slice of Life":"日常","Music":"音楽","Military":"ミリタリー","Historical":"歴史",
                  "Mecha":"メカ","Supernatural":"超自然","Psychological":"心理","Suspense":"サスペンス"
              }
              for mg in mal_genres or []:
                  target = MAL_GENRE.get(str(mg).strip())
                  if target in scores:
                      scores[target] = max(scores[target], 0.88)
                      reasons[target].append("MyAnimeList genre: " + str(mg))

              # 2. AniList tag。rankを重みとして利用。
              for name, rules in TAG_RULES.items():
                  if name not in scores:
                      continue
                  s = tag_score(tags, rules)
                  if s > scores[name]:
                      scores[name] = s
                      reasons[name].append("AniList tag evidence")

              # 3. 形式はショートの強い根拠。ただし通常作品を短いから勝手に別ジャンル化しない。
              fmt = norm(media.get("format")).upper()
              duration = media.get("duration")
              if "ショート" in scores and (
                  fmt == "TV_SHORT" or (isinstance(duration, int) and 0 < duration < 15)
              ):
                  scores["ショート"] = 1.0
                  reasons["ショート"].append("format/duration")

              # 4. 説明文の単語だけではジャンルを決めない。
              # 「ドラマ」「恋愛」「青春」などは多くの作品説明に登場するため、
              # それだけを根拠にすると誤分類が大量に発生する。
              # ジャンル判定はAniList genre / AniList tag / MAL genreを中心に行う。
              # ここではdescription keywordによる加点を廃止する。

              # 5. Evidence-first selection.
              # 根拠のないジャンルを「3個にするためだけ」に補完しない。
              # AniList genre > MAL genre > AniList tag > description keyword の順で評価し、
              # 独立した根拠があるものだけを採用する。
              strong = [(name, score) for name, score in scores.items() if score >= 0.78]
              strong.sort(key=lambda x: (-x[1], ALL_NAMES.index(x[0])))

              secondary = [(name, score) for name, score in scores.items() if 0.68 <= score < 0.78]
              secondary.sort(key=lambda x: (-x[1], ALL_NAMES.index(x[0])))

              selected = strong[:5]
              chosen = {x[0] for x in selected}

              for candidate in secondary:
                  if candidate[0] not in chosen:
                      selected.append(candidate)
                      chosen.add(candidate[0])
                  if len(selected) >= 5:
                      break

              tertiary = [(name, score) for name, score in scores.items() if 0.55 <= score < 0.68]
              tertiary.sort(key=lambda x: (-x[1], ALL_NAMES.index(x[0])))
              for candidate in tertiary:
                  if candidate[0] not in chosen:
                      selected.append(candidate)
                      chosen.add(candidate[0])
                  if len(selected) >= 3:
                      break

              # それでも3件未満なら、根拠のない固定ジャンルは付与しない。
              # 次回の監査対象に残し、外部ソース更新後に再分類する。

              selected = selected[:5]

              if selected:
                  avg = sum(s for _, s in selected) / len(selected)
                  confidence = min(0.99, avg + min(0.05, 0.01 * len(selected)))
              else:
                  confidence = 0.0

              flat_reasons = []
              for name, score in selected:
                  for reason in reasons[name][:2]:
                      flat_reasons.append(f"{name}: {reason} ({score:.2f})")

              return [name for name, _ in selected], round(confidence, 4), flat_reasons

          # 全公開作品を自動監査する。
          # 旧バージョンの作品、ジャンル3個未満の作品をDB側のRPCで抽出する。
          # 一度修正された作品は次回以降スキップされるため、15分ごとの実行で
          # 全作品を段階的に再構成し、将来ジャンルが欠落した場合も自動修復する。
          def fetch_candidates():
              return sb(
                  "/rest/v1/rpc/get_anime_genre_repair_batch",
                  "POST",
                  {
                      "p_version": VERSION,
                      "p_limit": BATCH
                  }
              )


          rows = fetch_candidates()
          if not rows:
              print("No anime remain to classify.")
              raise SystemExit(0)

          # 現在付与されているジャンルを取得し、根拠不足時の補助に使う。
          anime_ids = [int(r["id"]) for r in rows]
          existing_rows = sb(
              "/rest/v1/anime_genres",
              params={
                  "select": "anime_id,genre_id",
                  "anime_id": "in.(" + ",".join(map(str, anime_ids)) + ")",
                  "limit": "5000"
              }
          )
          EXISTING = {}
          for er in existing_rows:
              EXISTING.setdefault(int(er["anime_id"]), []).append(int(er["genre_id"]))

          # AniListを一括取得。
          # 新規登録時は source_id が「2000000000 + AniList ID」に正規化される
          # ケースがあるため、必ず実IDへ戻して問い合わせる。
          def resolve_anilist_id(row):
              provider = (row.get("source_provider") or "").lower()
              candidates = []
              if str(row.get("source_id") or "").isdigit():
                  candidates.append(int(row["source_id"]))
              if row.get("external_id") is not None and str(row.get("external_id")).isdigit():
                  candidates.append(int(row["external_id"]))
              for value in candidates:
                  if provider == "anilist" and value > 2000000000:
                      return value - 2000000000
                  if provider == "anilist":
                      return value
                  if provider == "":
                      # 旧データは external_id にAniList IDを保持している。
                      if value > 2000000000:
                          return value - 2000000000
                      if 0 < value < 2000000000:
                          return value
              return None

          ani_rows = []
          for r in rows:
              aid = resolve_anilist_id(r)
              if aid:
                  r["_anilist_id"] = aid
                  ani_rows.append(r)


          query = """
          query($ids:[Int],$page:Int,$perPage:Int){
            Page(page:$page,perPage:$perPage){
              media(id_in:$ids,type:ANIME){
                id
                format
                duration
                episodes
                title { native romaji english userPreferred }
                description(asHtml:false)
                genres
                idMal
                tags { name rank isMediaSpoiler isGeneralSpoiler category }
              }
            }
          }
          """

          media_by_id = {}
          for start in range(0, len(ani_rows), 50):
              chunk = ani_rows[start:start+50]
              ids = [int(r["_anilist_id"]) for r in chunk]
              response = http(
                  ANI,
                  "POST",
                  {
                      "query": query,
                      "variables": {"ids": ids, "page": 1, "perPage": 50}
                  }
              )
              media = ((response.get("data") or {}).get("Page") or {}).get("media") or []
              for m in media:
                  media_by_id[int(m["id"])] = m
              time.sleep(0.4)


          # MyAnimeList照合。JikanはMyAnimeListのデータを取得するAPIで、
          # 作品ページから公式タイトル・ジャンル等を取得できる。
          # リクエスト間隔を空け、取得失敗時はAniListだけで分類する。
          mal_genres_by_id = {}
          for m in media_by_id.values():
              mid = m.get("idMal")
              if not mid:
                  continue
              try:
                  response = http(MAL_API + "/anime/" + str(int(mid)))
                  data = response.get("data") or {}
                  mal_genres_by_id[int(m["id"])] = [g.get("name") for g in (data.get("genres") or []) if g.get("name")]
              except Exception as e:
                  print("MAL lookup failed", mid, str(e)[:120])
              time.sleep(0.35)

          updates = []
          skipped_source = 0
          no_evidence = 0

          now = datetime.now(timezone.utc).isoformat()

          for row in rows:
              media = media_by_id.get(int(row["_anilist_id"])) if row.get("_anilist_id") else None

              if media is None:
                  # AniListで取得不能な作品は、既存ジャンルを推測で上書きしない。
                  # 「取得不能」という事実だけを記録し、次回の更新対象として残す。
                  skipped_source += 1
                  continue

              names, confidence, reasons = classify(media, EXISTING.get(int(row["id"]), []), mal_genres_by_id.get(int(row["_anilist_id"]), []))
              genre_ids = [GENRE_ID[n] for n in names if n in GENRE_ID]

              if not genre_ids:
                  no_evidence += 1

              updates.append({
                  "anime_id": int(row["id"]),
                  "genre_ids": genre_ids,
                  "confidence": confidence,
                  "reasons": reasons,
                  "version": VERSION,
                  "classified_at": now
              })

          if updates:
              changed = sb(
                  "/rest/v1/rpc/bulk_replace_anime_genres",
                  "POST",
                  updates
              )
          else:
              changed = 0

          print(json.dumps({
              "candidate_count": len(rows),
              "anilist_records": len(ani_rows),
              "mal_records": len(mal_genres_by_id),
              "classified_records": len(updates),
              "db_changed": changed,
              "no_evidence": no_evidence,
              "source_unavailable": skipped_source,
              "genre_count_in_db": len(GENRE_ID),
              "version": VERSION
          }, ensure_ascii=False))
          PY
