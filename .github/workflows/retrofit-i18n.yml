name: Apply ANIXIA language and design layer

on:
  push:
    paths:
      - "anixia-i18n.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anixia-i18n-retrofit
  cancel-in-progress: false

jobs:
  retrofit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add shared language switcher to every public page
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          changed = []
          for path in root.rglob("*.html"):
              rel = path.as_posix()
              if rel.startswith(".git/") or re.fullmatch(r"google[0-9a-f]+\.html", path.name):
                  continue
              text = path.read_text(encoding="utf-8")
              relative_script = Path(__import__("os").path.relpath("anixia-i18n.js", path.parent)).as_posix()
              tag = f'<script src="{relative_script}?v=20261119-r6" defer></script>'
              if "anixia-i18n.js" not in text:
                  if re.search(r"</body>", text, flags=re.I):
                      text = re.sub(r"</body>", tag + "\n</body>", text, count=1, flags=re.I)
                  else:
                      text += "\n" + tag + "\n"
              text = re.sub(r'(site-theme\.css\?v=)[^"\']+', r'\g<1>anixia-design-v4-20261119', text)
              text = re.sub(r'(anixia-i18n\.js\?v=)[^"\']+', r'\g<1>20261119-r6', text)
              if text != path.read_text(encoding="utf-8"):
                  path.write_text(text, encoding="utf-8")
                  changed.append(rel)
          print(f"Updated {len(changed)} HTML files")
          print("\n".join(changed[:30]))
          PY

      - name: Commit generated page updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git commit -m "Apply shared ANIXIA language and design layer to all pages"
          git pull --rebase origin main
          git push
