name: Animecia Data Backfill

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: "1回の処理件数"
        required: false
        default: "150"

permissions:
  contents: read

concurrency:
  group: animecia-data-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BATCH: ${{ inputs.batch || '150' }}
    steps:
      - name: Backfill genres and Japanese official websites
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, time, urllib.parse, urllib.request, urllib.error

          U=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SECRET_KEY"]
          BATCH=max(20,min(50,int(os.environ.get("BATCH","50"))))
          UA="Animecia-DataBackfill/1.0"
          # Official URL policy: never expose AniList/ANN/social/profile pages as an Animecia official site.

          ALLOWED=[
            "SF","ファンタジー","超自然","心理","ロボット","メカ","アクション","バトル","コメディ","ギャグ",
            "恋愛","ラブコメ","日常","ほのぼの","スポーツ","競技","ホラー","サスペンス",
            "推理","歴史","戦記","戦争","ミリタリー","ドラマ","青春","音楽","アイドル",
            "学園","魔法","魔法少女","異世界","冒険","キッズ","ファミリー","ショート"
          ]

          def request(url, method="GET", body=None, headers=None, timeout=45):
            h={"User-Agent":UA,"Accept":"application/json,text/html,*/*"}
            if headers: h.update(headers)
            data=None if body is None else json.dumps(body,ensure_ascii=False).encode()
            req=urllib.request.Request(url,data=data,method=method,headers=h)
            for attempt in range(5):
              try:
                with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(),dict(r.headers)
              except urllib.error.HTTPError as e:
                detail=e.read().decode("utf-8","replace")[:1200]
                print(f"HTTP {e.code} from {url}: {detail}",flush=True)
                if e.code in (429,500,502,503,504) and attempt<4:
                  time.sleep(2**attempt); continue
                raise

          def sb(path,method="GET",body=None,params=None):
            url=U+path
            if params: url+="?"+urllib.parse.urlencode(params,doseq=True)
            raw,_=request(url,method,body,{
              "apikey":KEY,"Authorization":"Bearer "+KEY,
              "Content-Type":"application/json","Prefer":"return=representation"
            })
            return json.loads(raw.decode()) if raw else []

          def update(aid,patch):
            return sb("/rest/v1/anime", "PATCH", patch, {"id":"eq."+str(aid)})

          def norm(s):
            return re.sub(r"[^0-9a-zA-Zぁ-んァ-ヶ一-龠]","",str(s or "")).lower()

          def anilist_by_ids(ids):
            if not ids: return {}
            q="""query($ids:[Int!]){Page(page:1,perPage:50){media(id_in:$ids,type:ANIME){
              id title{native romaji english userPreferred} genres description(asHtml:false) studios(isMain:true,perPage:10){nodes{id name siteUrl}} source relations{edges{relationType node{type title{native userPreferred romaji}}}} staff(perPage:20){edges{role node{name{native userPreferred}}}}
              externalLinks{url site language type}
              siteUrl coverImage{large}
            }}}"""
            raw,_=request("https://graphql.anilist.co","POST",
              {"query":q,"variables":{"ids":ids}},
              {"Content-Type":"application/json","Accept":"application/json"})
            data=json.loads(raw.decode())
            return {x["id"]:x for x in data.get("data",{}).get("Page",{}).get("media",[])}

          def anilist_search(title):
            q="""query($s:String!){Page(page:1,perPage:3){media(search:$s,type:ANIME,sort:SEARCH_MATCH){
              id title{native romaji english userPreferred} genres
              externalLinks{url site language type} siteUrl
            }}}"""
            raw,_=request("https://graphql.anilist.co","POST",
              {"query":q,"variables":{"s":title}},
              {"Content-Type":"application/json","Accept":"application/json"})
            return json.loads(raw.decode()).get("data",{}).get("Page",{}).get("media",[])

          def choose_match(title,items):
            nt=norm(title)
            if not nt: return None
            best=None
            for x in items:
              ts=x.get("title") or {}
              vals=[ts.get("native"),ts.get("userPreferred"),ts.get("romaji"),ts.get("english")]
              scores=[]
              for v in vals:
                nv=norm(v)
                if nv==nt: scores.append(100)
                elif nt in nv or nv in nt: scores.append(82)
              score=max(scores or [0])
              if score>=82 and (best is None or score>best[0]): best=(score,x)
            return best[1] if best else None

          def japanese_official(url,title):
            try:
              host=(urllib.parse.urlparse(url).hostname or "").lower()
              if any(bad in host for bad in ("twitter.com","x.com","facebook.com","instagram.com","youtube.com","wikipedia.org","myanimelist.net","anilist.co","animenewsnetwork.com","crunchyroll.com")):
                return False
              raw,_=request(url,"GET",None,{"Accept":"text/html,application/xhtml+xml"},20)
              html=raw.decode("utf-8","ignore")[:120000]
              return bool(re.search(r"[ぁ-んァ-ヶ一-龠]",html))
            except Exception:
              return False

          SOURCE_MAP={
            "ORIGINAL":"オリジナル","MANGA":"漫画","LIGHT_NOVEL":"ライトノベル",
            "NOVEL":"小説","WEB_NOVEL":"Web小説","GAME":"ゲーム","VISUAL_NOVEL":"ゲーム",
            "VIDEO_GAME":"ゲーム","CARD_GAME":"ゲーム","BOOK":"小説","OTHER":"その他"
          }

          def original_meta(media):
            source=SOURCE_MAP.get(media.get("source"),media.get("source"))
            original_title=None
            authors=[]
            # Prefer a related manga/novel/game title over the anime's own title.
            for edge in (media.get("relations") or {}).get("edges",[]):
              node=edge.get("node") or {}
              if node.get("type") in ("MANGA","NOVEL","ONE_SHOT","VIDEO_GAME","VISUAL_NOVEL","GAME"):
                t=node.get("title") or {}
                original_title=t.get("native") or t.get("userPreferred") or t.get("romaji")
                if original_title: break
            for edge in (media.get("staff") or {}).get("edges",[]):
              role=(edge.get("role") or "").lower()
              node=edge.get("node") or {}
              name=(node.get("name") or {}).get("native") or (node.get("name") or {}).get("userPreferred")
              if name and any(k in role for k in ("original creator","original author","story","原作")):
                if name not in authors: authors.append(name)
            return source,original_title,", ".join(authors)

          def genres_for(media):
            vals=[]
            for raw in media.get("genres") or []:
              key=str(raw).strip().lower()
              mp={
                "action":"アクション","adventure":"冒険","comedy":"コメディ","drama":"ドラマ",
                "fantasy":"ファンタジー","horror":"ホラー","mystery":"推理","romance":"恋愛",
                "sci-fi":"SF","slice of life":"日常","sports":"スポーツ","supernatural":"超自然",
                "thriller":"サスペンス","school":"学園","music":"音楽","historical":"歴史",
                "military":"ミリタリー","mecha":"メカ","psychological":"心理",
                "isekai":"異世界","mahou shoujo":"魔法少女"
              }
              out=mp.get(key)
              if out and out in ALLOWED and out not in vals: vals.append(out)
            return vals

          def official(media):
            links=media.get("externalLinks") or []
            candidates=[]
            for x in links:
              url=x.get("url") or ""
              if not url.startswith(("http://","https://")): continue
              site=(x.get("site") or "").lower()
              lang=(x.get("language") or "").lower()
              typ=(x.get("type") or "").lower()
              if any(bad in site for bad in ("twitter","x.com","facebook","instagram","youtube","myanimelist","wikipedia","anilist","animenewsnetwork")): continue
              score=0
              if "official" in typ or "official" in site: score+=30
              if lang in ("ja","japanese"): score+=40
              host=urllib.parse.urlparse(url).hostname or ""
              if host.endswith(".jp") or ".co.jp" in host: score+=20
              if "公式" in site: score+=40
              candidates.append((score,url))
            candidates.sort(reverse=True)
            return candidates[0][1] if candidates and candidates[0][0]>=40 else None

          # Phase 1: fill missing genre data.
          rows=sb("/rest/v1/anime","GET",None,{
            "select":"id,title_japanese,title_native,title_user_preferred,title_romaji,title_english,source_provider,source_id,genre,official_url,synopsis,synopsis",
            "anime_verification_status":"eq.verified",
            "start_date":"gte.1963-01-01",
            "or":"(genre.is.null,genre.eq.)",
            "order":"id.asc",
            "limit":str(BATCH)
          })
          phase="genre"

          # Phase 2: fill missing Japanese official websites.
          if not rows:
            rows=sb("/rest/v1/anime","GET",None,{
              "select":"id,title_japanese,title_native,title_user_preferred,title_romaji,title_english,source_provider,source_id,genre,official_url",
              "anime_verification_status":"eq.verified",
              "start_date":"gte.1963-01-01",
              "or":"(official_url.is.null,official_url.eq.)",
              "order":"id.asc",
              "limit":str(BATCH)
            })
            phase="official"

          # Phase 3: audit existing official URLs conservatively.
          if not rows:
            rows=sb("/rest/v1/anime","GET",None,{
              "select":"id,title_japanese,title_native,title_user_preferred,title_romaji,title_english,source_provider,source_id,genre,official_url",
              "anime_verification_status":"eq.verified",
              "start_date":"gte.1963-01-01",
              "official_url":"not.is.null",
              "order":"id.asc",
              "limit":str(BATCH)
            })
            phase="audit"

          anilist_ids=[]
          for r in rows:
            if r.get("source_provider")=="anilist" and str(r.get("source_id") or "").isdigit():
              anilist_ids.append(int(r["source_id"]))
          medias=anilist_by_ids(anilist_ids)

          updated=0
          for r in rows:
            title=r.get("title_japanese") or r.get("title_native") or r.get("title_user_preferred") or r.get("title_romaji") or r.get("title_english")

            # Existing-link audit does not require AniList metadata.
            if phase=="audit" and r.get("official_url"):
              patch={}
              try:
                host=(urllib.parse.urlparse(r["official_url"]).hostname or "").lower()
                if any(bad in host for bad in ("twitter.com","x.com","facebook.com","instagram.com","youtube.com","wikipedia.org","myanimelist.net","anilist.co","animenewsnetwork.com")):
                  patch["official_url"]=None
                else:
                  raw,_=request(r["official_url"],"GET",None,{"Accept":"text/html,application/xhtml+xml"},15)
                  html=raw.decode("utf-8","ignore")[:100000]
                  if not re.search(r"[ぁ-んァ-ヶ一-龠]",html) and not (host.endswith(".jp") or ".co.jp" in host):
                    patch["official_url"]=None
              except urllib.error.HTTPError as e:
                if e.code in (404,410):
                  patch["official_url"]=None
              except Exception:
                pass
              if patch:
                update(r["id"],patch)
                updated+=1
              continue

            media=None
            sid=str(r.get("source_id") or "")
            if r.get("source_provider")=="anilist" and sid.isdigit():
              media=medias.get(int(sid))
            if media is None and title:
              try:
                media=choose_match(title,anilist_search(title))
                time.sleep(.35)
              except Exception:
                media=None
            if not media: continue

            # Fill relation tables from AniList for existing works.
            existing_genres=sb("/rest/v1/anime_genres","GET",None,{"select":"genre_id","anime_id":"eq."+str(r["id"])})
            existing_genre_ids={x["genre_id"] for x in existing_genres}
            genre_rows=sb("/rest/v1/genres","GET",None,{"select":"id,name","limit":"100"})
            genre_ids={x["name"]:x["id"] for x in genre_rows}
            genre_map={"Action":"アクション","Adventure":"冒険","Comedy":"コメディ","Drama":"ドラマ","Fantasy":"ファンタジー","Horror":"ホラー","Romance":"恋愛","Sci-Fi":"SF","Slice of Life":"日常","Sports":"スポーツ","School":"学園","Music":"音楽","Historical":"歴史","Military":"ミリタリー","Mecha":"メカ","Mystery":"推理","Thriller":"サスペンス","Isekai":"異世界","Magical Girl":"魔法少女","Supernatural":"超自然","Psychological":"心理"}
            for raw_genre in media.get("genres") or []:
              gid=genre_ids.get(genre_map.get(raw_genre))
              if gid and gid not in existing_genre_ids:
                sb("/rest/v1/anime_genres","POST",[{"anime_id":r["id"],"genre_id":gid}],"return=minimal")
                existing_genre_ids.add(gid)

            existing_studios=sb("/rest/v1/anime_studios","GET",None,{"select":"studio_id","anime_id":"eq."+str(r["id"])})
            existing_studio_ids={x["studio_id"] for x in existing_studios}
            for studio in ((media.get("studios") or {}).get("nodes") or []):
              if not studio.get("id") or not studio.get("name"): continue
              sb("/rest/v1/studios","POST",[{"external_id":studio["id"],"name":studio["name"],"site_url":studio.get("siteUrl")}],"return=minimal,resolution=ignore-duplicates")
              found=sb("/rest/v1/studios","GET",None,{"select":"id","external_id":"eq."+str(studio["id"]),"limit":"1"})
              if found:
                studio_id=found[0]["id"]
                if studio_id not in existing_studio_ids:
                  sb("/rest/v1/anime_studios","POST",[{"anime_id":r["id"],"studio_id":studio_id}],"return=minimal")
                  existing_studio_ids.add(studio_id)

            patch={}
            gs=genres_for(media)
            osrc,otitle,oauth=original_meta(media)
            if osrc and not r.get("original_source"): patch["original_source"]=osrc
            if otitle and not r.get("original_title"): patch["original_title"]=otitle
            if oauth and not r.get("original_authors"): patch["original_authors"]=oauth
            desc=media.get("description") or ""
            if (not r.get("synopsis")) and desc.strip():
              patch["synopsis"]=re.sub(r"\\s+"," ",desc).strip()
              patch["synopsis_source"]="AniList"
              patch["synopsis_updated_at"]="now()"
            if (not r.get("genre")) and gs:
              patch["genre"]=", ".join(gs)
            if (not r.get("official_url")):
              url=official(media)
              if url and japanese_official(url,title): patch["official_url"]=url

            if patch:
              update(r["id"],patch)
              updated+=1

          print(json.dumps({"candidates":len(rows),"updated":updated},ensure_ascii=False))
          PY
