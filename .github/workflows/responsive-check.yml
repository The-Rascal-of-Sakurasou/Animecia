name: Responsive layout smoke test

concurrency:
  group: anixia-site-validation
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site-theme.css"
      - "anixia-i18n.js"
      - "sw.js"
      - "performance.js"
      - "anixia-global-header.js"
      - "*.html"
      - "*.js"
      - "supabase/migrations/**"
      - "anime/**/index.html"
      - "genre/**/index.html"
      - ".github/workflows/responsive-check.yml"
  schedule:
    - cron: "23 18 * * 1"

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit every published HTML file and local page link
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, existsSync, statSync } from 'node:fs';
          import { resolve, relative, sep } from 'node:path';

          const root = process.cwd();
          const ignored = new Set(['googlec7373bcce91aea2b.html']);
          const files = [];
          function walk(dir) {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const full = resolve(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.html')) {
                files.push(relative(root, full).split(sep).join('/'));
              }
            }
          }
          walk(root);

          const failures = [];
          function localTarget(value, sourceFile) {
            if (!value || value.startsWith('#') || /^(?:mailto:|tel:|javascript:|data:|blob:|ftp:|\/\/)/i.test(value)) return null;
            let url;
            try {
              url = new URL(value, 'https://the-rascal-of-sakurasou.github.io/anixia/' + sourceFile);
            } catch {
              return null;
            }
            if (url.origin !== 'https://the-rascal-of-sakurasou.github.io') return null;
            let pathname = decodeURIComponent(url.pathname);
            if (pathname === '/anixia' || pathname === '/anixia/') pathname = '/anixia/index.html';
            if (!pathname.startsWith('/anixia/')) return null;
            let rel = pathname.slice('/anixia/'.length);
            if (!rel || rel.endsWith('/')) rel += 'index.html';
            let target = resolve(root, rel);
            if (!target.startsWith(root + sep) && target !== root) return null;
            if (existsSync(target) && statSync(target).isDirectory()) target = resolve(target, 'index.html');
            return { target, rel };
          }

          for (const file of files) {
            if (ignored.has(file)) continue;
            const html = readFileSync(resolve(root, file), 'utf8');
            if (!/name=["']viewport["']/i.test(html)) failures.push(file + ': missing viewport meta');
            if (!/anixia-i18n\.js/i.test(html)) failures.push(file + ': missing shared language script');
            if (!/(?:site-theme\.css|performance\.js|anixia-global-header\.js)/i.test(html)) failures.push(file + ': missing shared design loader');

            for (const match of html.matchAll(/(?:href|src)=["']([^"']+)["']/gi)) {
              const value = match[1];
              if (!/\.html(?:[?#]|$)|\.(?:js|css)(?:[?#]|$)/i.test(value)) continue;
              const resolved = localTarget(value, file);
              if (resolved && !existsSync(resolved.target)) {
                failures.push(file + ': missing local target ' + value + ' -> ' + resolved.rel);
              }
            }
          }

          console.log('Audited ' + files.length + ' HTML files (including generated anime and genre pages).');
          if (failures.length) {
            console.error('HTML source audit failures (' + failures.length + '):');
            console.error(failures.slice(0, 150).join('\n'));
            if (failures.length > 150) console.error('... and ' + (failures.length - 150) + ' more');
            process.exit(1);
          }
          console.log('All page templates, responsive metadata, language scripts and local HTML/JS/CSS targets passed.');
          NODE
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check representative pages at desktop, tablet and mobile widths
        env:
          BASE_URL: https://the-rascal-of-sakurasou.github.io/anixia/
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdirSync, readdirSync } from 'node:fs';
          import { join, relative, sep } from 'node:path';

          const base = process.env.BASE_URL;
          const pages = [
            '',
            'anime.html', 'discover.html', 'season.html',
            'ranking.html', 'recommendations.html', 'compare.html',
            'entities.html', 'genres.html',
            'community.html', 'messages.html', 'mypage.html',
            'quiz.html', 'quiz-play.html',
            'login.html', 'signup.html', 'privacy.html',
            'admin.html'
          ];
          // Add a deterministic sample of generated work and genre pages.
          function collectIndexPages(root) {
            const found = [];
            function walk(dir) {
              for (const entry of readdirSync(dir, { withFileTypes: true })) {
                const full = join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.isFile() && entry.name === 'index.html') {
                  found.push(relative(process.cwd(), full).split(sep).join('/'));
                }
              }
            }
            walk(root);
            const sorted = found.sort();
            if (sorted.length <= 12) return sorted;
            // Spread the sample across the full ID range instead of checking only early IDs.
            return Array.from({ length: 12 }, (_, i) => sorted[Math.round(i * (sorted.length - 1) / 11)]);
          }
          for (const root of ['anime', 'genre']) {
            const samples = collectIndexPages(root);
            console.log(`${root}: selected ${samples.length} distributed pages`);
            pages.push(...samples);
          }
          const widths = [320, 375, 768, 1366];
          const browser = await chromium.launch({ headless: true });
          const failures = [];
          mkdirSync('responsive-failures', { recursive: true });
          const saveFailureScreenshot = async (page, path, width) => {
            const safePath = (path || 'home').replace(/[^a-zA-Z0-9_-]+/g, '_').slice(0, 100);
            try {
              await page.screenshot({ path: `responsive-failures/${safePath}-${width}px.png`, fullPage: false });
            } catch (error) {
              console.warn(`Could not save screenshot for ${path} @ ${width}px: ${error.message}`);
            }
          };
          try {
            const page = await browser.newPage({ viewport: { width: 1366, height: 900 } });
            for (const path of pages) {
              for (const width of widths) {
                await page.setViewportSize({ width, height: 900 });
                const pageErrors = [];
                const onPageError = error => { if (!error.message.includes('ANIXIAAuth is not defined')) pageErrors.push(error.message); };
                page.on('pageerror', onPageError);
                try {
                  const url = new URL(path, base).href;
                  const response = await page.goto(url, {
                    waitUntil: 'domcontentloaded',
                    timeout: 30000
                  });
                  await page.waitForTimeout(120);
                  const result = await page.evaluate(() => ({
                    viewport: document.documentElement.clientWidth,
                    document: document.documentElement.scrollWidth,
                    body: document.body?.scrollWidth ?? 0,
                    title: document.title,
                    header: (() => { const el = document.querySelector("body > .anixia-global-header"); if (!el) return null; const r = el.getBoundingClientRect(); const s = getComputedStyle(el); return {position:s.position,top:r.top,bottom:r.bottom,height:r.height}; })(),
                    footer: (() => { const el = document.querySelector("body > footer.anixia-global-footer"); if (!el) return null; const r = el.getBoundingClientRect(); const s = getComputedStyle(el); return {position:s.position,top:r.top,bottom:r.bottom,height:r.height,maxHeight:s.maxHeight}; })(),
                    bodyPaddingTop: parseFloat(getComputedStyle(document.body).paddingTop),
                    bodyPaddingBottom: parseFloat(getComputedStyle(document.body).paddingBottom)
                  }));
                  let hasFailure = false;
                  if (!response?.ok()) {
                    failures.push(`${path || '/'} @ ${width}px: HTTP ${response?.status() ?? 'no response'}`);
                    hasFailure = true;
                  }
                  if (result.document > result.viewport + 2 || result.body > result.viewport + 2) {
                    failures.push(`${path || '/'} @ ${width}px: horizontal overflow (viewport=${result.viewport}, document=${result.document}, body=${result.body})`);
                    hasFailure = true;
                  }
                  if (!result.header || result.header.position !== 'fixed' || Math.abs(result.header.top) > 2 || result.header.height < 1 || result.bodyPaddingTop < result.header.height - 2) {
                    failures.push(`${path || '/'} @ ${width}px: header is not fixed at the top or body clearance is insufficient (${JSON.stringify({header:result.header,paddingTop:result.bodyPaddingTop})})`);
                    hasFailure = true;
                  }
                  if (!result.footer || result.footer.position !== 'fixed' || Math.abs(result.footer.bottom - 900) > 2 || result.footer.height < 1 || result.bodyPaddingBottom < result.footer.height - 2) {
                    failures.push(`${path || '/'} @ ${width}px: footer is not fixed at the bottom or body clearance is insufficient (${JSON.stringify({footer:result.footer,paddingBottom:result.bodyPaddingBottom})})`);
                    hasFailure = true;
                  }
                  for (const message of pageErrors) {
                    failures.push(`${path || '/'} @ ${width}px: JavaScript page error: ${message}`);
                    hasFailure = true;
                  }
                  if (hasFailure) await saveFailureScreenshot(page, path, width);
                  console.log(`${response?.status() ?? 'ERR'} ${path || '/'} @ ${width}px — ${result.title}`);
                } catch (error) {
                  failures.push(`${path || '/'} @ ${width}px: ${error.message}`);
                  await saveFailureScreenshot(page, path, width);
                } finally {
                  page.removeListener('pageerror', onPageError);
                }
              }
            }
          } finally {
            await browser.close();
          }
          if (failures.length) {
            console.error('\nResponsive smoke-test failures:\n' + failures.join('\n'));
            process.exit(1);
          }
          console.log('\nResponsive smoke test passed for all representative pages and viewport widths.');
          NODE
      - name: Check Japanese and English language switching
        env:
          BASE_URL: https://the-rascal-of-sakurasou.github.io/anixia/
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          try {
            await page.goto(process.env.BASE_URL, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector('#language-toggle', { timeout: 10000 });
            await page.click('#language-toggle');
            await page.waitForFunction(() => document.documentElement.lang === 'en');
            if (await page.evaluate(() => localStorage.getItem('anixia-language')) !== 'en') throw new Error('English preference was not saved.');
            await page.goto(new URL('anime.html', process.env.BASE_URL).href, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => document.documentElement.lang === 'en');
            if (!(await page.locator('#language-toggle').textContent()).includes('日本語')) throw new Error('Language preference did not persist.');
            await page.click('#language-toggle');
            await page.waitForFunction(() => document.documentElement.lang === 'ja');
            console.log('Japanese / English switching and cross-page persistence passed.');
          } finally { await browser.close(); }
          NODE
      - name: Verify home, quiz and recommendation page headers and panels
        env:
          BASE_URL: https://the-rascal-of-sakurasou.github.io/anixia/
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1366, height: 900 } });
          const checks = [
            { path: '', panel: null },
            { path: 'quiz.html', panel: '.quiz-hero' },
            { path: 'recommendations.html', panel: '.diag-hero' }
          ];
          const failures = [];
          try {
            for (const item of checks) {
              const response = await page.goto(new URL(item.path, process.env.BASE_URL).href, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForSelector('body > header.anixia-global-header', { timeout: 15000 });
              await page.waitForTimeout(250);
              const result = await page.evaluate(panelSelector => {
                const header = document.querySelectorAll('body > header.anixia-global-header');
                const account = document.querySelectorAll('body > header.anixia-global-header #account-link');
                const staleHeader = document.querySelectorAll('body > header:not(.anixia-global-header)');
                const staleMyPage = document.querySelectorAll('#mypage-link');
                const panel = panelSelector ? document.querySelector(panelSelector) : null;
                const panelStyle = panel ? getComputedStyle(panel) : null;
                return {
                  headerCount: header.length,
                  accountCount: account.length,
                  staleHeaderCount: staleHeader.length,
                  staleMyPageCount: staleMyPage.length,
                  panelFound: panelSelector ? !!panel : true,
                  panelBackground: panelStyle?.backgroundColor ?? null,
                  panelBorder: panelStyle?.borderTopColor ?? null
                };
              }, item.panel);
              if (!response?.ok()) failures.push(`${item.path || 'home'}: HTTP ${response?.status()}`);
              if (result.headerCount !== 1 || result.accountCount !== 1 || result.staleHeaderCount !== 0 || result.staleMyPageCount !== 0) {
                failures.push(`${item.path || 'home'}: duplicate or missing header/account control: ${JSON.stringify(result)}`);
              }
              if (!result.panelFound || (item.panel && (result.panelBackground !== 'rgb(255, 255, 255)' || result.panelBorder !== 'rgb(229, 231, 235)'))) {
                failures.push(`${item.path}: panel does not match the shared white/neutral design: ${JSON.stringify(result)}`);
              }
              console.log(`Targeted page check ${item.path || 'home'}: ${JSON.stringify(result)}`);
            }
          } finally { await browser.close(); }
          if (failures.length) {
            console.error(failures.join('\\n'));
            process.exit(1);
          }
          console.log('Home, quiz and recommendation header/panel checks passed.');
          NODE
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-failure-screenshots
          path: responsive-failures/
          if-no-files-found: ignore
          retention-days: 7
