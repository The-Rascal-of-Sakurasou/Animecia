name: Optimize site performance
on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "**/*.html"
      - "scripts/optimize-html-performance.mjs"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Animecia Sitemap
    types:
      - completed
permissions:
  contents: write
jobs:
  optimize:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/optimize-html-performance.mjs
      - name: Optimize and push with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/optimize-html-performance.mjs
            git add -- '*.html'
            if git diff --cached --quiet; then
              echo "No HTML changes."
              exit 0
            fi
            git commit -m "perf: automated HTML performance optimization [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected; retrying from the latest main (attempt $attempt/3)."
          done
          echo "Could not push optimized HTML after 3 attempts."
          exit 1
