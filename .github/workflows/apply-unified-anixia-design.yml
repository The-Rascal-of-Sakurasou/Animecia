name: Apply unified ANIXIA design
on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-unified-design.mjs"
      - "scripts/generate-anime-seo-pages.mjs"
      - "scripts/update-genre-pages.mjs"
      - ".github/workflows/apply-unified-anixia-design.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anixia-unified-design
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply shared header, footer and theme to root pages
        run: node scripts/apply-unified-design.mjs
      - name: Commit root page updates
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html' anixia-home.js
            git commit -m "Apply unified ANIXIA shell to all main pages"
            git push
          fi
      - name: Update generated genre pages
        run: node scripts/update-genre-pages.mjs      - name: Commit all page updates
        run: |
          if ! git diff --quiet; then
            git add -A
            git commit -m "Apply unified ANIXIA design to every page"
            git push
          fi
