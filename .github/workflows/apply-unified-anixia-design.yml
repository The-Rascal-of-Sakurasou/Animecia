name: Apply unified ANIXIA design
on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-unified-design.mjs"
      - "scripts/generate-anime-seo-pages.mjs"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anixia-unified-design
  cancel-in-progress: false
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply shared header, footer and theme to root pages
        run: node scripts/apply-unified-design.mjs
      - name: Commit root page updates
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html' anixia-home.js
            git commit -m "Apply unified ANIXIA shell to all main pages"
            git push
          fi
      - name: Validate SEO generation configuration
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::SUPABASE_URL is missing" && exit 1)
          test -n "$SUPABASE_SECRET_KEY" || (echo "::error::SUPABASE_SECRET_KEY is missing" && exit 1)
      - name: Regenerate anime and genre SEO pages
        run: node scripts/generate-anime-seo-pages.mjs
      - name: Commit generated page updates
        run: |
          if ! git diff --quiet; then
            git add anime genre
            git commit -m "Apply unified ANIXIA design to generated SEO pages"
            git push
          fi
