name: Update ANIXIA genre pages
on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-anime-seo-pages.mjs"
      - "scripts/update-genre-pages.mjs"
      - ".github/workflows/apply-unified-anixia-design.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anixia-genre-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update generated genre pages
        run: node scripts/update-genre-pages.mjs
      - name: Commit generated genre pages
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add genre
            git commit -m "Apply responsive design to generated genre pages"
            git pull --rebase origin main
            git push
          fi
