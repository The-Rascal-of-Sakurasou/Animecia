name: Animecia Catalog Policy Audit

on:
  schedule:
    - cron: '45 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anime-catalog-policy.yml"

permissions:
  contents: read

concurrency:
  group: animecia-catalog-policy
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANILIST_URL: https://graphql.anilist.co
    steps:
      - name: Reclassify and apply reversible catalog policy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request
          from collections import defaultdict

          BASE=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SECRET_KEY"]
          ANI=os.environ["ANILIST_URL"]
          HEADERS={"apikey":KEY,"Authorization":"Bearer "+KEY,"Accept":"application/json","Content-Type":"application/json"}

          PRESCHOOL={"preschool","kindergarten","幼児","幼児向け","未就学児","未就学児向け","就学前","就学前向け","幼稚園児向け"}
          KIDS={"kids","children","児童","児童向け","子供向け","こども向け","子ども向け"}
          SENSITIVE={"ecchi","hentai","nudity","sexual content","sexual themes","erotica","erotic","fanservice","性的","性的描写","性的な内容","裸","ヌード","エッチ","お色気","成人向け"}

          def request(url,method="GET",body=None,retries=8,headers=None):
              data=None if body is None else json.dumps(body,ensure_ascii=False).encode()
              request_headers={"User-Agent":"Animecia-CatalogPolicy/1.0","Accept":"application/json","Content-Type":"application/json"}
              if headers: request_headers.update(headers)
              for n in range(retries):
                  try:
                      req=urllib.request.Request(url,data=data,method=method,headers=request_headers)
                      with urllib.request.urlopen(req,timeout=60) as r:
                          raw=r.read()
                          payload=json.loads(raw.decode()) if raw else []
                          if isinstance(payload,dict) and payload.get("errors"):
                              raise RuntimeError("AniList GraphQL error: "+json.dumps(payload["errors"],ensure_ascii=False)[:1200])
                          return payload
                  except urllib.error.HTTPError as e:
                      detail=e.read().decode("utf-8","replace")[:1200]
                      print(f"HTTP {e.code} from {url}: {detail}",flush=True)
                      if e.code in (408,425,429,500,502,503,504) and n<retries-1:
                          retry_after=e.headers.get("Retry-After")
                          try:
                              wait=max(5,min(180,float(retry_after))) if retry_after else min(180,30*(2**n))
                          except (TypeError,ValueError):
                              wait=min(180,30*(2**n))
                          print(f"Retrying HTTP {e.code} after {wait:.0f}s (attempt {n+2}/{retries})",flush=True)
                          time.sleep(wait)
                          continue
                      raise

          def sb(path,method="GET",body=None,params=None):
              url=BASE+path
              if params:
                  url += "?" + urllib.parse.urlencode(params,doseq=True)
              return request(url,method,body,headers=HEADERS)

          def patch(anime_id,body):
              sb("/rest/v1/anime","PATCH",body,{"id":f"eq.{anime_id}"})

          def patch_many(anime_ids,body):
              # PostgREST accepts an IN filter; keep batches small to avoid URL limits.
              ids=list(anime_ids)
              for start in range(0,len(ids),100):
                  chunk=ids[start:start+100]
                  if chunk:
                      sb("/rest/v1/anime","PATCH",body,{"id":"in.("+",".join(str(x) for x in chunk)+")"})

          def anilist(ids):
              if not ids: return []
              query="""query($ids:[Int]) {
                Page(perPage:50) {
                  media(id_in:$ids,type:ANIME) {
                    id
                    isAdult
                    countryOfOrigin
                    tags { name }
                    relations {
                      edges {
                        relationType
                        node {
                          type
                          countryOfOrigin
                        }
                      }
                    }
                  }
                }
              }"""
              return ((request(ANI,"POST",{
                  "query":query,"variables":{"ids":ids}
              }).get("data") or {}).get("Page") or {}).get("media") or []

          rows=[]
          offset=0
          page_size=1000
          while True:
              page=sb("/rest/v1/anime",params={
                  "select":"id,title,title_japanese,title_native,title_english,title_romaji,english_title,title_user_preferred,source_metadata,source_provider,source_id,external_id,anime_verification_status,is_japanese,original_country_code,original_country_status,original_country_review_reason,start_date,format,is_adult,is_preschool,is_sensitive_visual",
                  "order":"id.asc",
                  "limit":str(page_size),
                  "offset":str(offset)
              })
              rows.extend(page)
              if len(page)<page_size:
                  break
              offset+=len(page)
              time.sleep(.1)

          # 1) AniList is authoritative for AniList-backed content classification.
          by_source={}
          source_rows=[]
          for r in rows:
              try:
                  sid=int(r["source_id"]) if str(r.get("source_id") or "").strip() else None
              except (TypeError,ValueError):
                  sid=None
              source_rows.append((r,sid))
              if str(r.get("source_provider") or "").casefold()=="anilist" and sid is not None and 0 < sid < 10000000:
                  by_source.setdefault(sid,[]).append(r)

          source_ids=list(by_source)
          classified={}
          for start in range(0,len(source_ids),50):
              try:
                  media=anilist(source_ids[start:start+50])
              except Exception as e:
                  # Fail closed for this batch: do not reuse old origin flags.
                  print(f"AniList batch failed at offset {start}: {e}",flush=True)
                  media=[]
              for m in media:
                  aid=int(m["id"])
                  tags={str(t.get("name") or "").strip().casefold() for t in (m.get("tags") or [])}
                  country=str(m.get("countryOfOrigin") or "").strip().upper() or None
                  source_countries=[]
                  for edge in (m.get("relations") or {}).get("edges") or []:
                      node=edge.get("node") or {}
                      # Only use a source work explicitly linked as an adaptation.
                      # Other relations (sequel, prequel, side story) are not proof
                      # of the original work's country.
                      if edge.get("relationType") == "ADAPTATION" and node.get("type") in ("MANGA","NOVEL","ONE_SHOT"):
                          ctry=str(node.get("countryOfOrigin") or "").strip().upper()
                          if ctry: source_countries.append(ctry)
                  # For adaptations, prefer the country of the linked source work.
                  # For original anime (or when no source relation is available), use
                  # AniList's countryOfOrigin for the anime itself.
                  original_country=(source_countries[0] if source_countries else country)
                  country_status=("verified_jp" if original_country=="JP" else
                                  "verified_non_jp" if original_country else "unknown")
                  classified[aid]={
                      "is_adult": bool(m.get("isAdult") is True),
                      "is_preschool": bool(tags & PRESCHOOL),
                      "is_kids": bool(tags & KIDS),
                      "is_sensitive_visual": bool(tags & SENSITIVE),
                      "original_country_code": original_country,
                      "original_country_status": country_status,
                      "original_country_confidence": 1.0 if original_country else 0.0,
                      "original_country_review_reason": "AniList countryOfOrigin; source-material relation country used when available."
                  }
              time.sleep(3.0)

          classified_count=0
          classification_groups=defaultdict(list)
          for sid, group in by_source.items():
              c=classified.get(sid)
              if not c: continue
              classification_groups[json.dumps(c,sort_keys=True)].extend(int(r["id"]) for r in group)
          for serialized, ids in classification_groups.items():
              patch_many(ids,json.loads(serialized))
              classified_count+=len(ids)

          # Clear stale country claims for AniList rows that could not be verified
          # from this run. This includes API failures and source IDs no longer returned.
          unclassified_ids=[]
          for sid, group in by_source.items():
              if sid not in classified:
                  unclassified_ids.extend(int(r["id"]) for r in group)
          for start in range(0,len(unclassified_ids),100):
              patch_many(unclassified_ids[start:start+100],{
                  "original_country_code":None,
                  "original_country_status":"unknown",
                  "original_country_confidence":0.0,
                  "original_country_review_reason":"AniList origin could not be verified in this run; prior country classification cleared to prevent stale decisions."
              })

          # Legacy is_japanese-derived labels are not independent origin evidence.
          legacy_ids=[
              int(r["id"]) for r in rows
              if str(r.get("source_provider") or "").casefold()!="anilist"
              and str(r.get("original_country_review_reason") or "").casefold().startswith(
                  "derived from existing positive is_japanese classification"
              )
          ]
          for start in range(0,len(legacy_ids),100):
              patch_many(legacy_ids[start:start+100],{
                  "original_country_code":None,
                  "original_country_status":"unknown",
                  "original_country_confidence":0.0,
                  "original_country_review_reason":"Legacy is_japanese flag is not independent evidence of original country; manual verification required."
              })

          # 2) Exact identity duplicates only: same provider + same source ID,
          #    or same provider + same external ID. Never use title alone.
          groups=defaultdict(list)
          for r,sid in source_rows:
              provider=str(r.get("source_provider") or "").strip().casefold()
              if provider and sid is not None:
                  groups[("source",provider,str(sid))].append(r)
              ext=str(r.get("external_id") or "").strip()
              if provider and ext:
                  groups[("external",provider,ext)].append(r)

          duplicate_ids={}
          for key,group in groups.items():
              if len(group)<2: continue
              # Prefer verified Japanese records; otherwise the lowest ID is canonical.
              ordered=sorted(group,key=lambda r:(
                  0 if str(r.get("anime_verification_status") or "").casefold()=="verified" else 1,
                  0 if r.get("is_japanese") is True else 1,
                  int(r["id"])
              ))
              canonical=int(ordered[0]["id"])
              for r in ordered[1:]:
                  rid=int(r["id"])
                  if rid!=canonical:
                      duplicate_ids[rid]=canonical

          duplicate_count=0
          duplicate_groups=defaultdict(list)
          for rid,cid in duplicate_ids.items():
              duplicate_groups[cid].append(rid)
          for cid, ids in duplicate_groups.items():
              patch_many(ids,{
                  "duplicate_status":"confirmed_duplicate",
                  "duplicate_of_id":cid,
                  "duplicate_review_reason":"Exact provider/source identity match; canonical record selected automatically.",
                  "catalog_policy_decision":"exclude",
                  "catalog_policy_reasons":["exact_duplicate"],
                  "anime_verification_status":"blocked"
              })
              duplicate_count+=len(ids)

          # 3) Reversible catalog policy. Unknown origin is allowed pending
          # manual review; only a known non-Japanese origin is excluded on origin
          # grounds. Other publication exclusions remain unchanged. No rows are deleted.
          from datetime import date
          cutoff = date(1963, 1, 1)
          today = date.today()
          excluded=0
          included=0
          non_japanese_excluded=0
          unverified_origin_excluded=0
          policy_groups=defaultdict(list)
          for r,sid in source_rows:
              rid=int(r["id"])
              if rid in duplicate_ids:
                  continue
              c=classified.get(sid) if sid is not None and str(r.get("source_provider") or "").casefold()=="anilist" else None
              is_anilist=str(r.get("source_provider") or "").casefold()=="anilist"
              legacy_reason=str(r.get("original_country_review_reason") or "").casefold().startswith("derived from existing positive is_japanese classification")
              if is_anilist and c:
                  # Native AniList IDs are classified from this run's API evidence.
                  origin_code=c.get("original_country_code")
                  origin_status=c.get("original_country_status") or "unknown"
              elif is_anilist and sid is not None and sid >= 10000000:
                  # Some legacy rows are incorrectly labeled AniList but store wrapped
                  # external IDs (for example, MAL IDs prefixed with 1000000000).
                  # They cannot be queried as AniList IDs. Preserve only an explicit,
                  # previously verified origin; unknown/unverified values still fail closed.
                  stored_code=str(r.get("original_country_code") or "").strip().upper() or None
                  stored_status=str(r.get("original_country_status") or "unknown")
                  if stored_code and stored_status in ("verified_jp","verified_non_jp"):
                      origin_code=stored_code
                      origin_status=stored_status
                  else:
                      origin_code=None
                      origin_status="unknown"
              elif is_anilist:
                  # A native AniList lookup that failed must not reuse stale country flags.
                  origin_code=None
                  origin_status="unknown"
              elif legacy_reason:
                  # A legacy boolean is not evidence of original country.
                  origin_code=None
                  origin_status="unknown"
              else:
                  origin_code=str(r.get("original_country_code") or "").strip().upper() or None
                  origin_status=r.get("original_country_status")
              reason=None
              fmt=str(r.get("format") or "").strip().upper()
              first_release=str(r.get("start_date") or "")[:10]
              title_blob=" ".join(str(r.get(k) or "") for k in (
                  "title","title_japanese","title_native","title_english",
                  "title_romaji","english_title","title_user_preferred"
              ))
              metadata=r.get("source_metadata") if isinstance(r.get("source_metadata"),dict) else {}
              metadata_type=str(metadata.get("type") or "")
              promo_pattern=re.compile(
                  r'(^|[\s【(（])PV([\s】)）]|$)|(^|[\s【(（])CM([\s】)）]|$)|'
                  r'trailer|teaser|promotional[\s-]+video|advertisement|commercial|'
                  r'予告編|予告映像|ティザー映像|ティーザー映像|宣伝映像|広告動画|特報',
                  re.IGNORECASE
              )
              allowed_formats={"TV","TV_SHORT","MOVIE","OVA","OAV","ONA","SPECIAL"}
              if not first_release:
                  reason="unknown_first_release_date"
              elif first_release < cutoff.isoformat():
                  reason="before_1963-01-01"
              elif fmt not in allowed_formats:
                  reason="not_general_anime_format"
              elif promo_pattern.search(title_blob) or re.search(
                  r'trailer|teaser|promotional|advertisement|commercial|(^|[\s])PV([\s]|$)|(^|[\s])CM([\s]|$)',
                  metadata_type,re.IGNORECASE
              ):
                  reason="promotional_or_preview_media"
              elif (c["is_adult"] if c else bool(r.get("is_adult"))) and fmt not in ("TV","TV_SHORT"):
                  reason="adult_anilist_isAdult"
              elif (c["is_preschool"] if c else bool(r.get("is_preschool"))) and fmt not in ("TV","TV_SHORT"):
                  reason="preschool_anilist_tag"
              elif (origin_code is not None and str(origin_code).strip().upper() != "JP") or origin_status == "verified_non_jp":
                  reason="non_japanese_original"
                  non_japanese_excluded+=1
              # Unknown origin and sensitive-visual metadata alone are not exclusions.
              # The full publication rules are applied here before changing verification status.
              if reason:
                  policy_groups[("exclude",reason,"")].append(rid)
                  excluded+=1
              else:
                  future=bool(r.get("start_date") and str(r["start_date"])[:10] > today.isoformat())
                  policy_groups[("include","","future_start_date_confirmed" if future else "")].append(rid)
                  included+=1

          for (decision,reason,extra), ids in policy_groups.items():
              body={
                  "catalog_policy_decision":decision,
                  "catalog_policy_reasons":[reason] if reason else ([extra] if extra else []),
                  "anime_verification_status":"blocked" if decision=="exclude" else "verified",
                  "catalog_policy_version":"anilist-authoritative-v9"
              }
              patch_many(ids,body)

          print(json.dumps({
              "total_rows":len(rows),
              "anilist_classified":classified_count,
              "exact_duplicates_excluded":duplicate_count,
              "excluded_total":excluded,
              "policy_version":"anilist-authoritative-v9",
              "included":included,
              "physical_deletes":0,
              "non_japanese_originals_excluded":non_japanese_excluded,
              "unverified_japanese_origin_excluded":unverified_origin_excluded
          },ensure_ascii=False))
          PY
