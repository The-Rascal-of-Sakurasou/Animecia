name: Validate ANIXIA core
on:
  pull_request:
    paths:
      - "anixia-client.js"
      - "anixia-admin.js"
      - "anixia-auth-pages.js"
      - "anixia-genres.js"
      - "genres.html"
      - "supabase/functions/**"
      - ".github/workflows/validate-anixia-core.yml"
  push:
    branches: [main]
    paths:
      - "anixia-client.js"
      - "anixia-admin.js"
      - "anixia-auth-pages.js"
      - "supabase/functions/**"
      - ".github/workflows/validate-anixia-core.yml"

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: |
          node --check anixia-client.js
          node --check anixia-admin.js
          node --check anixia-auth-pages.js
          node --check anixia-genres.js

  edge-function-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Annict sync Edge Function
        run: deno check --no-lock supabase/functions/sync-annict-catalog/index.ts
