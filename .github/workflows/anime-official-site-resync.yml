name: Animecia Official Site Resync

on:
  push:
    paths:
      - '.github/workflows/anime-official-site-resync.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "1回の処理件数"
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: animecia-official-site-resync
  cancel-in-progress: false

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BATCH_SIZE: ${{ inputs.batch_size || '500' }}
    steps:
      - name: Replace AniList links with Japanese official sites
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, time, urllib.parse, urllib.request, urllib.error

          BASE=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SECRET_KEY"]
          BATCH=max(10,min(100,int(os.environ.get("BATCH_SIZE","100"))))
          HEAD={"apikey":KEY,"Authorization":"Bearer "+KEY,"Accept":"application/json","User-Agent":"Animecia-OfficialSiteResync/1.0"}
          ANILIST="https://graphql.anilist.co"

          def req(url,method="GET",body=None,headers=None,timeout=30):
              h={"User-Agent":"Animecia-OfficialSiteResync/1.0","Accept":"application/json,text/html,*/*"}
              if headers: h.update(headers)
              data=None if body is None else json.dumps(body,ensure_ascii=False).encode()
              r=urllib.request.Request(url,data=data,method=method,headers=h)
              for n in range(5):
                  try:
                      with urllib.request.urlopen(r,timeout=timeout) as x:
                          return x.read(),x.status
                  except urllib.error.HTTPError as e:
                      detail=e.read().decode("utf-8","replace")[:1200]
                      print(f"HTTP {e.code} from {url}: {detail}",flush=True)
                      if e.code in (429,500,502,503,504):
                          time.sleep(min(20,2**n)); continue
                      raise
              raise RuntimeError("request failed")

          def sb(path,params=None,method="GET",body=None):
              url=BASE+path
              if params:
                  url+="?"+urllib.parse.urlencode(params,doseq=True)
              b,_=req(url,method,body,HEAD)
              return json.loads(b.decode() or "[]")

          def update(anime_id,url):
              h=dict(HEAD); h.update({"Content-Type":"application/json","Prefer":"return=minimal"})
              req(BASE+"/rest/v1/anime?id=eq."+str(anime_id),"PATCH",{"official_url":url},h)

          def host(url):
              return (urllib.parse.urlparse(url).hostname or "").lower()

          BAD=("twitter.com","x.com","facebook.com","instagram.com","youtube.com","wikipedia.org",
               "myanimelist.net","anilist.co","animenewsnetwork.com","crunchyroll.com")

          def valid_candidate(x):
              url=(x.get("url") or "").strip()
              if not url.startswith(("http://","https://")): return False,0,url
              h=host(url)
              if any(b in h for b in BAD): return False,0,url
              site=(x.get("site") or "").lower()
              lang=(x.get("language") or "").lower()
              typ=(x.get("type") or "").lower()
              if typ == "streaming": return False,0,url
              score=0
              if "official" in typ or "official" in site: score+=50
              if lang in ("ja","japanese"): score+=45
              if "公式" in site: score+=45
              if h.endswith(".jp") or ".co.jp" in h: score+=20
              if typ in ("info","streaming"): score+=10
              return score>=45,score,url

          def choose(media):
              cand=[]
              for x in media.get("externalLinks") or []:
                  ok,score,url=valid_candidate(x)
                  if ok: cand.append((score,url))
              cand.sort(reverse=True)
              return cand[0][1] if cand else None

          def japanese_page(url):
              try:
                  b,_=req(url,headers={"Accept":"text/html,application/xhtml+xml"},timeout=15)
                  s=b.decode("utf-8","ignore")[:120000]
                  return bool(re.search(r"[ぁ-んァ-ヶ一-龠]",s))
              except Exception:
                  return False

          q="""query($ids:[Int!]!){Page(page:1,perPage:50){media(id_in:$ids,type:ANIME){
              id title{native userPreferred romaji english}
              externalLinks{url site language type}
          }}}"""

          # Rotate through the full AniList-linked catalogue. Without this cursor,
          # the first low-ID rows with no usable official link are retried forever.
          cursor=(int(time.time()//3600)*BATCH)%26038
          params={
              "select":"id,title_japanese,title_native,title_user_preferred,title_romaji,title_english,source_provider,source_id,official_url",
              "source_provider":"eq.anilist",
              "source_id":"not.is.null",
              "anime_verification_status":"eq.verified",
              "start_date":"gte.1963-01-01",
              "or":"(official_url.is.null,official_url.ilike.*anilist.co*,official_url.ilike.*animenewsnetwork.com*,official_url.ilike.*twitter.com*,official_url.ilike.*x.com*,official_url.ilike.*instagram.com*,official_url.ilike.*facebook.com*,official_url.ilike.*youtube.com*,official_url.ilike.*wikipedia.org*,official_url.ilike.*crunchyroll.com*)",
              "order":"id.asc","limit":str(BATCH)
          }
          rows=sb("/rest/v1/anime",{**params,"id":"gt."+str(cursor)})
          if len(rows)<BATCH:
              rows+=sb("/rest/v1/anime",{**params,"id":"lt."+str(cursor),"limit":str(BATCH-len(rows))})

          ids=[int(r["source_id"]) for r in rows if r.get("source_provider")=="anilist" and str(r.get("source_id") or "").isdigit()]
          medias={}
          for p in range(0,len(ids),50):
              body={"query":q,"variables":{"ids":ids[p:p+50]}}
              raw,_=req(ANILIST,"POST",body,{"Content-Type":"application/json","Accept":"application/json"})
              for m in (json.loads(raw.decode()).get("data",{}).get("Page",{}).get("media") or []):
                  medias[int(m["id"])]=m
              time.sleep(2.0)

          changed=0
          for r in rows:
              media=medias.get(int(r["source_id"])) if r.get("source_provider")=="anilist" and str(r.get("source_id") or "").isdigit() else None
              if not media:
                  title=r.get("title_japanese") or r.get("title_native") or r.get("title_user_preferred") or r.get("title_romaji") or r.get("title_english")
                  if title:
                      sq="""query($s:String!){Page(page:1,perPage:3){media(search:$s,type:ANIME,sort:SEARCH_MATCH){id title{native userPreferred romaji english} externalLinks{url site language type}}}}"""
                      raw,_=req(ANILIST,"POST",{"query":sq,"variables":{"s":title}},{"Content-Type":"application/json","Accept":"application/json"})
                      items=json.loads(raw.decode()).get("data",{}).get("Page",{}).get("media") or []
                      nt=re.sub(r"\\s+","",title).lower()
                      for x in items:
                          ts=x.get("title") or {}
                          vals=[v for v in (ts.get("native"),ts.get("userPreferred"),ts.get("romaji"),ts.get("english")) if v]
                          if any(nt==re.sub(r"\\s+","",v).lower() or nt in re.sub(r"\\s+","",v).lower() for v in vals):
                              media=x; break
                      time.sleep(2.0)
              if not media: continue
              url=choose(media)
              if url and japanese_page(url):
                  update(r["id"],url)
                  changed+=1

          print(json.dumps({"candidates":len(rows),"changed":changed},ensure_ascii=False))
          PY
