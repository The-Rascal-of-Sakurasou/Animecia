<script>
const U="https://bhgdjuwlxvbaeraaivmh.supabase.co",K="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c",sb=AnimeciaAuth.client();
let currentUser=null,currentMode="latest",postsCache=new Map();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d).toLocaleString("ja-JP",{year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});const mediaUrl=(url,stamp)=>{if(!url)return "";try{const u=new URL(url,location.href);if(stamp)u.searchParams.set("v",String(new Date(stamp).getTime()));return u.href}catch(_){return url}};
function avatar(p,cls="avatar"){if(!p?.avatar_url)return '<div class="'+cls+' avatar-fallback">'+esc((p?.display_name||p?.username||"A").slice(0,1))+'</div>';const x=Number.isFinite(Number(p.avatar_position_x))?Number(p.avatar_position_x):50;const y=Number.isFinite(Number(p.avatar_position_y))?Number(p.avatar_position_y):50;const z=Number.isFinite(Number(p.avatar_zoom))?Number(p.avatar_zoom):100;return '<img class="'+cls+'" src="'+esc(mediaUrl(p.avatar_url,p.updated_at))+'" alt="" style="object-position:'+x+'% '+y+'%;transform:scale('+(z/100)+');" decoding="async" loading="eager" fetchpriority="high">'}
async function getProfiles(ids){const u=[...new Set(ids.filter(Boolean))];if(!u.length)return new Map();const {data,error}=await sb.from("profiles").select("id,username,display_name,avatar_url,avatar_position_x,avatar_position_y,avatar_zoom,updated_at").in("id",u);if(error)throw error;return new Map((data||[]).map(p=>[p.id,p]))}
async function loadFeed(){
 const el=document.getElementById("feed");
 el.innerHTML='<div class="loading">読み込み中…</div>';
 try{
  let rows=[];
  if(currentMode==="bookmarks"){
   if(!currentUser){el.innerHTML='<div class="empty">ログインするとブックマークを利用できます。</div>';return}
   const r=await sb.from("social_post_bookmarks").select("post_id,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:false}).limit(80);
   if(r.error)throw r.error;
   const ids=(r.data||[]).map(x=>x.post_id);
   if(!ids.length){el.innerHTML='<div class="empty">ブックマークはありません。</div>';return}
   const r2=await sb.from("social_posts").select("id,author_id,body,attachment_url,attachment_path,attachment_type,reply_to_id,quote_post_id,created_at,updated_at").in("id",ids).is("deleted_at",null);
   if(r2.error)throw r2.error;
   rows=r2.data||[];
  }else{
   const r=await sb.from("social_posts").select("id,author_id,body,attachment_url,attachment_path,attachment_type,reply_to_id,quote_post_id,created_at,updated_at").is("deleted_at",null).is("reply_to_id",null).order("created_at",{ascending:false}).limit(80);
   if(r.error)throw r.error;
   rows=r.data||[];
   if(currentMode==="following"&&currentUser){
    try{
     const f=await sb.from("user_follows").select("following_id").eq("follower_id",currentUser.id);
     if(!f.error){const ids=new Set((f.data||[]).map(x=>x.following_id));rows=rows.filter(x=>ids.has(x.author_id)||x.author_id===currentUser.id)}
    }catch(_){}
   }
  }
  if(!rows.length){el.innerHTML='<div class="empty">まだ投稿がありません。</div>';return}
  postsCache=new Map(rows.map(x=>[x.id,x]));

  let authors=new Map();
  try{authors=await getProfiles(rows.map(x=>x.author_id))}catch(e){console.warn("プロフィール取得をスキップ",e)}

  const mediaMap=new Map();
  try{
   const r=await sb.from("social_post_media").select("id,post_id,public_url,mime_type,sort_order").in("post_id",rows.map(x=>x.id)).order("sort_order",{ascending:true});
   if(!r.error)(r.data||[]).forEach(x=>{if(!mediaMap.has(x.post_id))mediaMap.set(x.post_id,[]);mediaMap.get(x.post_id).push(x)});
  }catch(e){console.warn("投稿写真取得をスキップ",e)}

  const ids=rows.map(x=>x.id);
  const repliesMap=new Map();
  if(ids.length){
   try{
    const rr=await sb.from("social_posts").select("id,author_id,body,reply_to_id,created_at,updated_at,deleted_at").in("reply_to_id",ids).is("deleted_at",null).order("created_at",{ascending:true}).limit(300);
    if(!rr.error)(rr.data||[]).forEach(x=>{if(!repliesMap.has(x.reply_to_id))repliesMap.set(x.reply_to_id,[]);repliesMap.get(x.reply_to_id).push(x)});
   }catch(e){console.warn("返信取得をスキップ",e)}
  }

  const lc=new Map(),rc=new Map(),liked=new Set(),reposted=new Set(),saved=new Set();
  try{
   const r=await sb.from("social_post_likes").select("post_id,user_id").in("post_id",ids);
   if(!r.error)(r.data||[]).forEach(x=>{lc.set(x.post_id,(lc.get(x.post_id)||0)+1);if(x.user_id===currentUser?.id)liked.add(x.post_id)});
  }catch(e){console.warn("いいね情報取得をスキップ",e)}
  try{
   const r=await sb.from("social_post_reposts").select("post_id,user_id").in("post_id",ids);
   if(!r.error)(r.data||[]).forEach(x=>{rc.set(x.post_id,(rc.get(x.post_id)||0)+1);if(x.user_id===currentUser?.id)reposted.add(x.post_id)});
  }catch(e){console.warn("リポスト情報取得をスキップ",e)}
  if(currentUser){
   try{
    const r=await sb.from("social_post_bookmarks").select("post_id,user_id").eq("user_id",currentUser.id).in("post_id",ids);
    if(!r.error)(r.data||[]).forEach(x=>saved.add(x.post_id));
   }catch(e){console.warn("ブックマーク情報取得をスキップ",e)}
  }

  const replyAuthorIds=[...(repliesMap.values())].flat().map(x=>x.author_id);
  let replyAuthors=new Map();
  try{replyAuthors=await getProfiles(replyAuthorIds)}catch(e){console.warn("返信プロフィール取得をスキップ",e)}
  el.innerHTML=rows.map(p=>renderPost(p,authors.get(p.author_id),mediaMap.get(p.id)||[],lc.get(p.id)||0,rc.get(p.id)||0,liked.has(p.id),reposted.has(p.id),saved.has(p.id),repliesMap.get(p.id)||[],replyAuthors)).join("");
  bindActions();
 }catch(e){
  console.error("コミュニティ読み込みエラー",e);
  el.innerHTML='<div class="error">コミュニティを読み込めませんでした。<br><small>'+esc(e.message||"データ取得エラー")+'</small><br><button type="button" class="btn secondary" onclick="loadFeed()">再読み込み</button></div>';
 }
}
function renderPost(p,author,media,lc,rc,isLiked,isReposted,isSaved,replies=[],replyAuthors=new Map()){
 const name=author?.display_name||author?.username||"Animeciaユーザー",handle=author?.username?"@"+String(author.username).replace(/^@/,""):"";
 const urls=media.length?media.map(x=>x.public_url):p.attachment_url?[p.attachment_url]:[];
 const mediaHtml=urls.length?'<div class="post-media-grid">'+urls.slice(0,4).map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="投稿された写真" loading="lazy" decoding="async"></a>').join("")+'</div>':"";
 const body=p.body?'<div class="post-body">'+esc(p.body)+'</div>':"";
 const repliesHtml=replies.length?'<div class="replies">'+replies.slice(0,20).map(r=>'<div class="reply"><div class="post-head">'+avatar(replyAuthors.get(r.author_id))+'<div style="min-width:0;flex:1"><div><b>'+esc(replyAuthors.get(r.author_id)?.display_name||replyAuthors.get(r.author_id)?.username||"Animeciaユーザー")+'</b> <span class="small">'+esc(fmt(r.created_at))+'</span></div><div class="post-body">'+esc(r.body||"")+'</div></div></div></div>').join("")+'</div>':"";
 return '<article class="post" data-post-id="'+p.id+'"><div class="post-head">'+avatar(author)+'<div style="min-width:0;flex:1"><div><a href="profile.html?id='+encodeURIComponent(p.author_id)+'" style="font-weight:900;color:#111">'+esc(name)+'</a> <span class="small">'+esc(handle)+' · '+esc(fmt(p.created_at))+'</span></div>'+body+mediaHtml+(p.quote_post_id?'<div class="quote"><span class="small">引用投稿</span></div>':"")+'<div class="post-actions"><button data-act="reply">返信</button><button data-act="repost" class="'+(isReposted?'reposted':'')+'">↻ リポスト '+(rc||"")+'</button><button data-act="like" class="'+(isLiked?'active':'')+'">♥ いいね '+(lc||"")+'</button><button data-act="bookmark" class="'+(isSaved?'active':'')+'">🔖 保存</button>'+(currentUser?.id===p.author_id?'<button data-act="delete">削除</button>':"")+'</div><div class="reply-box"><textarea maxlength="4000" placeholder="返信を入力"></textarea><div class="row"><button class="btn secondary" data-act="cancel-reply">キャンセル</button><button class="btn" data-act="send-reply">返信</button></div></div></div></div>'+repliesHtml+'</article>';
}
function bindActions(){document.querySelectorAll("[data-act]").forEach(b=>b.onclick=async e=>{e.stopPropagation();const article=b.closest(".post"),id=article?.dataset.postId;if(!id)return;try{
 if(b.dataset.act==="reply"){article.querySelector(".reply-box").style.display="block";article.querySelector("textarea").focus();return}
 if(b.dataset.act==="cancel-reply"){article.querySelector(".reply-box").style.display="none";return}
 if(!currentUser){location.href="login.html?redirect="+encodeURIComponent(location.href);return}
 if(b.dataset.act==="like"){const {error}=await sb.rpc("toggle_social_post_like",{p_post_id:id});if(error)throw error}
 if(b.dataset.act==="repost"){const {error}=await sb.rpc("toggle_social_post_repost",{p_post_id:id});if(error)throw error}
 if(b.dataset.act==="bookmark"){const {error}=await sb.rpc("toggle_social_post_bookmark",{p_post_id:id});if(error)throw error}
 if(b.dataset.act==="send-reply"){const body=article.querySelector(".reply-box textarea").value.trim();if(!body)return;const {error}=await sb.from("social_posts").insert({author_id:currentUser.id,body,reply_to_id:id});if(error)throw error;article.querySelector("textarea").value=""}
 if(b.dataset.act==="delete"){if(!confirm("この投稿を削除しますか？"))return;const post=postsCache.get(id);const {data:media}=await sb.from("social_post_media").select("storage_path").eq("post_id",id);const {data:deleted,error}=await sb.rpc("delete_social_post",{p_post_id:id});if(error)throw error;if(!deleted)throw new Error("投稿を削除できませんでした。");if(media?.length)await sb.storage.from("community-media").remove(media.map(x=>x.storage_path));if(post?.attachment_path)await sb.storage.from("community-media").remove([post.attachment_path])}
 await loadFeed();
 }catch(e){console.error(e);alert("処理に失敗しました。
"+(e.message||"エラー"))}})}
async function searchUsers(){const q=document.getElementById("user-search").value.trim().replace(/^@/,"");const el=document.getElementById("user-results");if(q.length<2){el.innerHTML="";return}const {data,error}=await sb.from("profiles").select("id,username,display_name,avatar_url,avatar_position_x,avatar_position_y,avatar_zoom,updated_at").or("username.ilike.%"+q+"%,display_name.ilike.%"+q+"%").neq("id",currentUser?.id||"00000000-0000-0000-0000-000000000000").limit(12);if(error){el.innerHTML='<div class="error">検索できませんでした。</div>';return}el.innerHTML=(data||[]).map(p=>'<div class="user-result">'+avatar(p)+'<div><a href="profile.html?id='+encodeURIComponent(p.id)+'"><b>'+esc(p.display_name||p.username||"ユーザー")+'</b></a><br><span class="small">@'+esc(p.username||"")+'</span></div></div>').join("")||'<div class="empty">ユーザーが見つかりません。</div>'}
async function createPost(){const body=document.getElementById("post-body").value.trim(),input=document.getElementById("post-image"),files=[...(input?.files||[])];if(!body&&!files.length)return;if(!currentUser){location.href="login.html?redirect="+encodeURIComponent(location.href);return}if(files.length>4){alert("写真は4枚まで添付できます。");return}const b=document.getElementById("post-submit");b.disabled=true;let uploaded=[];try{for(const [i,file] of files.entries()){if(!file.type.startsWith("image/")||file.size>10*1024*1024)throw new Error("写真は各10MB以下で選択してください。");const path=currentUser.id+"/"+crypto.randomUUID()+"-"+(file.name.replace(/[^a-zA-Z0-9._-]/g,"_").slice(-80)||"photo");const up=await sb.storage.from("community-media").upload(path,file,{contentType:file.type,cacheControl:"3600",upsert:false});if(up.error)throw up.error;uploaded.push({path,type:file.type})}const first=uploaded[0],payload={author_id:currentUser.id,body,attachment_url:first?sb.storage.from("community-media").getPublicUrl(first.path).data.publicUrl:null,attachment_path:first?.path||null,attachment_type:first?.type||null};const {data:post,error}=await sb.from("social_posts").insert(payload).select("id").single();if(error)throw error;if(uploaded.length){const rows=uploaded.map((x,i)=>({post_id:post.id,uploader_id:currentUser.id,storage_path:x.path,public_url:sb.storage.from("community-media").getPublicUrl(x.path).data.publicUrl,mime_type:x.type,sort_order:i}));const {error:me}=await sb.from("social_post_media").insert(rows);if(me){console.warn("投稿写真メタデータの保存をスキップ:",me);if(uploaded.length>1)await sb.storage.from("community-media").remove(uploaded.slice(1).map(x=>x.path));}}document.getElementById("post-body").value="";document.getElementById("post-count").textContent="0 / 4000";input.value="";document.getElementById("photo-preview").innerHTML="";document.getElementById("photo-count").textContent="最大4枚・各10MB以下";await loadFeed()}catch(e){console.error("投稿作成エラー",e);if(uploaded.length)await sb.storage.from("community-media").remove(uploaded.map(x=>x.path));alert("投稿できませんでした。
"+(e.message||"エラー"))}finally{b.disabled=false}}
function updatePhotoPreview(){
 const input=document.getElementById("post-image"),files=[...(input.files||[])],preview=document.getElementById("photo-preview");
 if(files.length>4){alert("写真は4枚までです。");input.value="";preview.innerHTML="";document.getElementById("photo-count").textContent="最大4枚・各10MB以下";return}
 preview.innerHTML=files.map((f,i)=>'<div class="photo-preview-item"><img src="'+URL.createObjectURL(f)+'" alt="" decoding="async" loading="lazy"><button type="button" class="photo-remove" data-photo-index="'+i+'" aria-label="この写真を解除">×</button></div>').join("");
 document.getElementById("photo-count").textContent=files.length?files.length+"枚を選択中":"最大4枚・各10MB以下";
 preview.querySelectorAll(".photo-remove").forEach(btn=>btn.onclick=()=>removePostPhoto(Number(btn.dataset.photoIndex)));
}
function setPostFiles(files){const dt=new DataTransfer();files.slice(0,4).forEach(f=>dt.items.add(f));document.getElementById("post-image").files=dt.files;updatePhotoPreview()}
function removePostPhoto(index){const input=document.getElementById("post-image");setPostFiles([...(input.files||[])].filter((_,i)=>i!==index))}
function clearPostPhotos(){document.getElementById("post-image").value="";updatePhotoPreview()}
async function init(){const {data,error}=await sb.auth.getSession();if(error)console.error(error);currentUser=data?.session?.user||null;document.getElementById("post-submit").onclick=createPost;document.getElementById("photo-button").onclick=()=>document.getElementById("post-image").click();document.getElementById("post-image").addEventListener("change",updatePhotoPreview);document.getElementById("post-body").addEventListener("input",e=>document.getElementById("post-count").textContent=e.target.value.length+" / 4000");document.getElementById("user-search-btn").onclick=searchUsers;document.getElementById("user-search").onkeydown=e=>{if(e.key==="Enter")searchUsers()};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentMode=b.dataset.mode;loadFeed()});await loadFeed()}
document.addEventListener("DOMContentLoaded",init);
</script>
