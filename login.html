<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン | Animecia</title>\n<meta name="description" content="Animeciaのアカウントにログインします。">\n<meta name="robots" content="noindex,nofollow">

<link rel="stylesheet" href="header.css">
<link rel="preconnect" href="https://bhgdjuwlxvbaeraaivmh.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="auth-core.js"></script>
<style>
main{max-width:520px;margin:60px auto;padding:20px}
.panel{padding:30px}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}
.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit;background:#fff;color:#111}
.field input:focus{outline:3px solid rgba(37,99,235,.18);border-color:#2563eb}
.actions{display:grid;gap:10px}
.actions button{width:100%;min-height:44px}
.message{min-height:24px;margin:14px 0;font-size:13px;line-height:1.6}
.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:13px}
.error{color:#b42318!important}
.status{color:#555}
.site-header{position:sticky!important;top:0!important;z-index:9999!important;background:rgba(16,17,20,.94)!important;backdrop-filter:blur(16px)!important;border-bottom:1px solid rgba(255,255,255,.08)!important;color:#fff!important}
.site-header .container.nav{width:min(1240px,calc(100% - 32px))!important;min-height:68px!important;margin:auto!important;display:flex!important;align-items:center!important}
.site-header .brand{font-size:22px!important;font-weight:900!important;text-decoration:none!important;color:#fff!important}
@media(max-width:640px){main{margin:30px auto;padding:14px}.panel{padding:22px 18px}.site-header .container.nav{width:calc(100% - 20px)!important;min-height:60px!important}}
</style>
<script src="performance.js" defer></script>
<link rel="stylesheet" href="site-theme.css?v=20261011c">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html" aria-label="Animecia ホーム">Animecia</a>
  </div>
</header>
<main>
<section class="panel">
<h1>ログイン</h1>
<p>Animeciaのアカウントにログインします。</p>
<form id="form" novalidate>
<div class="field">
<label for="email">メールアドレス</label>
<input id="email" type="email" autocomplete="username" inputmode="email" required>
</div>
<div class="field">
<label for="password">パスワード</label>
<input id="password" type="password" autocomplete="current-password" required>
</div>
<div class="actions">
<button class="btn" id="submit" type="submit">ログイン</button>
<button class="btn secondary" type="button" id="resend">確認メールを再送信</button>
</div>
<p id="message" class="message status" aria-live="polite"></p>
</form>
<div class="links">
<a href="signup.html">新規登録</a>
<a href="reset-password.html">パスワードを忘れた場合</a>
<a href="index.html">ホームへ戻る</a>
</div>
</section>
</main>
<script>
(function(){
  "use strict";
  const params=new URLSearchParams(location.search);
  const redirect=params.get("redirect");

  function getSafeRedirect(value){
    if(!value)return "mypage.html";
    try{
      const u=new URL(value,location.href);
      if(u.origin!==location.origin)return "mypage.html";
      const base=new URL(".",location.href);
      if(u.pathname.startsWith(base.pathname)){
        return u.pathname.slice(base.pathname.length)+(u.search||"")+(u.hash||"");
      }
    }catch(_){}
    return "mypage.html";
  }

  const safeRedirect=getSafeRedirect(redirect);
  let loginInProgress=false;
  const $=id=>document.getElementById(id);
  const message=(text,error)=>{
    $("message").textContent=text||"";
    $("message").className="message "+(error?"error":"status");
  };

  function errorMessage(error){
    const code=String(error?.code||"");
    const raw=String(error?.message||"");
    if(code==="email_not_confirmed"||/email not confirmed/i.test(raw)){
      return "メールアドレスの確認が完了していません。確認メールを確認してください。";
    }
    if(code==="invalid_credentials"||/invalid login credentials/i.test(raw)){
      return "メールアドレスまたはパスワードが正しくありません。";
    }
    if(/failed to fetch|network|fetch/i.test(raw)){
      return "認証サーバーに接続できませんでした。通信状態を確認して、もう一度お試しください。";
    }
    return raw||"ログインに失敗しました。しばらくしてからもう一度お試しください。";
  }

  async function start(){
    try{
      const user=await AnimeciaAuth.init();
      if(user && !loginInProgress) location.replace(safeRedirect);
    }catch(error){
      console.error("Animecia login init failed",error);
      message("認証機能の初期化に失敗しました。ページを再読み込みしてください。",true);
    }
  }

  $("form").addEventListener("submit",async event=>{
    event.preventDefault();
    const email=$("email").value.trim();
    const password=$("password").value;
    if(!email||!password){
      message("メールアドレスとパスワードを入力してください。",true);
      return;
    }
    loginInProgress=true;
    $("submit").disabled=true;
    message("ログインしています…");

    try{
      const result=await AnimeciaAuth.signIn(email,password);
      const user=result&&result.data&&result.data.user;
      if(!user){
        message("ログイン情報を取得できませんでした。もう一度お試しください。",true);
        return;
      }
      if(!(user.email_confirmed_at||user.confirmed_at)){
        await AnimeciaAuth.signOut();
        message("メールアドレスの確認が完了していません。確認メールを確認してください。",true);
        return;
      }
      location.replace(safeRedirect);
    }catch(error){
      console.error("Animecia sign in failed",error);
      message(errorMessage(error),true);
    }finally{
      $("submit").disabled=false;
      loginInProgress=false;
    }
  });

  $("resend").addEventListener("click",async()=>{
    const email=$("email").value.trim();
    if(!email){
      message("メールアドレスを入力してください。",true);
      return;
    }
    try{
      const c=AnimeciaAuth.client();
      const {error}=await c.auth.resend({
        type:"signup",
        email,
        options:{emailRedirectTo:new URL("auth-callback.html",location.href).href}
      });
      if(error)throw error;
      message("確認メールを再送信しました。迷惑メールフォルダも確認してください。");
    }catch(error){
      console.error("Animecia resend failed",error);
      message(errorMessage(error),true);
    }
  });

  start();
})();
</script>
</body>
</html>
