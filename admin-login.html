<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理者ログイン | Animecia</title>
<meta name="robots" content="noindex,nofollow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.admin-login{width:min(430px,100%)}
.admin-brand{text-align:center;margin-bottom:22px}
.admin-brand a{font-size:25px;font-weight:900;color:var(--ac-navy);text-decoration:none}
.admin-brand p{margin:6px 0 0;color:var(--ac-sub);font-size:12px}
.admin-card{background:var(--ac-card);border:1px solid var(--ac-line);border-radius:16px;box-shadow:var(--ac-shadow-lg);padding:28px}
.admin-card h1{margin:0;font-size:22px;color:var(--ac-ink)}
.admin-card .lead{margin:7px 0 22px;color:var(--ac-sub);font-size:13px}
.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.input-wrap{position:relative}.field input{width:100%;padding:12px 44px 12px 12px;border:1px solid var(--ac-line);border-radius:9px;background:#fff;color:var(--ac-ink);outline:none;font:inherit}
.field input:focus{border-color:var(--ac-orange);box-shadow:0 0 0 3px rgba(232,121,0,.12)}
.show-password{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ac-sub);font-size:11px;cursor:pointer;padding:6px}
.submit{width:100%;margin-top:6px;padding:12px;border:0;border-radius:9px;background:var(--ac-navy);color:#fff;font-weight:800;cursor:pointer}
.submit:hover{background:var(--ac-navy-2)}.submit:disabled{opacity:.6;cursor:wait}
.message{min-height:20px;margin:13px 0 0;font-size:12px;color:#b42318}
.back{display:block;text-align:center;margin-top:18px;color:var(--ac-sub);font-size:12px;text-decoration:none}.back:hover{text-decoration:underline}
.security-note{text-align:center;margin-top:17px;color:var(--ac-muted);font-size:10px;line-height:1.6}
</style>
<link rel="preconnect" href="https://bhgdjuwlxvbaeraaivmh.supabase.co" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><script src="performance.js" defer></script><link rel="stylesheet" href="site-theme.css?v=20261012">
</head>
<body>
<main class="admin-login">
<div class="admin-brand"><a href="index.html">Animecia</a><p>管理者専用ページ</p></div>
<section class="admin-card">
<h1>管理者ログイン</h1>
<p class="lead">管理者として登録されたアカウントのみ利用できます。</p>
<form id="form" novalidate>
<div class="field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" inputmode="email" required></div>
<div class="field"><label for="password">パスワード</label><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" required><button type="button" class="show-password" id="show">表示</button></div></div>
<button class="submit" id="submit" type="submit">管理画面へ</button>
<p class="message" id="message" aria-live="polite"></p>
</form>
<a class="back" href="index.html">ホームへ戻る</a>
</section>
<p class="security-note">管理者権限はSupabase側の管理者登録によって確認されます。<br>通常のアカウントでは管理画面を利用できません。</p>
</main>
<script>
const SUPABASE_URL="https://bhgdjuwlxvbaeraaivmh.supabase.co";
const SUPABASE_KEY="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById("form"),email=document.getElementById("email"),password=document.getElementById("password"),submit=document.getElementById("submit"),message=document.getElementById("message"),show=document.getElementById("show");
function setMessage(t,error=true){message.textContent=t;message.style.color=error?"#b42318":"#2f6f44";}
show.addEventListener("click",()=>{const visible=password.type==="text";password.type=visible?"password":"text";show.textContent=visible?"表示":"非表示";});
(async()=>{
 const {data:{session}}=await sb.auth.getSession();
 if(!session?.user) return;
 const {data:admin}=await sb.from("admin_users").select("user_id").eq("user_id",session.user.id).maybeSingle();
 if(admin){location.replace("admin-dashboard.html");}
})();
form.addEventListener("submit",async e=>{
 e.preventDefault();setMessage("");
 const em=email.value.trim(),pw=password.value;
 if(!em||!pw){setMessage("メールアドレスとパスワードを入力してください。");return;}
 submit.disabled=true;submit.textContent="認証中…";
 try{
  const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
  if(error) throw error;
  const user=data?.user;
  if(!user?.email_confirmed_at){await sb.auth.signOut();throw new Error("メールアドレスの確認が完了していません。");}
  const {data:admin,error:adminError}=await sb.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
  if(adminError) throw new Error("管理者権限を確認できませんでした。");
  if(!admin){await sb.auth.signOut();throw new Error("このアカウントには管理者権限がありません。");}
  location.replace("admin-dashboard.html");
 }catch(err){
  const raw=String(err?.message||"");
  setMessage(/invalid login credentials/i.test(raw)?"メールアドレスまたはパスワードが正しくありません。":raw||"管理者ログインに失敗しました。");
  submit.disabled=false;submit.textContent="管理画面へ";
 }
});
</script>
</body>
</html>
