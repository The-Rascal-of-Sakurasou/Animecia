<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パスワード再設定 | Animecia</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><style>main{max-width:520px;margin:60px auto;padding:20px}.panel{padding:30px}.field{margin-bottom:16px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit}.message{min-height:40px;margin:14px 0;font-size:13px}.hidden{display:none}</style><script src="performance.js" defer></script>
<link rel="preconnect" href="https://bhgdjuwlxvbaeraaivmh.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="auth-core.js" defer></script>
<link rel="stylesheet" href="site-theme.css?v=20261012">
</head><body><main><section class="panel"><h1 id="heading">パスワード再設定</h1><p id="intro">登録済みのメールアドレスに再設定用メールを送信します。</p><form id="request"><div class="field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required></div><button class="btn">再設定メールを送信</button></form><form id="change" class="hidden"><div class="field"><label for="password">新しいパスワード</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="password2">新しいパスワード（確認）</label><input id="password2" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn">パスワードを変更</button></form><p id="message" class="message" aria-live="polite"></p><a href="login.html">ログインへ戻る</a></section></main><script>const sb=AnimeciaAuth.client();const $=id=>document.getElementById(id),setMsg=t=>$("message").textContent=t;sb.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session){$("request").classList.add("hidden");$("change").classList.remove("hidden");$("heading").textContent="新しいパスワード";$("intro").textContent="新しいパスワードを設定してください。"}});$("request").addEventListener("submit",async e=>{e.preventDefault();const {error}=await sb.auth.resetPasswordForEmail($("email").value.trim(),{redirectTo:location.origin+location.pathname});setMsg(error?"再設定メールの送信に失敗しました。":"再設定メールを送信しました。アカウントの有無にかかわらず同じ表示です。メールを確認してください。")});$("change").addEventListener("submit",async e=>{e.preventDefault();const p=$("password").value;if(p!==$("password2").value){setMsg("パスワードが一致しません。");return}const {error}=await sb.auth.updateUser({password:p});if(error){setMsg("パスワードの変更に失敗しました。");return}await sb.auth.signOut();setMsg("パスワードを変更しました。ログインページからログインしてください。");$("change").classList.add("hidden")});</script></body></html>
