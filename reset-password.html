<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>パスワード再設定｜ANIXIA</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d18;color:#f4f7fb;font-family:system-ui,sans-serif}
main{width:min(480px,calc(100% - 36px));box-sizing:border-box;margin:28px auto;padding:28px;border:1px solid #293b56;border-radius:16px;background:#111b2b}
.field{display:grid;gap:7px;margin:16px 0}
label{font-size:12px;color:#b9c6d7;font-weight:700}
input{box-sizing:border-box;width:100%;height:46px;padding:10px;border:1px solid #30435f;border-radius:8px;background:#0b1423;color:#fff;font:inherit}
button{width:100%;border:0;border-radius:8px;padding:13px;background:#f2a51a;color:#171b22;font-weight:900;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.message{min-height:28px;color:#f2b84d;font-size:12px;line-height:1.7}
a{color:#f2b84d}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="anixia-client.js"></script>
<script defer>
window.addEventListener("DOMContentLoaded", async () => {
  const form = document.getElementById("form");
  const button = document.getElementById("submit");
  const message = document.getElementById("message");
  const client = ANIXIA.getClient();
  let recoverySession = false;
  try {
    const { data, error } = await client.auth.getSession();
    if (error) throw error;
    recoverySession = !!data.session;
    if (!recoverySession) {
      message.textContent = "再設定用リンクが無効か、有効期限が切れています。再設定メールをもう一度送信してください。";
      button.disabled = true;
    }
  } catch (error) {
    console.error("ANIXIA recovery session check failed", error);
    message.textContent = "認証情報を確認できませんでした。再設定メールから開き直してください。";
    button.disabled = true;
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (!recoverySession || button.disabled) return;
    const password = document.getElementById("password").value;
    const confirmation = document.getElementById("password-confirm").value;
    if (password.length < 8) {
      message.textContent = "パスワードは8文字以上にしてください。";
      return;
    }
    if (password !== confirmation) {
      message.textContent = "パスワードが一致しません。";
      document.getElementById("password-confirm").focus();
      return;
    }
    button.disabled = true;
    button.setAttribute("aria-busy", "true");
    message.textContent = "パスワードを更新しています…";
    try {
      const { error } = await client.auth.updateUser({ password });
      if (error) throw error;
      await client.auth.signOut({ scope: "local" });
      recoverySession = false;
      message.textContent = "パスワードを更新しました。新しいパスワードでログインしてください。";
      form.reset();
      button.disabled = true;
    } catch (error) {
      console.error("ANIXIA password update failed", error);
      message.textContent = "更新できませんでした。再設定メールのリンクが有効か確認してください。";
      button.disabled = false;
    } finally {
      button.removeAttribute("aria-busy");
    }
  });
});
</script>
<script src="performance.js" defer></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="site-theme.css?v=anixia-design-v4-20261119">
<link rel="preconnect" href="https://bhgdjuwlxvbaeraaivmh.supabase.co">
</head>
<body>
<main>
<h1>パスワード再設定</h1>
<p style="color:#a3b0c2;font-size:12px;line-height:1.7">新しいパスワードを入力してください。</p>
<form id="form">
<div class="field"><label for="password">新しいパスワード（8文字以上）</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div>
<div class="field"><label for="password-confirm">新しいパスワード（確認）</label><input id="password-confirm" type="password" minlength="8" autocomplete="new-password" required></div>
<button id="submit" type="submit">パスワードを更新</button>
<p class="message" id="message" role="status" aria-live="polite">再設定用の認証情報を確認しています…</p>
</form>
<a href="login.html">ログイン画面へ</a>
</main>

<script src="anixia-i18n.js?v=20261119-r5" defer></script>
</body>
</html>
