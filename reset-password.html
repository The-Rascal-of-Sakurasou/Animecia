<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>パスワード再設定｜ANIXIA</title><meta name="robots" content="noindex,nofollow"><style>main{width:min(480px,calc(100% - 28px));margin:55px auto}.panel{padding:28px;border:1px solid #293b56;border-radius:16px;background:#111b2b}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;color:#b9c6d7}.field input{height:44px;padding:10px;border:1px solid #30435f;border-radius:8px;background:#0b1423;color:#fff}button{width:100%;border:0;border-radius:8px;padding:12px;background:#f2a51a;color:#171b22;font-weight:900}.message{min-height:24px;color:#f2b84d;font-size:12px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="anixia-client.js"></script><script defer>window.addEventListener("DOMContentLoaded",()=>{document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("message"),p=document.getElementById("password").value;if(p.length<8){m.textContent="パスワードは8文字以上にしてください。";return}try{const {error}=await ANIXIA.getClient().auth.updateUser({password:p});if(error)throw error;m.textContent="パスワードを更新しました。ログイン画面へ進んでください。";}catch(err){console.error(err);m.textContent="更新できませんでした。再設定メールのリンクから開いているか確認してください。"}})});</script><script src="performance.js" defer></script>

</head><body><main><section class="panel"><a class="brand" href="index.html">ANIXIA</a><h1>パスワード再設定</h1><p>新しいパスワードを入力してください。</p><form id="form"><div class="field"><label for="password">新しいパスワード</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><button type="submit">パスワードを更新</button><p class="message" id="message"></p></form><a href="login.html">ログイン画面へ</a></section></main></body></html>
