async function search(){const q=document.getElementById("search").value.trim(),el=document.getElementById("results");if(!q){el.innerHTML="";return}el.innerHTML='<div class="loading">検索中…</div>';const {data,error}=await client.rpc("search_anime_catalog_v2",{p_query:q,p_year:null,p_season:null,p_status:null,p_format:null,p_genre_id:null,p_studio_id:null,p_sort:"title",p_limit:12,p_offset:0});if(error){console.error(error);el.innerHTML='<div class="error">作品検索に失敗しました。</div>';return}const rows=(data||[]).filter(a=>!selected.some(x=>Number(x.id)===Number(a.id)));el.innerHTML=rows.length?'<div class="search-results">'+rows.map(a=>'<div class="search-result">'+(a.cover_image?'<img src="'+esc(a.cover_image)+'" alt="" decoding="async" loading="eager" fetchpriority="high">':'<div style="width:38px;height:52px;background:#eee;border-radius:5px"></div>')+'<div class="grow"><b>'+esc(title(a))+'</b><div class="muted">'+esc([a.season_year,a.season,a.format].filter(Boolean).join(" / "))+'</div></div><button data-id="'+a.id+'">追加</button></div>').join("")+'</div>':'<div class="empty">該当する作品がありません。</div>';el.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{if(selected.length<5){const a=rows.find(x=>Number(x.id)===Number(b.dataset.id));if(a)selected.push(a);render()}})}

async function loadComparison(){const el=document.getElementById("comparison");if(!selected.length){el.innerHTML='<div class="empty">比較する作品を選択してください。</div>';return}const ids=selected.map(a=>Number(a.id));const [{data:works,error:we},{data:stats,error:se}]=await Promise.all([client.rpc("get_anime_comparison_catalog",{p_anime_ids:ids}),client.rpc("get_anime_comparison_stats",{p_anime_ids:ids})]);if(we||se){console.error(we||se);el.innerHTML='<div class="error">比較情報を読み込めませんでした。</div>';return}const sm=new Map((stats||[]).map(x=>[Number(x.anime_id),x]));const val=v=>v===null||v===undefined||v===""?"—":esc(v);const row=(label,fn)=>'<tr><th class="label">'+label+'</th>'+works.map(a=>'<td>'+fn(a,sm.get(Number(a.id))||{})+'</td>').join("")+'</tr>';const image=a=>a.cover_image?'<img class="cover" src="'+esc(a.cover_image)+'" alt="'+esc(title(a))+'" loading="lazy" decoding="async">':'<div class="cover"></div>';el.innerHTML='<table class="compare-table"><thead><tr><th class="label">作品</th>'+works.map(a=>'<th>'+image(a)+'<div class="work-title">'+esc(title(a))+'</div><button class="remove-btn" data-remove="'+a.id+'">比較から外す</button></th>').join("")+'</tr></thead><tbody>'+row("形式",a=>val(a.format))+row("ジャンル",a=>val(a.genre))+row("放送時期",a=>val([a.season_year,a.season].filter(Boolean).join(" / ")))+row("放送期間",a=>val([a.start_date,a.end_date].filter(Boolean).join(" ～ ")))+row("話数",a=>val(a.episodes))+row("1話の長さ",a=>a.duration?esc(a.duration)+"分":"—")+row("状態",a=>val(a.status))+row("原作",a=>val(a.source))+row("公式サイト",a=>a.official_url?'<a href="'+esc(a.official_url)+'" target="_blank" rel="noopener">公式サイト</a>':"—")+row("Animecia評価",(_,s)=>s.average_rating?esc(Number(s.average_rating).toFixed(2))+" / 10":"—")+row("評価件数",(_,s)=>val(s.rating_count))+row("お気に入り数",(_,s)=>val(s.favorite_count))+row("レビュー数",(_,s)=>val(s.review_count))+row("あらすじ",a=>'<div style="line-height:1.7;min-width:180px">'+val(a.description)+'</div>')+'</tbody></table>';document.querySelectorAll("#comparison [data-remo
