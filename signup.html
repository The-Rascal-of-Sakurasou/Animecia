<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新規登録 | Animecia</title><meta name="description" content="Animeciaのアカウントを作成します。"><meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>main{max-width:520px;margin:60px auto;padding:20px}.panel{padding:30px}.field{margin-bottom:16px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit}.message{min-height:45px;margin:14px 0;font-size:13px}.links{margin-top:18px;font-size:13px}</style>

<script src="performance.js" defer></script>
<link rel="preconnect" href="https://bhgdjuwlxvbaeraaivmh.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="auth-core.js" defer></script>
<link rel="stylesheet" href="site-theme.css?v=20261012">
</head><body><main><section class="panel"><h1>新規登録</h1><p>Animeciaのアカウントを作成します。登録後、メールアドレスの確認が必要です。</p><form id="form"><div class="field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">パスワード</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="password2">パスワード（確認）</label><input id="password2" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn" id="submit">登録する</button><p id="message" class="message" aria-live="polite"></p></form><div class="links"><a href="login.html">ログインはこちら</a>　<a href="index.html">ホームへ戻る</a></div></section></main><script>const sb=AnimeciaAuth.client();const $=id=>document.getElementById(id);$("form").addEventListener("submit",async e=>{e.preventDefault();const email=$("email").value.trim(),p=$("password").value,p2=$("password2").value;if(p!==p2){$("message").textContent="パスワードが一致しません。";return}if(p.length<8){$("message").textContent="パスワードは8文字以上にしてください。";return}$("submit").disabled=true;$("message").textContent="登録しています…";try{const {data,error}=await sb.auth.signUp({email,password:p,options:{emailRedirectTo:location.origin+location.pathname.replace("signup.html","auth-callback.html")}});if(error){console.error(error);$("message").textContent="登録に失敗しました。入力内容を確認してください。";$("submit").disabled=false;return}if(data.session){await sb.auth.signOut()}$("message").textContent="登録を受け付けました。届いた確認メールのリンクからメールアドレスを確認してください。確認前はログインできません。"}catch(error){console.error("signup exception",error);$("message").textContent="登録処理に失敗しました。通信状態を確認して、もう一度お試しください。"}finally{$("submit").disabled=false}});</script></body></html>
