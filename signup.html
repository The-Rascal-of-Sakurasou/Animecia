<style>main{width:min(480px,calc(100% - 28px));margin:45px auto}.auth-panel{padding:28px;border:1px solid #293b56;border-radius:16px;background:#111b2b}.auth-panel h1{color:#fff;margin:8px 0;font-size:28px}.auth-panel>p{color:#a3b0c2;font-size:12px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;color:#b9c6d7;font-weight:800}.field input{height:44px;padding:10px;border:1px solid #30435f;border-radius:8px;background:#0b1423;color:#fff}.auth-panel button{width:100%;border:0;border-radius:8px;padding:12px;background:#f2a51a;color:#171b22;font-weight:900}.message{min-height:32px;color:#f2b84d;font-size:12px;line-height:1.7}.links{margin-top:18px;font-size:12px;color:#aebbd0}.links a{color:#f2b84d}</style>

<body><main><section class="auth-panel"><a href="index.html" style="color:#f2b84d;text-decoration:none;font-weight:900">ANIXIA</a><h1>新規登録</h1><p>アカウントを作成します。登録後、確認メールからメールアドレスを認証してください。</p>
<form id="signup-form"><div class="field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">パスワード（8文字以上）</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="password-confirm">パスワード（確認）</label><input id="password-confirm" type="password" minlength="8" autocomplete="new-password" required></div><button type="submit" id="submit">アカウントを作成</button><p class="message" id="message" aria-live="polite"></p></form>
<div class="links"><a href="login.html">ログインはこちら</a></div></section></main></body></html>
