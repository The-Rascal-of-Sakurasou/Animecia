<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メール確認 | Animecia</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>main{max-width:520px;margin:80px auto;padding:20px}.panel{padding:30px;text-align:center}.error{color:#b42318}</style><script src="performance.js" defer></script>
<link rel="preconnect" href="https://bhgdjuwlxvbaeraaivmh.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="auth-core.js" defer></script>
<link rel="stylesheet" href="site-theme.css?v=20261012">
</head><body><main><section class="panel"><h1 id="title">メールアドレスを確認しています…</h1><p id="message">しばらくお待ちください。</p></section></main><script>
const sb=AnimeciaAuth.client();
const title=document.getElementById("title"),message=document.getElementById("message"); let finished=false;
function success(){if(finished)return;finished=true;title.textContent="メールアドレスを確認しました";message.textContent="Animeciaへ移動します…";setTimeout(()=>location.replace("mypage.html"),500)}
function fail(){if(finished)return;finished=true;title.textContent="メール確認に失敗しました";message.className="error";message.textContent="リンクが期限切れか、無効になっています。ログインページから確認メールを再送信してください。"}
sb.auth.onAuthStateChange((event,session)=>{if((session?.user?.email_confirmed_at||session?.user?.confirmed_at))success();else if(event==="SIGNED_OUT")fail()});
(async()=>{const {data,error}=await sb.auth.getUser();if(!error&&(data?.user?.email_confirmed_at||data?.user?.confirmed_at)){success();return}setTimeout(async()=>{if(finished)return;const {data:d}=await sb.auth.getSession();if((d?.session?.user?.email_confirmed_at||d?.session?.user?.confirmed_at))success();else fail()},1500)})();
</script></body></html>
