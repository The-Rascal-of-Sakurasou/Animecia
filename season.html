:root{--season-accent:#03af6a;--season-ink:#17211d;--season-muted:#68756e;--season-line:#e3eae6;--season-soft:#f5f8f6}
.season-page{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:34px 0 76px;color:var(--season-ink)}
.season-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 0 22px;border-bottom:1px solid var(--season-line);margin-bottom:22px}
.season-hero small{display:inline-flex;align-items:center;gap:8px;color:var(--season-accent);font-size:11px;font-weight:850;letter-spacing:.14em}
.season-hero small:before{content:"";width:18px;height:2px;background:currentColor}

.season-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.season-controls label{color:#536159;font-size:12px;font-weight:750}
.season-controls select{height:42px;min-width:112px;padding:0 34px 0 12px;border:1px solid #d8e2dc;border-radius:9px;background:#fff;color:var(--season-ink);font:inherit;font-size:13px}
.season-controls select:focus-visible,.season-more:focus-visible{outline:3px solid #9edfc0;outline-offset:2px}
.season-count{color:var(--season-muted);font-size:12px;white-space:nowrap}
.season-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px 14px}
.season-card{display:block;min-width:0;overflow:hidden;border:1px solid var(--season-line);border-radius:11px;background:#fff;color:inherit;text-decoration:none;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.season-card:hover{transform:translateY(-3px);border-color:#b8dfca;box-shadow:0 8px 22px #183b2810}
.season-card .anixia-poster{width:100%;aspect-ratio:2/3;overflow:hidden;background:var(--season-soft)}
.season-card .anixia-poster img{display:block;width:100%;height:100%;object-fit:cover}
.season-card-copy{padding:10px 10px 12px}
.season-card-copy b{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;min-height:3em;color:#202a24;font-size:12px;line-height:1.5;font-weight:800;overflow-wrap:anywhere}
.season-card-copy small{display:block;margin-top:7px;color:var(--season-muted);font-size:10px;line-height:1.5}
.season-state{grid-column:1/-1;padding:42px 18px;text-align:center;border:1px dashed #cfdcd4;border-radius:12px;background:#fafcfb;color:var(--season-muted);font-size:13px;line-height:1.8}
.season-more-wrap{display:flex;justify-content:center;margin-top:24px}
.season-more{min-height:42px;padding:0 22px;border:1px solid #b9dfca;border-radius:9px;background:#f2faf5;color:#147b49;font-size:13px;font-weight:800;cursor:pointer}
.season-more:hover{background:#e6f6ed}
.season-more[hidden]{display:none}
@media(max-width:980px){.season-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:17px 12px}}
@media(max-width:700px){.season-page{width:calc(100% - 28px);padding:25px 0 64px}.season-hero{align-items:flex-start;flex-direction:column;gap:12px}.season-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:15px 10px}}
@media(max-width:480px){.season-page{width:calc(100% - 22px)}.season-toolbar{align-items:flex-start;flex-direction:column}.season-controls{width:100%;gap:7px}.season-controls select{flex:1;min-width:0}.season-count{align-self:flex-end}.season-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 8px}.season-card-copy{padding:8px}.season-card-copy b{font-size:11px}.season-card-copy small{font-size:9px}}
@media(max-width:360px){.season-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
@media(prefers-reduced-motion:reduce){.season-card{transition:none}}
