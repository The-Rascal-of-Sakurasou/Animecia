<style>

        .anime-page {

            max-width: 1400px;

            margin: 0 auto;

            padding:
                32px 20px 70px;
        }


        .page-header {

            margin-bottom: 28px;
        }


        .breadcrumb {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 14px;

            font-size: 13px;

            color: #777;
        }


        .breadcrumb a {

            color: inherit;

            text-decoration: none;
        }


        .breadcrumb a:hover {

            text-decoration: underline;
        }


        .page-header h1 {

            margin:
                0 0 10px;

            font-size:
                clamp(28px, 4vw, 42px);

            line-height: 1.2;
        }


        .page-header p {

            margin: 0;

            color: #666;

            line-height: 1.8;
        }


        .anime-search-area,
        .filter-area {

            margin-bottom: 24px;

            padding: 22px;

            background: #fff;

            border:
                1px solid #e8e8e8;

            border-radius: 16px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.04);
        }


        .search-box {

            display: flex;

            gap: 10px;
        }


        .search-box input {

            flex: 1;

            min-width: 0;

            height: 48px;

            padding:
                0 16px;

            border:
                1px solid #d8d8d8;

            border-radius: 10px;

            background: #fff;

            font-size: 15px;

            outline: none;
        }


        .search-box input:focus {

            border-color: #555;

            box-shadow:
                0 0 0 3px rgba(0,0,0,.05);
        }


        .search-button,
        .reset-button {

            height: 48px;

            padding:
                0 20px;

            border: 0;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 700;

            transition:
                .2s ease;
        }


        .search-button {

            background: #222;

            color: #fff;
        }


        .search-button:hover {

            opacity: .85;
        }


        .reset-button {

            background: #f0f0f0;

            color: #222;
        }


        .reset-button:hover {

            background: #e5e5e5;
        }


        .filter-title {

            margin:
                0 0 16px;

            font-size: 18px;

            font-weight: 800;
        }


        .filters {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(170px,1fr)
                );

            gap: 14px;
        }


        .filter-item {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .filter-item label {

            font-size: 13px;

            font-weight: 700;

            color: #555;
        }


        .filter-item select {

            width: 100%;

            height: 44px;

            padding:
                0 12px;

            border:
                1px solid #d8d8d8;

            border-radius: 9px;

            background: #fff;

            color: #222;

            font-size: 14px;

            outline: none;
        }


        .filter-item select:focus {

            border-color: #555;
        }


        .filter-actions {

            display: flex;

            justify-content:
                flex-end;

            margin-top: 16px;
        }


        .active-filters{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:-10px 0 18px;min-height:0}
        .active-filter{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #e1e4e8;border-radius:999px;background:#fff;color:#444;font-size:12px;font-weight:700;box-shadow:0 3px 10px rgba(16,20,26,.04)}
        .active-filter button{border:0;background:transparent;color:#888;cursor:pointer;font-size:15px;line-height:1;padding:0}
        .active-filter-label{color:#8a8f98;font-size:12px;font-weight:800}
        @media(max-width:700px){.active-filters{margin-top:-4px}.active-filter{font-size:11px}}

        .memo-toolbar {
            display:flex;
            align-items:center;
            flex-wrap:wrap;
            gap:10px;
            margin-bottom:18px;
            padding:12px 14px;
            background:#fff;
            border:1px solid #e7e7e7;
            border-radius:10px;
            color:#555;
            font-size:13px;
        }

        .memo-open,
        .memo-clear,
        .anime-memo-button {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-height:36px;
            padding:7px 12px;
            border:1px solid #d9d9d9;
            border-radius:8px;
            background:#f5f5f5;
            color:#222;
            font-size:12px;
            font-weight:700;
            text-decoration:none;
        }

        .memo-open {
            margin-left:auto;
            background:#111;
            color:#fff;
            border-color:#111;
        }

        .memo-clear,
        .anime-memo-button {
            cursor:pointer;
        }

        .anime-memo-button {
            width:100%;
            margin-top:12px;
        }

        .anime-memo-button.selected {
            background:#111;
            border-color:#111;
            color:#fff;
        }

        .result-header {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 15px;

            margin-bottom: 18px;
        }


        .result-count {

            margin: 0;

            font-size: 17px;

            font-weight: 800;
        }


        .result-count span {

            font-size: 24px;
        }


        .result-page {

            margin: 0;

            color: #777;

            font-size: 13px;
        }


        .anime-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(250px,1fr)
                );

            gap: 22px;
        }


        .anime-card {

            overflow: hidden;

            background: #fff;

            border:
                1px solid #e7e7e7;

            border-radius: 16px;

            box-shadow:
                0 5px 18px rgba(0,0,0,.05);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }


        .anime-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 12px 30px rgba(0,0,0,.09);
        }


        .anime-card-image {

            position: relative;

            width: 100%;

            aspect-ratio: 3 / 4;

            overflow: hidden;

            background: #f0f0f0;
        }


        .anime-card-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        .image-placeholder {

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #999;

            font-size: 14px;

            background:
                linear-gradient(
                    135deg,
                    #eeeeee,
                    #dddddd
                );
        }


        .score-badge {

            position: absolute;

            top: 10px;

            right: 10px;

            padding:
                6px 9px;

            border-radius: 8px;

            background:
                rgba(0,0,0,.82);

            color: #fff;

            font-size: 13px;

            font-weight: 800;

            backdrop-filter:
                blur(5px);
        }


        .recommended-badge {

            position: absolute;

            left: 10px;

            top: 10px;

            padding:
                5px 8px;

            border-radius: 7px;

            background:
                rgba(255,255,255,.92);

            color: #222;

            font-size: 10px;

            font-weight: 800;
        }


        .anime-card-body {

            padding: 17px;
        }


        .anime-card-title {

            margin:
                0 0 5px;

            font-size: 18px;

            line-height: 1.45;
        }


        .anime-card-title a {

            color: #222;

            text-decoration: none;
        }


        .anime-card-title a:hover {

            text-decoration:
                underline;
        }


        .anime-card-subtitle {

            margin:
                0 0 12px;

            color: #777;

            font-size: 12px;

            line-height: 1.5;
        }


        .meta-tags {

            display: flex;

            flex-wrap: wrap;

            gap: 6px;

            margin-bottom: 12px;
        }


        .meta-tag {

            display: inline-flex;

            align-items: center;

            padding:
                4px 7px;

            border-radius: 6px;

            background: #f2f2f2;

            color: #555;

            font-size: 11px;

            line-height: 1.2;
        }


        .genre-tag {

            background: #eeeeee;

            color: #333;
        }


        .anime-description {

            display: -webkit-box;

            -webkit-box-orient:
                vertical;

            -webkit-line-clamp: 4;

            overflow: hidden;

            margin:
                0 0 14px;

            color: #666;

            font-size: 13px;

            line-height: 1.75;
        }


        .anime-stats {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

            margin-bottom: 14px;
        }


        .anime-stat {

            padding: 9px;

            border-radius: 8px;

            background: #f7f7f7;
        }


        .anime-stat-label {

            display: block;

            margin-bottom: 2px;

            color: #888;

            font-size: 10px;
        }


        .anime-stat-value {

            font-size: 13px;

            font-weight: 800;
        }


        .detail-link {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            min-height: 42px;

            border-radius: 9px;

            background: #222;

            color: #fff;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            transition: .2s ease;
        }


        .detail-link:hover {

            opacity: .85;
        }


        .loading,
        .empty-state,
        .error-state {

            grid-column:
                1 / -1;

            padding:
                60px 20px;

            text-align: center;

            border:
                1px solid #e7e7e7;

            border-radius: 16px;

            background: #fff;
        }


        .loading {

            color: #777;
        }


        .empty-state h2,
        .error-state h2 {

            margin:
                0 0 8px;

            font-size: 20px;
        }


        .empty-state p,
        .error-state p {

            margin: 0;

            color: #777;

            line-height: 1.7;
        }


        .error-state {

            border-color:
                #ead5d5;
        }


        .error-state h2 {

            color: #a33;
        }


        .error-detail {

            margin-top:
                12px !important;

            font-size: 12px;

            color: #999 !important;

            word-break:
                break-word;
        }


        .pagination {

            display: flex;

            justify-content:
                center;

            align-items: center;

            flex-wrap: wrap;

            gap: 7px;

            margin-top: 32px;
        }


        .pagination button {

            min-width: 40px;

            height: 40px;

            padding:
                0 10px;

            border:
                1px solid #ddd;

            border-radius: 9px;

            background: #fff;

            color: #222;

            cursor: pointer;

            font-weight: 700;
        }


        .pagination button:hover:not(:disabled) {

            background: #f2f2f2;
        }


        .pagination button.active {

            background: #222;

            border-color: #222;

            color: #fff;
        }


        .pagination button:disabled {

            cursor: default;

            opacity: .45;
        }


        .pagination-info {

            margin:
                0 8px;

            color: #777;

            font-size: 13px;
        }


        @media (max-width: 700px) {

            .anime-page {

                padding:
                    24px 14px 50px;
            }


            .search-box {

                flex-direction:
                    column;
            }


            .search-button,
            .reset-button {

                width: 100%;
            }


            .anime-grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0,1fr)
                    );

                gap: 12px;
            }


            .anime-card-body {

                padding: 12px;
            }


            .anime-card-title {

                font-size: 15px;
            }


            .anime-description {

                -webkit-line-clamp: 3;

                font-size: 12px;
            }


            .anime-stats {

                grid-template-columns:
                    1fr;
            }


            .filter-actions {

                display: block;
            }


            .result-header {

                align-items:
                    flex-start;

                flex-direction:
                    column;
            }

        }


        @media (max-width: 430px) {

            .anime-grid {

                grid-template-columns:
                    1fr;
            }


            .anime-card-image {

                aspect-ratio:
                    3 / 4;
            }

        }

    </style>

    function escapeHTML(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    function safeURL(
        value
    ) {

        if (
            !value
        ) {

            return "";

        }


        try {

            const url =
                new URL(
                    String(value),
                    window.location.href
                );


            if (
                url.protocol === "http:" ||
                url.protocol === "https:"
            ) {

                return url.href;

            }

        } catch (
            error
        ) {

            return "";

        }


        return "";

    }


    function formatNumber(
        value
    ) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "—";

        }


        const number =
            Number(value);


        if (
            Number.isNaN(
                number
            )
        ) {

            return "—";

        }


        return number.toLocaleString(
            "ja-JP"
        );

    }


    function formatScore(
        value
    ) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {

            return "—";

        }


        const number =
            Number(value);


        if (
            Number.isNaN(
                number
            )
        ) {

            return "—";

        }


        return number.toFixed(
            1
        );

    }


    function getMainTitle(anime){ return AnimeciaData.title(anime); }

    function getSubTitle(
        anime
    ) {

        const main =
            getMainTitle(
                anime
            );


        const candidates = [

            anime.title_english,

            anime.english_title,

            anime.title_romaji,

            anime.title_native,

            anime.title_japanese,

            anime.title

        ];


        for (
            const title of candidates
        ) {

            if (
                title &&
                title !== main
            ) {

                return title;

            }

        }


        return "";

    }


    function getAnimeGenres(
        anime
    ) {

        const result =
            [];


        if (
            Array.isArray(
                anime?.anime_genres
            )
        ) {

            anime.anime_genres
                .forEach(
                    relation => {

                        const genre =
                            relation?.genres;


                        if (
                            genre?.id !== null &&
                            genre?.id !== undefined &&
                            genre?.name
                        ) {

                            result.push({

                                id:
                                    genre.id,

                                name:
                                    genre.name

                            });

                        }

                    }
                );

        }


        /*
         * 旧anime.genreにも対応
         */
        if (
            anime?.genre
        ) {

            const legacyGenres =
                String(
                    anime.genre
                )
                    .split(
                        /[,、\/]/g
                    )
                    .map(
                        value =>
                            value.trim()
                    )
                    .filter(Boolean);


            legacyGenres.forEach(
                name => {

                    if (
                        !result.some(
                            genre =>
                                genre.name === name
                        )
                    ) {

                        result.push({

                            id:
                                null,

                            name:
                                name

                        });

                    }

                }
            );

        }


        return result;

    }


    function formatStatus(
        value
    ) {

        const map = {

            FINISHED:
                "放送終了",

            RELEASING:
                "放送中",

            NOT_YET_RELEASED:
                "放送前",

            CANCELLED:
                "中止",

            HIATUS:
                "休止中"

        };


        return (
            map[value] ||
            value ||
            ""
        );

    }


    function formatSeason(
        value
    ) {

        const map = {

            WINTER:
                "冬",

            SPRING:
                "春",

            SUMMER:
                "夏",

            FALL:
                "秋"

        };


        return (
            map[value] ||
            value ||
            ""
        );

    }


    function formatFormat(
        value
    ) {

        const map = {

            TV:
                "TV",

            TV_SHORT:
                "TVショート",

            MOVIE:
                "劇場版",

            OVA:
                "OVA",

            ONA:
                "ONA",

            SPECIAL:
                "特別編",

            MUSIC:
                "Music"

        };


        return (
            map[value] ||
            value ||
            ""
        );

    }


    function getAnimeYear(
        anime
    ) {

        if (
            anime.season_year !== null &&
            anime.season_year !== undefined &&
            anime.season_year !== ""
        ) {

            return String(
                anime.season_year
            );

        }


        if (
            anime.start_date
        ) {

            const year =
                String(
                    anime.start_date
                )
                .slice(
                    0,
                    4
                );


            if (
                /^\d{4}$/.test(
                    year
                )
            ) {

                return year;

            }

        }


        return "";

    }


    function getCurrentSeason() {

        const month =
            new Date().getMonth();


        if (
            month <= 2
        ) {

            return "WINTER";

        }


        if (
            month <= 5
        ) {

            return "SPRING";

        }


        if (
            month <= 8
        ) {

            return "SUMMER";

        }


        return "FALL";

    }


    function getCurrentYear() {

        return new Date()
            .getFullYear();

    }


    function getQueryParams() {

        return new URLSearchParams(

    /* =========================================

    function loadURLParameters() {

        const params =
            getQueryParams();


        const search =

            params.get(
                "year"
            );


        const season =
            params.get(

            );

            );

            params.get(
                "format"
            );


        const genre =
            params.get(
                "genre"
            );


        const studio =
            params.get(
                "studio"
            );


        const sort =
            params.get(
                "sort"
            );


        const oldFilter =
            params.get(
                "filter"
            );


        const page =
            Number(
                params.get(
                    "page"
                )
            );


        if (
            search
        ) {

            searchInput.value =
                search;

        }


        if (
            year
        ) {

            yearFilter.value =
                year;

        }


        if (
            season
        ) {

            seasonFilter.value =
                season;

        }


        if (
            status
        ) {

            statusFilter.value =
                status;

        }


        if (
            format
        ) {

            formatFilter.value =
                format;

        }


        if (
            genre
        ) {

            genreFilter.value =
                genre;

        }

        if (
            studio
        ) {

            studioFilter.value =
                studio;

        }


        const validSorts = [

            "title",

            "newest",

            "popularity",

            "score",

            "oldest"

        ];


        if (
            sort &&
            validSorts.includes(
                sort
            )
        ) {

            sortFilter.value =
                sort;

        }


        /*
         * 旧URLとの互換
         */
        if (
            !sort &&
            oldFilter
        ) {

            if (
                oldFilter === "ranking"
            ) {

                sortFilter.value =
                    "popularity";

            }


            if (
                oldFilter === "season"
            ) {

                yearFilter.value =
                    String(
                        getCurrentYear()
                    );


                seasonFilter.value =
                    getCurrentSeason();

            }

        }


        if (
            Number.isInteger(
                page
            ) &&
            page > 0
        ) {

            currentPage =
                page;

        }

    }


    function updateURL() {

        const params =
            new URLSearchParams();


        const keyword =
            searchInput.value.trim();


        if (
            keyword
        ) {

            params.set(
                "search",
                keyword
            );

        }


        if (
            yearFilter.value
        ) {

            params.set(
                "year",
                yearFilter.value
            );

        }


        if (
            seasonFilter.value
        ) {

            params.set(
                "season",
                seasonFilter.value
            );

        }


        if (
            statusFilter.value
        ) {

            params.set(
                "status",
                statusFilter.value
            );

        }


        if (
            formatFilter.value
        ) {

            params.set(
                "format",
                formatFilter.value
            );

        }


        if (
            genreFilter.value
        ) {

            params.set(
                "genre",
                genreFilter.value
            );

        }

        if (
            studioFilter.value
        ) {

            params.set(
                "studio",
                studioFilter.value
            );

        }


        if (
            sortFilter.value &&
            sortFilter.value !== "title"
        ) {

            params.set(
                "sort",
                sortFilter.value
            );

        }


        if (
            currentPage > 1
        ) {

            params.set(
                "page",
                String(
                    currentPage
                )
            );

        }


        const query =
            params.toString();


        const url =
            query

                ? `${window.location.pathname}?${query}`

                : window.location.pathname;


        window.history.replaceState(
            {},
            "",
            url
        );

    }

        if (!activeFilters) return;

        add("season","季節",seasonFilter.options[seasonFilter.selectedIndex]?.textContent.trim(),()=>seasonFilter.value="");
        add("status","状態",statusFilter.options[statusFilter.selectedIndex]?.textContent.trim(),()=>statusFilter.value="");

    function normalizeTitleReading(anime){ return AnimeciaData.reading(anime); }
function compareAnimeTitles(a,b){ return AnimeciaData.compare(a,b); }

    /* =========================================
       Load anime
    ========================================= */

    async function loadAnime() {

        const requestVersion = ++loadRequestVersion;

        animeGrid.innerHTML =
            '<div class="loading">アニメ情報を読み込んでいます……</div>';

        resultPage.textContent = "読み込み中…";
        pagination.innerHTML = "";

        try {
            /*
             * 一覧取得は常にSupabase側でページングする。
             * 以前のタイトル順では全作品を取得してからクライアント側で
             * 並べ替え、さらにtitle_kanaを追加取得していたため、
             * 初回表示時に大量のリクエストが発生して失敗しやすかった。
             */
            const rpcParams = {
                p_query: searchInput.value.trim() || null,
                p_genre_id: genreFilter.value ? Number(genreFilter.value) : null,
                p_studio_id: studioFilter.value ? Number(studioFilter.value) : null,
                p_year: yearFilter.value ? Number(yearFilter.value) : null,
                p_season: seasonFilter.value || null,
                p_status: statusFilter.value || null,
                p_format: formatFilter.value || null,
                p_sort: sortFilter.value || "title",
                p_limit: PAGE_SIZE,
                p_offset: (currentPage - 1) * PAGE_SIZE
            };

            /*
             * 新しい共通RPCを優先し、公開環境でPostgRESTのスキーマ
             * キャッシュが一時的に古い場合は既存RPCへ自動フォールバックする。
             * これにより「アニメ情報を読み込めませんでした」で一覧全体が
             * 消えることを防ぐ。
             */
            let result = await supabaseClient.rpc("search_anime_catalog_v2", rpcParams);

            if (result.error) {
                console.warn("search_anime_catalog_v2 failed; falling back:", result.error);
                result = await supabaseClient.rpc("search_anime_catalog", rpcParams);
            }

            let data = result.data;
            let error = result.error;

            /*
             * RPCが両方失敗しても、公開ビューから一覧を取得する。
             * これによりRPCの未作成・スキーマキャッシュ不整合時にも
             * 一覧ページ全体が読み込み失敗にならないようにする。
             */
            if (error) {
                console.warn("Catalog RPCs unavailable; trying public view fallback:", error);
                let query = supabaseClient.from("animecia_public_anime").select(
                    "id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,english_title,cover_image,banner_image,format,genre,description,review,synopsis,official_url,site_url,streaming_links,start_date,end_date,episodes,duration,season,season_year,status,source,average_score,popularity,favourites_count",
                    { count: "exact" }
                ).gte("start_date", "1963-01-01");

                const q = rpcParams.p_query;
                if (q) {
                    const safeQ = q.replace(/[,%()]/g, " ").trim();
                    if (safeQ) {
                        query = query.or(
                            "title.ilike.%"+safeQ+"%,title_japanese.ilike.%"+safeQ+"%,title_native.ilike.%"+safeQ+"%,title_romaji.ilike.%"+safeQ+"%,title_english.ilike.%"+safeQ+"%,english_title.ilike.%"+safeQ+"%"
                        );
                    }
                }
                if (rpcParams.p_year != null) query = query.eq("season_year", rpcParams.p_year);
                if (rpcParams.p_season) query = query.eq("season", rpcParams.p_season);
                if (rpcParams.p_status) query = query.eq("status", rpcParams.p_status);
                if (rpcParams.p_format) query = query.eq("format", rpcParams.p_format);
                if (rpcParams.p_sort === "score") query = query.order("average_score", { ascending: false, nullsFirst: false });
                else if (rpcParams.p_sort === "popularity") query = query.order("favourites_count", { ascending: false, nullsFirst: false });
                else if (rpcParams.p_sort === "newest") query = query.order("start_date", { ascending: false, nullsFirst: false });
                else if (rpcParams.p_sort === "oldest") query = query.order("start_date", { ascending: true, nullsFirst: false });
                else query = query.order("title_japanese", { ascending: true, nullsFirst: false });

                const offset = rpcParams.p_offset;
                const limit = rpcParams.p_limit;
                const direct = await query.order("id", { ascending: true }).range(offset, offset + limit - 1);
                data = direct.data;
                error = direct.error;
                if (!error) {
                    const total = Number(direct.count || 0);
                    data = (data || []).map(row => ({ ...row, total_count: total }));
                }
            }

            if (error) {
                throw error;
            }

            if (requestVersion !== loadRequestVersion) {
                return;
            }

            /*
             * RPC側が返す公開カタログだけを表示対象とする。
             * start_dateのない壊れた/未完成データは一覧から除外する。
             */
            animeData = (data || []).filter(anime =>
                anime?.start_date &&
                anime.start_date >= "1963-01-01"
            );

            if (requestVersion !== loadRequestVersion) {
                return;
            }

            filteredAnime = animeData;

            /*
             * total_countはフィルター後のRPC結果に付与されている。
             * 0件の場合も安全に処理する。
             */
            serverTotal = Number(
                data?.[0]?.total_count ||
                0
            );

            /*
             * start_date除外によって現在ページが空になった場合、
             * サーバー総件数だけを信頼して無限に空ページを表示しない。
             */
            if (
                serverTotal > 0 &&
                animeData.length === 0 &&
                currentPage > 1
            ) {
                currentPage--;
                updateURL();
                await loadAnime();
                return;
            }

            resultCount.innerHTML =
                `<span>${formatNumber(serverTotal)}</span> 作品`;

            if (!serverTotal) {
                resultPage.textContent = "該当作品なし";

                animeGrid.innerHTML =
                    '<div class="empty-state">' +
                    '<h2>その条件のアニメはありません</h2>' +
                    '<p>検索条件やフィルターを変更してみてください。</p>' +
                    '</div>';

                pagination.innerHTML = "";
                renderActiveFilters();
                return;
            }

            const totalPages =
                Math.max(
                    1,
                    Math.ceil(
                        serverTotal / PAGE_SIZE
                    )
                );

            if (currentPage > totalPages) {
                currentPage = totalPages;
                updateURL();
                await loadAnime();
                return;
            }

            resultPage.textContent =
                `${currentPage} / ${totalPages} ページ`;

            animeGrid.innerHTML =
                animeData.length
                    ? animeData.map(createAnimeCard).join("")
                    : '<div class="empty-state">' +
                      '<h2>このページに表示できる作品がありません</h2>' +
                      '<p>前のページへ移動してください。</p>' +
                      '</div>';

            renderActiveFilters();
            renderPagination(totalPages);

            await initUserAnimeActions();

            bindMemoButtons();
            updateMemoUI();

        } catch (error) {
            if (requestVersion !== loadRequestVersion) {
                return;
            }

            console.error(
                "Anime loading error:",
                error
            );

            showLoadError(error);
        }
    }

    async function createYearOptions() {

            const { data, error } = await supabaseClient.rpc("get_catalog_years");
            if (error) throw error;

            yearFilter.innerHTML = '<option value="">すべて</option>';

            (data || []).forEach(row => {

                const option = document.createElement("option");
                option.value = String(year);
                option.textContent = String(year) + "年";
                yearFilter.appendChild(option);
            });

            if (selectedYear && [...yearFilter.options].some(option => option.value === selectedYear)) {
                yearFilter.value = selectedYear;
            }
        } catch (error) {
            console.error("Year option loading error:", error);
            yearFilter.innerHTML = '<option value="">すべて</option>';
            if (selectedYear) {
                const option = document.createElement("option");
                option.value = selectedYear;
                option.textContent = selectedYear + "年";
                yearFilter.appendChild(option);
                yearFilter.value = selectedYear;
            }
        }
    }

                    PAGE_SIZE
                )
            );

                total

        const pageAnime =
            filteredAnime.slice(

        resultCount.innerHTML =

    async function initUserAnimeActions(){
        const {data:{user}}=await supabaseClient.auth.getUser();
        if(!user || !user.email_confirmed_at) return;
        const ids=animeData.map(a=>a.id).filter(Boolean);
        if(!ids.length) return;

        // 視聴状態とお気に入りをまとめて取得し、作品ごとのRPC連打を避ける。
        const [watchResult, favoriteResult] = await Promise.all([
            supabaseClient.from("user_anime_status")
                .select("anime_id,status,progress")
                .eq("user_id",user.id)
                .in("anime_id",ids),
            supabaseClient.from("favorites")
                .select("anime_id")
                .eq("user_id",user.id)
                .in("anime_id",ids)
        ]);

        if(watchResult.error) console.error("視聴状態取得エラー:",watchResult.error);
        if(favoriteResult.error) console.error("お気に入り状態取得エラー:",favoriteResult.error);

        const watchMap=new Map((watchResult.data||[]).map(x=>[String(x.anime_id),x]));
        const favoriteIds=new Set((favoriteResult.data||[]).map(x=>String(x.anime_id)));

        ids.forEach(animeId=>{
            const box=document.querySelector('.user-anime-actions[data-user-actions="'+animeId+'"]');
            if(!box) return;
            const fb=box.querySelector(".favorite-toggle");
            const anime=animeData.find(x=>Number(x.id)===Number(animeId));
            const sel=box.querySelector(".watch-select");
            const active=favoriteIds.has(String(animeId));
            fb.classList.toggle("active",active);
            fb.setAttribute("aria-pressed",String(active));
            fb.textContent=active?"お気に入り登録済み":"お気に入り";

            const w=watchMap.get(String(animeId));
            if(w) sel.value=w.status||"";

            fb.onclick=async()=>{
                fb.disabled=true;
                try{
                    const {data,error}=await supabaseClient.rpc("toggle_my_anime_favorite",{p_anime_id:Number(animeId)});
                    if(error) throw error;
                    const nowActive=data===true;
                    fb.classList.toggle("active",nowActive);
                    fb.setAttribute("aria-pressed",String(nowActive));
                    fb.textContent=nowActive?"お気に入り登録済み":"お気に入り";
                }catch(error){ console.error("お気に入り更新エラー:",error); alert("お気に入りの更新に失敗しました。もう一度お試しください。"); }
                finally{fb.disabled=false;}
            };

            const save=async()=>{
                if(!sel.value)return;
                const total=Number(anime?.episodes||0);
                const savedProgress=Number(watchMap.get(String(animeId))?.progress||0);
                let progress=Number.isFinite(savedProgress) ? Math.max(0,Math.floor(savedProgress)) : 0;
                if(total>0) progress=Math.min(progress,total);
                const {error}=await supabaseClient.from("user_anime_status").upsert({user_id:user.id,anime_id:Number(animeId),status:sel.value,progress,updated_at:new Date().toISOString()},{onConflict:"user_id,anime_id"});
                if(error){console.error("視聴状況保存エラー:",error);alert("視聴状況の保存に失敗しました。");}
            };
            sel.onchange=save;
        });
    }

    /* =========================================
       Pagination
    ========================================= */

    function renderPagination(
        totalPages
    ) {

        pagination.innerHTML =
            "";


        if (
            totalPages <= 1
        ) {

            return;

        }


        const previous =
            document.createElement(
                "button"
            );


        previous.type =
            "button";


        previous.textContent =
            "‹";


        previous.setAttribute(
            "aria-label",
            "前のページ"
        );


        previous.disabled =
            currentPage <= 1;


        previous.addEventListener(
            "click",
            () => {

                if (
                    currentPage <= 1
                ) {

                    return;

                }


                currentPage--;


                updateURL();


                loadAnime();


                window.scrollTo({

                    top: 0,

                    behavior:
                        "smooth"

                });

            }
        );


        pagination.appendChild(
            previous
        );


        const pages =
            getPageNumbers(
                currentPage,
                totalPages
            );


        pages.forEach(
            page => {

                if (
                    page === "..."
                ) {

                    const span =
                        document.createElement(
                            "span"
                        );


                    span.className =
                        "pagination-info";


                    span.textContent =
                        "…";


                    pagination.appendChild(
                        span
                    );


                    return;

                }


                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.textContent =
                    String(
                        page
                    );


                button.setAttribute(
                    "aria-label",
                    `${page}ページ`
                );


                if (
                    page ===
                    currentPage
                ) {

                    button.className =
                        "active";


                    button.setAttribute(
                        "aria-current",
                        "page"
                    );

                }


                button.addEventListener(
                    "click",
                    () => {

                        currentPage =
                            page;


                        updateURL();


                        loadAnime();


                        window.scrollTo({

                            top: 0,

                            behavior:
                                "smooth"

                        });

                    }
                );


                pagination.appendChild(
                    button
                );

            }
        );


        const next =
            document.createElement(
                "button"
            );


        next.type =
            "button";


        next.textContent =
            "›";


        next.setAttribute(
            "aria-label",
            "次のページ"
        );


        next.disabled =
            currentPage >=
            totalPages;


        next.addEventListener(
            "click",
            () => {

                if (
                    currentPage >=
                    totalPages
                ) {

                    return;

                }


                currentPage++;


                updateURL();


                loadAnime();


                window.scrollTo({

                    top: 0,

                    behavior:
                        "smooth"

                });

            }
        );


        pagination.appendChild(
            next
        );

    }


    function getPageNumbers(
        current,
        total
    ) {

        if (
            total <= 7
        ) {

            return Array.from(
                {
                    length:
                        total
                },
                (
                    _,
                    index
                ) =>
                    index + 1
            );

        }


        const pages =
            [];


        pages.push(
            1
        );


        if (
            current > 4
        ) {

            pages.push(
                "..."
            );

        }


        const start =
            Math.max(
                2,
                current - 1
            );


        const end =
            Math.min(
                total - 1,
                current + 1
            );


        for (
            let page = start;
            page <= end;
            page++
        ) {

            pages.push(
                page
            );

        }


        if (
            current <
            total - 3
        ) {

            pages.push(
                "..."
            );

        }


        pages.push(
            total
        );


        return pages;

    }

    function getMemoIds() {
        try {
            const raw = localStorage.getItem("animecia_memo");
            if (!raw) return [];
            const ids = JSON.parse(raw);
            if (!Array.isArray(ids)) return [];
            return [...new Set(ids.map(Number).filter(Number.isInteger))];
        } catch (error) {
            return [];
        }
    }

    function updateMemoUI() {
        const ids = getMemoIds();
        const toolbar = document.getElementById("memo-toolbar");
        const count = document.getElementById("memo-count");
        const open = document.getElementById("memo-open");
        if (!toolbar) return;
        toolbar.style.display = ids.length ? "flex" : "none";
        if (count) count.textContent = String(ids.length);
        if (open) open.href = "memo.html";
        document.querySelectorAll(".anime-memo-button").forEach(button => {
            const id = Number(button.dataset.memoId);
            const selected = ids.includes(id);
            button.classList.toggle("selected", selected);
            button.textContent = selected ? "メモから外す" : "メモに追加";
        });
    }

    function setMemoIds(ids) {
        const clean = [...new Set(ids.map(Number).filter(Number.isInteger))];
        localStorage.setItem("animecia_memo", JSON.stringify(clean));
        updateMemoUI();
    }

    function bindMemoButtons() {
        document.querySelectorAll(".anime-memo-button").forEach(button => {
            button.onclick = event => {
                event.preventDefault();
                event.stopPropagation();
                const id = Number(button.dataset.memoId);
                let ids = getMemoIds();
                if (ids.includes(id)) {
                    ids = ids.filter(value => value !== id);
                } else {
                    ids.push(id);
                }
                setMemoIds(ids);
            };
        });
    }

    document.getElementById("memo-clear")?.addEventListener(

        const hasFilterParams = [
            "year", "season", "status", "format", "genre", "studio", "sort"
        ].some(key => params.has(key)) || params.has("filter");

        loadAnime();
        const optionsLoad = Promise.allSettled([
            createYearOptions(),
            createGenreOptions(),
            createStudioOptions()
        ]);

        await optionsLoad;

        // 候補がそろったあとでURL条件を復元し、指定条件がある場合だけ再検索する。
        loadURLParameters();
        if (hasFilterParams) {
            await loadAnime();
        }
    }

    initializeAnimePage();

</script>
