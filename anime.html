<style>
.anixia-page{width:min(1240px,calc(100% - 36px));margin:0 auto;padding:32px 0 70px}
.anixia-page-hero{padding:28px 30px;border:1px solid #293b56;border-radius:17px;background:linear-gradient(135deg,#101c30,#192c46);margin-bottom:18px}
.anixia-page-hero small{color:#f2b84d;font-size:10px;font-weight:900;letter-spacing:.16em}
.anixia-page-hero h1{color:#fff;font-size:clamp(28px,4vw,42px);margin:7px 0}
.anixia-page-hero p{color:#b7c4d6;font-size:13px;margin:0}
.anixia-filter-panel{padding:18px;border:1px solid #293b56;border-radius:14px;background:#111b2b;margin-bottom:18px}
.anixia-filter-grid{display:grid;grid-template-columns:2fr repeat(4,minmax(130px,1fr));gap:10px}
.anixia-field{display:flex;flex-direction:column;gap:6px}
.anixia-field label{font-size:11px;font-weight:800;color:#aebbd0}
.anixia-field input,.anixia-field select{width:100%;height:42px;border:1px solid #30435f;border-radius:8px;background:#0b1423;color:#f2f5fa;padding:0 11px;font-size:13px}.anixia-field select[multiple]{height:104px;padding:7px}.anixia-field .field-help{font-size:10px;color:#8fa0b9;line-height:1.5}
.anixia-filter-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:13px}
.anixia-filter-actions p{font-size:12px;color:#a3b0c2;margin:0}
.anixia-filter-actions button{border:0;border-radius:8px;background:#f2a51a;color:#171b22;font-weight:900;padding:10px 16px}.anixia-filter-actions .secondary{border:1px solid #344861;background:#17243a;color:#e8edf5}
.anixia-results-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 12px}
.anixia-results-head strong{font-size:13px;color:#e8edf5}
.anixia-results-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}
.anixia-result-card{min-width:0;border:1px solid #293b56;border-radius:12px;overflow:hidden;background:#111b2b;color:#f2f5fa;text-decoration:none;transition:.18s}
.anixia-result-card:hover{transform:translateY(-3px);border-color:#f2a51a}
.anixia-result-poster{aspect-ratio:3/4;background:linear-gradient(145deg,#263b59,#101827);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#8fa0b9;font-size:12px;font-weight:900}
.anixia-result-poster img{width:100%;height:100%;object-fit:cover}
.anixia-result-copy{padding:11px}
.anixia-result-copy b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.5}
.anixia-result-copy small{display:block;color:#9eacc0;font-size:10px;margin-top:6px}
.anixia-state{grid-column:1/-1;text-align:center;padding:34px 15px;color:#a3b0c2;border:1px dashed #354862;border-radius:12px;background:#0d1727;font-size:12px}
.anixia-pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:22px}
.anixia-pagination button{border:1px solid #344861;border-radius:8px;padding:9px 15px;background:#17243a;color:#fff;font-weight:800}
.anixia-pagination button:disabled{opacity:.35;cursor:not-allowed}
.anixia-pagination span{font-size:12px;color:#a3b0c2}
@media(max-width:1000px){.anixia-filter-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.anixia-filter-grid .wide{grid-column:1/-1}.anixia-results-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:700px){.anixia-page{width:calc(100% - 22px);padding:22px 0 55px}.anixia-page-hero{padding:22px}.anixia-filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.anixia-results-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.anixia-results-head{align-items:flex-start;flex-direction:column}}
@media(max-width:430px){.anixia-filter-grid{grid-template-columns:1fr}.anixia-filter-grid .wide{grid-column:auto}}
</style>

<main class="anixia-page">
  <section class="anixia-page-hero">
    <small>ANIME DATABASE</small>
    <h1>アニメ作品を探す</h1>
    <p>タイトルやジャンル、放送時期などを組み合わせて、気になる作品を検索できます。</p>
  </section>
  <form id="filter-form" class="anixia-filter-panel">
    <div class="anixia-filter-grid">
      <div class="anixia-field wide"><label for="query">作品・人物・キャラクター・制作会社・組織</label><input id="query" type="search" placeholder="作品名、英語名、旧称、人物名など…" autocomplete="off"></div>
      <div class="anixia-field"><label for="genre">ジャンル</label><select id="genre"><option value="">すべて</option></select></div>
      <div class="anixia-field"><label for="year">放送年</label><select id="year"><option value="">すべて</option></select></div>
      <div class="anixia-field"><label for="season">クール</label><select id="season"><option value="">すべて</option><option value="winter">冬</option><option value="spring">春</option><option value="summer">夏</option><option value="autumn">秋</option></select></div>
      <div class="anixia-field"><label for="format">形式</label><select id="format"><option value="">すべて</option><option value="tv">TV</option><option value="movie">劇場版</option><option value="ova">OVA</option><option value="ona">ONA</option><option value="special">特別編</option><option value="web">Web</option><option value="other">その他</option></select></div>
      <div class="anixia-field"><label for="studio">制作会社</label><select id="studio"><option value="">すべて</option></select></div>
      <div class="anixia-field"><label for="tag">タグ（複数選択可）</label><select id="tag" multiple size="4" aria-describedby="tag-help"></select><small id="tag-help" class="field-help">複数選択すると、いずれかのタグを持つ作品を表示します。</small></div>
      <div class="anixia-field"><label for="person">声優・スタッフ（別名を含む）</label><input id="person" type="search" placeholder="名前・英語名・旧称などで検索…" autocomplete="off"></div>
      <div class="anixia-field"><label for="character">キャラクター（別名を含む）</label><input id="character" type="search" placeholder="名前・英語名・ニックネームなどで検索…" autocomplete="off"></div>
      <div class="anixia-field"><label for="sort">並び順</label><select id="sort"><option value="newest">新着・新しい順</option><option value="popular">視聴者数順</option><option value="reviews">レビュー数順</option><option value="rating">評価順（5件以上）</option><option value="title">タイトル順</option></select></div>
    </div>
    <div class="anixia-filter-actions"><p id="result-summary" aria-live="polite">検索条件を設定してください。</p><div><button type="button" id="reset" class="secondary">条件をクリア</button> <button type="submit">検索する</button></div></div>
  </form>
  <div class="anixia-results-head"><strong>検索結果</strong><span id="result-count"></span></div>
  <section id="results" class="anixia-results-grid" aria-live="polite"><p class="anixia-state">作品情報を読み込んでいます…</p></section>
  <nav class="anixia-pagination" aria-label="検索結果ページ">
    <button type="button" id="prev" disabled>前へ</button><span id="page-label">1ページ目</span><button type="button" id="next" disabled>次へ</button>
  </nav>
</main>
