<title>作品詳細｜ANIXIA</title>

<style>
:root{--detail-green:#03AF6A;--detail-blue:#1DA1F2;--detail-ink:#17211c;--detail-muted:#66736d;--detail-line:#e3e9e5;--detail-soft:#f4f8f5}
.anixia-detail{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:30px 0 76px;color:var(--detail-ink)}
.anixia-detail-hero{display:grid;grid-template-columns:230px minmax(0,1fr);gap:30px;align-items:start;padding:26px;border:1px solid var(--detail-line)!important;border-radius:16px;background:#fff!important;box-shadow:0 5px 22px rgba(20,40,28,.045)!important}
.anixia-detail-poster-wrap{min-width:0}.anixia-detail-poster-frame{position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;border:1px solid var(--detail-line);border-radius:11px;background:linear-gradient(145deg,#e9f1ec,#dce8e1)}
.anixia-detail-poster{display:block;width:100%;height:100%;object-fit:cover;border-radius:10px;background:#f0f4f1}
.anixia-detail-poster-frame .anixia-poster-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;background:linear-gradient(145deg,#eef5f0,#dcebe2);color:#236b49!important}
.anixia-poster-brand{font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--detail-green)!important}.anixia-poster-title{font-size:17px;line-height:1.5;color:#244b36!important;overflow-wrap:anywhere}.anixia-poster-caption{font-size:9px;letter-spacing:.2em;color:#789184!important}
.anixia-detail-kicker{color:var(--detail-green)!important;font-size:10px;font-weight:850;letter-spacing:.16em}
.anixia-detail h1{font-size:clamp(26px,4vw,40px);line-height:1.25;margin:8px 0 5px;color:var(--detail-ink)!important;letter-spacing:-.035em}
.anixia-detail-subtitle{font-size:13px;color:var(--detail-muted)!important;margin-bottom:16px;line-height:1.7}
.anixia-detail-meta{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}
.anixia-detail-meta span,.anixia-detail-tags span,.anixia-detail-tags a{display:inline-flex;align-items:center;border:1px solid #dce8e0;border-radius:999px;padding:6px 10px;background:#f7faf8;color:#315b43!important;font-size:11px;text-decoration:none;line-height:1.45}
.anixia-detail-tags{display:flex;flex-wrap:wrap;gap:7px}
.anixia-detail-synopsis{color:#47564e!important;font-size:13px;line-height:2;white-space:pre-line;margin:16px 0 0}
.anixia-detail-source{margin:10px 0 0;color:#77847d!important;font-size:10px;line-height:1.8}.anixia-detail-source a{color:#168653!important;text-decoration:underline;text-underline-offset:2px}
.anixia-detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:start;gap:18px;margin-top:18px}
.anixia-detail-grid>div{min-width:0}
.anixia-detail-panel{min-width:0;padding:20px;margin:0 0 14px;border:1px solid var(--detail-line)!important;border-radius:13px;background:#fff!important;box-shadow:0 2px 10px rgba(20,40,28,.035)!important}
.anixia-detail-panel h2{font-size:16px;margin:0 0 14px;padding:0 0 10px;border-bottom:1px solid #edf1ee;color:var(--detail-ink)!important;font-weight:800;letter-spacing:-.015em}
.anixia-detail-info{display:grid;grid-template-columns:115px minmax(0,1fr);gap:11px 14px;font-size:12px}
.anixia-detail-info dt{color:#7a8980!important}.anixia-detail-info dd{margin:0;color:#25352b!important;overflow-wrap:anywhere}
.anixia-detail-info dd a{color:#13834f!important;text-decoration:underline;text-underline-offset:2px}
.anixia-detail-related,.anixia-detail-episodes{display:grid;gap:8px}
.anixia-detail-related a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid var(--detail-line);border-radius:9px;background:#fff;color:#24352b!important;text-decoration:none;font-size:12px;transition:border-color .15s,background .15s}
.anixia-detail-related a:hover{border-color:#9ed5b8;background:#f8fcf9}
.anixia-detail-related small{color:#748278!important;flex:0 0 auto}
.anixia-detail-episode{padding:11px 12px;border:1px solid var(--detail-line);border-radius:9px;background:#fbfcfb}
.anixia-detail-episode b{font-size:12px;color:#26372d!important}
.anixia-detail-episode p{font-size:11px;color:#77847c!important;line-height:1.8;margin:5px 0 0}
.anixia-detail-grid>aside{position:sticky;top:130px}
.anixia-detail-actions{display:grid;gap:12px}
.anixia-detail-actions button,.anixia-detail-actions select,.anixia-detail-actions input{width:100%;min-height:42px;border:1px solid #d4ded7!important;border-radius:8px;padding:9px 11px;background:#fff!important;color:#25352b!important}
.anixia-detail-actions button{background:var(--detail-green)!important;border-color:var(--detail-green)!important;color:#fff!important;font-weight:800;cursor:pointer}
.anixia-detail-actions button:hover{background:#028f56!important}
.anixia-detail-actions button.secondary{background:#fff!important;border-color:#cbd8cf!important;color:#24583b!important}
.anixia-detail-actions button.secondary:hover{background:#f3f8f5!important}
.anixia-detail-actions label{display:grid;gap:6px;font-size:11px;color:#5e6d63!important}
.anixia-detail-actions label:has(input[type=checkbox]){display:flex;align-items:center;gap:8px}
.anixia-detail-actions input[type=checkbox]{width:16px;min-height:16px}
.anixia-detail-actions textarea{width:100%;border:1px solid #d4ded7!important;border-radius:8px;padding:10px;background:#fff!important;color:#25352b!important}
.anixia-detail-message{font-size:11px;color:#168653!important;min-height:18px;line-height:1.7}
.anixia-review{border-top:1px solid #edf1ee;padding:14px 0}
.anixia-review:first-child{border-top:0;padding-top:0}
.anixia-review b{font-size:12px;color:#26372d!important}
.anixia-review p{font-size:12px;line-height:1.8;color:#65736a!important;margin:6px 0}
.anixia-empty{padding:20px;text-align:center;color:#77847c!important;font-size:12px;line-height:1.8;border:1px dashed #d5e0d8;border-radius:10px;background:#fbfdfb!important}
.anixia-empty a{color:#168653!important;text-decoration:underline}
.anixia-detail :where(a,button,input,select,textarea):focus-visible{outline:3px solid rgba(29,161,242,.32);outline-offset:2px}
.anixia-detail button:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:900px){.anixia-detail-grid{grid-template-columns:minmax(0,1fr) 270px;gap:13px}.anixia-detail-hero{grid-template-columns:190px minmax(0,1fr);gap:22px;padding:20px}}
@media(max-width:720px){.anixia-detail{width:calc(100% - 24px);padding:20px 0 58px}.anixia-detail-hero{grid-template-columns:112px minmax(0,1fr);gap:15px;padding:15px}.anixia-detail-grid{grid-template-columns:minmax(0,1fr)}.anixia-detail-grid>aside{position:static;grid-row:1}.anixia-detail-panel{padding:15px}.anixia-detail-info{grid-template-columns:95px minmax(0,1fr);gap:9px 10px}.anixia-detail-synopsis{font-size:12px;line-height:1.9}.anixia-detail h1{font-size:clamp(21px,6vw,30px)}}
@media(max-width:420px){.anixia-detail-hero{grid-template-columns:90px minmax(0,1fr);gap:12px;padding:12px}.anixia-detail-kicker{font-size:9px}.anixia-detail h1{font-size:21px}.anixia-detail-subtitle{font-size:11px}.anixia-detail-meta span,.anixia-detail-tags span,.anixia-detail-tags a{font-size:10px;padding:5px 8px}.anixia-detail-info{grid-template-columns:82px minmax(0,1fr);font-size:11px}}
@media(prefers-reduced-motion:reduce){.anixia-detail-related a{transition:none}}

.anixia-detail-jump{position:sticky;top:112px;z-index:5;display:flex;gap:5px;overflow-x:auto;margin:14px 0 18px;padding:8px;border:1px solid var(--detail-line);border-radius:11px;background:rgba(255,255,255,.96);box-shadow:0 3px 12px rgba(20,40,28,.04);scrollbar-width:thin}
.anixia-detail-jump a{flex:0 0 auto;padding:7px 11px;border-radius:7px;color:#53645a!important;text-decoration:none;font-size:11px;font-weight:750;white-space:nowrap}
.anixia-detail-jump a:hover{background:#eff7f1;color:#168653!important}
.anixia-detail [id]{scroll-margin-top:170px}
@media(max-width:720px){.anixia-detail-jump{top:106px;margin:10px 0 14px;padding:6px}.anixia-detail-jump a{padding:7px 9px;font-size:10px}.anixia-detail [id]{scroll-margin-top:150px}}
</style>
