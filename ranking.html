:root{--rank-green:#03af6a;--rank-blue:#1da1f2;--rank-ink:#17211d;--rank-muted:#68756e;--rank-line:#e3eae6;--rank-soft:#f5f8f6}

.rank-note{min-height:22px;margin:0 0 14px;color:var(--rank-muted);font-size:12px;line-height:1.7}
