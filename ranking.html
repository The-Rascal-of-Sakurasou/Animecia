<h1>アニメランキング</h1>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb=null;
function waitForSupabase(){
  return new Promise((resolve,reject)=>{
    const start=Date.now();
    (function check(){
      if(window.supabase&&typeof window.supabase.createClient==="function"){
        if(!sb)sb=AnimeciaAuth.client();
        return resolve(sb);
      }
      if(Date.now()-start>10000)return reject(new Error("Supabase SDK timeout"));
      setTimeout(check,50);
    })();
  });
}
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titleOf=a=>AnimeciaData.title(a);
const base="id,title_japanese,title_native,title_user_preferred,title_romaji,title_english,cover_image,start_date,format,season,season_year,average_score,anime_verification_status,original_country_code,original_country_status,catalog_policy_decision,is_adult,is_kids,is_preschool,is_sensitive_visual,duplicate_status,created_at";
let engagement=new Map();
let anime=new Map();
let mode="rating";
function valueFor(a,e){
 if(mode==="rating") return Number(e?.average_rating||0);
 if(mode==="favorites") return Number(e?.favorite_count||0);
 if(mode==="reviews") return Number(e?.review_count||0);
 return 0;
}
function labelFor(){
 if(mode==="rating") return "評価";
 if(mode==="favorites") return "お気に入り数";
 return "レビュー数";
}
function render(rows){
 const box=document.getElementById("ranking-list");
 if(!rows.length){
   const messages={
     rating:"評価が登録された作品はまだありません。作品詳細ページで評価すると、ここにランキングが表示されます。",
     favorites:"お気に入り登録された作品はまだありません。作品をお気に入りに追加すると、ここにランキングが表示されます。",
     reviews:"レビューが投稿された作品はまだありません。レビューが投稿されると、ここにランキングが表示されます。"
   };
   box.innerHTML='<div class="state">'+esc(messages[mode]||"このランキングに表示できる作品データがありません。")+'</div>';
   return;
 }
 let previous=null;
 let currentRank=0;
 box.innerHTML=rows.map((a,i)=>{
   const e=engagement.get(String(a.id)),v=valueFor(a,e);
   if(i===0) currentRank=1;
   else if(v!==previous) currentRank++;
   const rank=currentRank;
   previous=v;
   const display=v.toLocaleString("ja-JP");
   return '<a class="ranking-row" href="anime-detail.html?id='+encodeURIComponent(a.id)+'"><span class="rank-number">'+rank+'</span>'+(a.cover_image?'<img class="rank-cover" src="'+esc(a.cover_image)+'" alt="'+esc(titleOf(a))+'" loading="'+(i===0?'eager':'lazy')+'" decoding="async"'+(i===0?' fetchpriority="high"':'')+'>':'<div class="rank-cover"></div>')+'<div><div class="rank-title">'+esc(titleOf(a))+'</div><div class="rank-meta">'+esc(a.season_year||"")+' '+esc(a.format||"")+'</div></div><div class="rank-stats">'+display+'<small>'+labelFor()+'</small></div></a>';
 }).join("");
}
async function load(){
 await waitForSupabase();
 // 実際に評価・お気に入り・レビューがある作品だけを取得し、作品情報と結合する。
 const e=await sb.from("anime_engagement_summary")
   .select("anime_id,average_rating,rating_count,favorite_count,review_count,engagement_count")
   .gt("engagement_count",0)
   .order("engagement_count",{ascending:false})
   .limit(1000);
 if(e.error) throw e.error;
 engagement=new Map((e.data||[]).map(x=>[String(x.anime_id),x]));
 const ids=(e.data||[]).map(x=>x.anime_id).filter(Boolean);
 let rows=[];
 if(ids.length){
   const a=await sb.from("animecia_public_anime").select(base)
     .eq("anime_verification_status","verified")
     .in("id",ids);
   if(a.error) throw a.error;
   rows=(a.data||[]).filter(AnimeciaData.isPublic);
 }
 anime=new Map(rows.map(x=>[String(x.id),x]));
 sortAndRender();
}
function sortAndRender(){
 let rows=[...anime.values()].filter(a=>{const e=engagement.get(String(a.id));if(mode==="rating") return Number(e?.rating_count||0)>0 && Number(e?.average_rating||0)>0;return valueFor(a,e)>0;});
 rows.sort((a,b)=>{
   const av=valueFor(a,engagement.get(String(a.id))),bv=valueFor(b,engagement.get(String(b.id)));
   if(bv!==av) return bv-av;
   return Number(a.id)-Number(b.id);
 });
 render(rows);
}
document.querySelectorAll(".ranking-tab").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".ranking-tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");mode=btn.dataset.mode;sortAndRender();}));
load().catch(err=>{console.error(err);document.getElementById("ranking-list").innerHTML='<div class="state">ランキングの読み込みに失敗しました。時間をおいて再読み込みしてください。</div>';});
</script>
