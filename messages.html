}
async function send(){const input=document.getElementById("message-input"),fileInput=document.getElementById("message-image"),body=input.value.trim(),files=[...(fileInput?.files||[])];if((!body&&!files.length)||!currentThread)return;if(files.length>4){alert("写真は4枚まで添付できます。");return}const btn=document.getElementById("send");btn.disabled=true;let uploaded=[];try{for(const file of files){if(!file.type.startsWith("image/")||file.size>10*1024*1024)throw new Error("写真は各10MB以下で選択してください。");const path=currentUser.id+"/"+currentThread+"/"+crypto.randomUUID()+"-"+(file.name.replace(/[^a-zA-Z0-9._-]/g,"_").slice(-80)||"photo");const up=await sb.storage.from("message-media").upload(path,file,{contentType:file.type,cacheControl:"3600",upsert:false});if(up.error)throw up.error;uploaded.push({path,type:file.type,url:sb.storage.from("message-media").getPublicUrl(path).data.publicUrl})}const first=uploaded[0];const {data:msg,error}=await sb.from("thread_messages").insert({thread_id:currentThread,sender_id:currentUser.id,body,attachment_url:first?.url||null,attachment_path:first?.path||null,attachment_type:first?.type||null}).select("id").single();if(error)throw error;if(uploaded.length){const rows=uploaded.map((x,i)=>({message_id:msg.id,uploader_id:currentUser.id,storage_path:x.path,public_url:x.url,mime_type:x.type,sort_order:i}));const {error:me}=await sb.from("thread_message_media").insert(rows);if(me){console.warn("メッセージ写真メタデータの保存をスキップ:",me);if(uploaded.length>1)await sb.storage.from("message-media").remove(uploaded.slice(1).map(x=>x.path));}}input.value="";input.style.height="44px";fileInput.value="";document.getElementById("message-attachment").textContent="";document.getElementById("message-attachment").style.display="none";await loadMessages();await loadThreads()}catch(e){console.error(e);if(uploaded.length)await sb.storage.from("message-media").remove(uploaded.map(x=>x.path));alert("送信できませんでした。\n"+(e.message||"エラー"))}finally{btn.disabled=false}}
async function searchUsers(){const q=document.getElementById("user-search").value.trim().replace(/^@/,"");const el=document.getElementById("new-results");if(q.length<2){el.innerHTML="";return}const {data,error}=await sb.from("profiles").select("id,username,display_name,avatar_url,avatar_position_x,avatar_position_y,avatar_zoom,updated_at").or("username.ilike.%"+q+"%,display_name.ilike.%"+q+"%").neq("id",currentUser.id).limit(12);if(error){el.innerHTML='<div class="empty">検索できませんでした。</div>';return}el.innerHTML=(data||[]).map(p=>'<button class="user-choice" data-id="'+p.id+'">'+avatar(p)+'<span><b>'+esc(p.display_name||p.username||"ユーザー")+'</b><br><span class="small">@'+esc(p.username||"")+'</span></span></button>').join("")||'<div class="empty">ユーザーが見つかりません。</div>';document.querySelectorAll(".user-choice").forEach(b=>b.onclick=()=>{if(selectionMode!=="group"&&selectedUsers.length>=1){selectedUsers=[]}if(!selectedUsers.includes(b.dataset.id)){selectedUsers.push(b.dataset.id)}renderSelected()})}
async function renderSelected(){
 const el=document.getElementById("selected-users");
 if(!selectedUsers.length){el.innerHTML=selectionMode==="group"?'<div class="selection-hint">グループ作成中：検索結果から複数人を選択してください。</div>':"";return}
 const map=await getProfiles(selectedUsers);
 el.innerHTML='<div class="selection-hint">'+(selectionMode==="group"?"選択中のメンバー（"+selectedUsers.length+"人）":selectionMode==="add"?"追加するメンバー（"+selectedUsers.length+"人）":"選択中のユーザー")+'</div>'+selectedUsers.map(id=>{const p=map.get(id);return '<span class="chip">'+esc(p?.display_name||p?.username||"選択済み")+'<button type="button" class="chip-remove" data-remove-user="'+esc(id)+'" aria-label="選択を解除">×</button></span>'}).join("");
 el.querySelectorAll("[data-remove-user]").forEach(b=>b.onclick=()=>{selectedUsers=selectedUsers.filter(id=>id!==b.dataset.removeUser);renderSelected()});
}
async function createThread(group){
 if(group){
  selectionMode="group";
  if(selectedUsers.length<2){renderSelected();document.getElementById("user-search").focus();return}
 }else{
  selectionMode="dm";
  if(!selectedUsers.length){alert("ユーザーを1人選択してください。");return}
  if(selectedUsers.length!==1){alert("1対1では1人だけ選択してください。");return}
 }
 if(!group){
  const other=selectedUsers[0];
  const {data:mine}=await sb.from("message_members").select("thread_id").eq("user_id",currentUser.id);
  for(const x of mine||[]){
   const {data:row}=await sb.from("message_members").select("user_id").eq("thread_id",x.thread_id).eq("user_id",other).maybeSingle();
   if(row){selectedUsers=[];document.getElementById("new-results").innerHTML="";renderSelected();return openThread(x.thread_id)}
  }
 }
 const {data,error}=await sb.rpc("create_message_thread",{p_member_ids:[currentUser.id,...selectedUsers],p_is_group:group,p_title:group?"新しいグループ":null});
 if(error){console.error(error);alert("会話を作成できませんでした。");return}
 selectedUsers=[];selectionMode="dm";document.getElementById("new-results").innerHTML="";document.getElementById("user-search").value="";renderSelected();await loadThreads();await openThread(data)
}
async function start(){
 const {data}=await sb.auth.getSession();currentUser=data?.session?.user;if(!currentUser||!currentUser.email_confirmed_at){document.getElementById("auth-warning").style.display="block";return}
 document.getElementById("messenger").style.display="grid";const params=new URLSearchParams(location.search);
 const userId=params.get("user");if(userId){selectedUsers=[userId];}
 await loadThreads();
 const thread=params.get("thread");if(thread){const {data:m}=await sb.from("message_members").select("thread_id").eq("thread_id",thread).eq("user_id",currentUser.id).maybeSingle();if(m)await openThread(thread)}
 if(userId&&!thread){await createThread(false)}
}
document.addEventListener("DOMContentLoaded",()=>{document.getElementById("user-search").oninput=searchUsers;document.getElementById("start-dm").onclick=()=>{selectionMode="dm";selectedUsers=selectedUsers.slice(0,1);renderSelected()};document.getElementById("start-group").onclick=()=>createThread(true);document.getElementById("send").onclick=send;document.getElementById("message-input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};document.getElementById("message-input").oninput=e=>{e.target.style.height="44px";e.target.style.height=Math.min(e.target.scrollHeight,150)+"px"};document.getElementById("mobile-back").onclick=()=>document.getElementById("messenger").classList.remove("chat-open");start()});
function updateMessagePhotoPreview(){
 const input=document.getElementById("message-image"),preview=document.getElementById("message-attachment"),files=[...(input.files||[])];
 if(files.length>4){alert("写真は4枚までです。");input.value="";preview.style.display="none";return}
 if(files.length){
  preview.innerHTML='<div class="attach-photo-list">'+files.map((f,i)=>'<div class="attach-photo-item"><img src="'+URL.createObjectURL(f)+'" alt="" decoding="async" loading="lazy"><button type="button" class="attach-photo-remove" data-photo-index="'+i+'" aria-label="この写真を解除">×</button></div>').join("")+'</div><span>'+files.length+'枚を選択中</span>';
  preview.style.display="flex";
  preview.querySelectorAll(".attach-photo-remove").forEach(btn=>btn.onclick=()=>removeMessagePhoto(Number(btn.dataset.photoIndex)));
 }else{preview.innerHTML="";preview.style.display="none"}
}
function setMessageFiles(files){const dt=new DataTransfer();files.slice(0,4).forEach(f=>dt.items.add(f));document.getElementById("message-image").files=dt.files;updateMessagePhotoPreview()}
function removeMessagePhoto(index){const input=document.getElementById("message-image");setMessageFiles([...(input.files||[])].filter((_,i)=>i!==index))}
function clearMessagePhotos(){document.getElementById("message-image").value="";updateMessagePhotoPreview()}

document.addEventListener("DOMContentLoaded",()=>{const imageButton=document.getElementById("message-image-button"),imageInput=document.getElementById("message-image");imageButton.onclick=()=>imageInput.click();imageInput.addEventListener("change",updateMessagePhotoPreview)});
</script></body></html>
