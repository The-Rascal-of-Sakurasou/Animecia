<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>プロフィール | ANIXIA</title>
<meta id="meta-description" name="description" content="ANIXIAユーザーのプロフィール。">\n<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="anixia-client.js"></script>
<style>
main{max-width:1100px;margin:0 auto;padding:28px 16px 70px}
.profile-card,.panel{background:#fff;border:1px solid #e3e6ea;border-radius:16px;box-shadow:0 8px 26px rgba(17,24,39,.05)}
.profile-card{overflow:hidden;margin-bottom:16px}.profile-cover{height:150px;background:linear-gradient(135deg,#11151d 0%,#252b36 55%,#d9002b 180%);position:relative}.profile-cover:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 25%,rgba(255,255,255,.16),transparent 28%)}
.profile-main{padding:0 22px 20px;position:relative}.profile-avatar-wrap{position:relative;margin-top:-42px;width:88px;height:88px}.profile-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;object-position:50% 50%;background:#e8eaed;border:4px solid #fff;display:block}.profile-avatar-fallback{display:grid;place-items:center;font-size:30px;font-weight:900;color:#555}
.profile-actions{position:absolute;right:20px;top:16px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.profile-name{margin:12px 0 1px;font-size:25px;font-weight:950;letter-spacing:-.04em}.profile-handle{font-size:13px;color:#70757d}.profile-bio{margin:14px 0 16px;color:#343940;line-height:1.65;white-space:pre-wrap}.profile-stats{display:flex;gap:20px;flex-wrap:wrap}.profile-stat{font-size:13px;color:#666;background:none;border:0;padding:0;cursor:pointer}.profile-stat strong{color:#17191d;font-size:16px;margin-right:3px}.profile-stat:hover strong{color:#d9002b}
.panel{padding:20px}.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid #e3e6ea;margin:-20px -20px 0;padding:0 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:none;border:0;border-bottom:3px solid transparent;padding:15px 13px;background:transparent;color:#70757d;font-size:12px;font-weight:850;cursor:pointer;white-space:nowrap}.tab:hover{background:#f7f8fa;color:#17191d}.tab.active{border-bottom-color:#d9002b;color:#17191d;background:#fff}
.list{display:grid;gap:9px;margin-top:18px}.list-item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #e7e9ec;border-radius:11px;background:#fff;text-decoration:none;color:inherit}.thumb{width:58px;height:78px;object-fit:cover;border-radius:7px;background:#e5e7eb;flex:none}.avatar-small{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#e5e7eb;flex:none}.grow{flex:1;min-width:0}.title{font-weight:850;line-height:1.5;color:#17191d}.sub,.meta{color:#737373;font-size:12px;margin-top:4px}.meta{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0f1f3;color:#444;font-size:11px;font-weight:750}.review-item{padding:15px;border:1px solid #e7e9ec;border-radius:11px}.empty,.loading,.error{text-align:center;padding:34px 12px;color:#737373}.error{color:#b42318}
@media(max-width:600px){main{padding:16px 10px 50px}.profile-cover{height:120px}.profile-main{padding:0 16px 17px}.profile-actions{position:static;margin-top:10px;justify-content:flex-start}.profile-name{font-size:22px}.panel{padding:16px}.tabs{margin:-16px -16px 0}.tab{padding:14px 11px;font-size:11px}}
</style>

<script src="performance.js" defer></script>
<link rel="preconnect" href="https://trvnxggqzlhqdhoyiliy.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="auth-core.js"></script>
<link rel="stylesheet" href="site-theme.css?v=anixia-design-v4-20261119">
<link rel="preconnect" href="https://trvnxggqzlhqdhoyiliy.supabase.co">
<link rel="preconnect" href="https://bhgdjuwlxvbaeraaivmh.supabase.co">
</head>
<body>
<header><div class="wrap head"><a class="logo" href="index.html">ANIXIA</a><nav>
<a href="index.html">ホーム</a><a href="discover.html">探す</a>
<a href="season.html">今期</a><a href="recommendations.html">おすすめ</a><a href="community.html">コミュニティ</a><a href="compare.html">作品比較</a><a href="user-search.html">ユーザー検索</a><a href="mypage.html">マイページ</a>
</nav></div></header>
<main><div id="app" class="loading">読み込み中…</div></main>
<script>
"use strict";
const supabaseClient=ANIXIA.getClient();
const profileId=new URLSearchParams(location.search).get("id");
const app=document.getElementById("app");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hasJapanese=v=>/[\u3040-\u30ff\u3400-\u9fff]/u.test(String(v||""));
const isEnglish=()=>localStorage.getItem("anixia-language")==="en";
const titleOf=a=>isEnglish()?(a.title_en||(a.title&&!hasJapanese(a.title)?a.title:"English title unavailable")):(a.title_ja||a.title_kana||a.title||"タイトル未設定");
const mediaUrl=(url,stamp)=>{if(!url)return "";try{const u=new URL(url,location.href);if(stamp)u.searchParams.set("v",String(new Date(stamp).getTime()));return u.href}catch(_){return url}};
const imageMarkup=(url,alt)=>url?'<img class="thumb" src="'+esc(mediaUrl(url))+'" alt="'+esc(alt)+'" loading="lazy" decoding="async" fetchpriority="high">':'<div class="thumb" style="display:grid;place-items:center;color:#888">画像なし</div>';
async function getAnime(ids){
 const unique=[...new Set((ids||[]).filter(Boolean))],rows=[];
 for(let i=0;i<unique.length;i+=100)rows.push(...await ANIXIA.getPublicAnimeByIds(unique.slice(i,i+100)));
 return new Map(rows.map(a=>[a.id,a]));
}
let profile=null,visibility={},currentUser=null,tabs=[];
function renderHeader(stats,reviewCount,isSelf){
 const name=profile.display_name||profile.username||"ANIXIAユーザー";
 const x=Math.min(100,Math.max(0,Number(profile.avatar_position_x??50)));
 const y=Math.min(100,Math.max(0,Number(profile.avatar_position_y??50)));
 const z=Math.min(220,Math.max(100,Number(profile.avatar_zoom??100)));
 const avatar=profile.avatar_url
  ?'<img class="profile-avatar" style="object-position:'+x+'% '+y+'%;transform:scale('+(z/100)+')" src="'+esc(mediaUrl(profile.avatar_url,profile.updated_at))+'" alt="'+esc(name)+'" loading="lazy" decoding="async">'
  :'<div class="profile-avatar profile-avatar-fallback">'+esc(name.slice(0,1))+'</div>';
 const actions=isSelf
  ?'<a class="btn" href="mypage.html">プロフィールを編集</a>'
  :'<button id="follow-button" class="btn" type="button">'+(stats.is_following?"フォロー中":"フォロー")+'</button><a class="btn secondary" href="messages.html?user='+encodeURIComponent(profileId)+'">メッセージ</a>';
 const reviewStat=visibility.reviews?'<span class="profile-stat"><strong>'+esc(reviewCount||0)+'</strong>レビュー</span>':"";
 const follows=visibility.user_follows
  ?'<div class="profile-stats">'+reviewStat+'<button id="followers-link" class="profile-stat" type="button"><strong>'+esc(stats.followers_count||0)+'</strong>フォロワー</button><button id="following-link" class="profile-stat" type="button"><strong>'+esc(stats.following_count||0)+'</strong>フォロー中</button></div>'
  :(reviewStat?'<div class="profile-stats">'+reviewStat+'</div>':"");
 return '<section class="profile-card"><div id="profile-cover" class="profile-cover"></div><div class="profile-main"><div class="profile-avatar-wrap">'+avatar+'</div><div class="profile-actions">'+actions+'</div><h1 class="profile-name">'+esc(name)+'</h1><div class="profile-handle">'+(profile.username?"@"+esc(String(profile.username).replace(/^@/,"")):"@ユーザー名未設定")+'</div><div class="profile-bio">'+esc(profile.bio||"自己紹介はまだありません。")+'</div>'+follows+'</div></section>';
}
function makeTabs(){
 const defs=[
  ["posts","投稿","posts"],
  ["favorites","お気に入り","favorites"],
  ["plan_to_watch","視聴予定","anime_follows"],
  ["watching","視聴中","watch_status"],
  ["completed","視聴完了","watch_status"],
  ["ratings","評価","ratings"],
  ["ranking","高評価順","ranking"],
  ["reviews","レビュー","reviews"],
  ["user_following","フォロー","user_follows"],
  ["user_followers","フォロワー","user_follows"]
 ];
 return defs.filter(x=>visibility[x[2]]);
}
async function renderContent(){
 const {data:statsData}=await supabaseClient.rpc("get_profile_follow_stats",{p_profile_id:profileId});
 const stats=statsData?.[0]||{followers_count:0,following_count:0,is_following:false};
 const {count:reviewCount}=await supabaseClient.from("reviews").select("id",{count:"exact",head:true}).eq("user_id",profileId);
 const auth=await supabaseClient.auth.getUser();currentUser=auth.data?.user||null;
 const isSelf=currentUser?.id===profileId;
 app.innerHTML=renderHeader(stats,reviewCount||0,isSelf)+'<section class="panel"><div id="tabs" class="tabs">'+makeTabs().map((x,i)=>'<button class="tab'+(i===0?" active":"")+'" data-tab="'+x[0]+'" type="button">'+x[1]+'</button>').join("")+'</div><div id="list" class="list"></div></section>';
 tabs=makeTabs().map(x=>x[0]);
 document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>activateTab(b.dataset.tab)));
 document.getElementById("followers-link")?.addEventListener("click",()=>activateTab("user_followers"));
 document.getElementById("following-link")?.addEventListener("click",()=>activateTab("user_following"));
 await setupFollow(isSelf);
 const cover=document.getElementById("profile-cover");
 if(cover&&profile.background_url){
  const bx=Math.min(100,Math.max(0,Number(profile.background_position_x??50)));
  const by=Math.min(100,Math.max(0,Number(profile.background_position_y??50)));
  const bz=Math.min(180,Math.max(100,Number(profile.background_zoom??100)));
  cover.style.backgroundImage='url("'+mediaUrl(profile.background_url,profile.updated_at).replace(/"/g,"%22")+'")';
  cover.style.backgroundPosition=bx+"% "+by+"%";cover.style.backgroundSize=bz+"% auto";
 }
 if(tabs.length)await loadTab(tabs[0]);
 else document.getElementById("list").innerHTML='<div class="empty">公開されている項目はありません。</div>';
}
function activateTab(name){
 if(!tabs.includes(name))return;
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===name));
 loadTab(name);
}
async function setupFollow(isSelf){
 const b=document.getElementById("follow-button");if(!b||isSelf)return;
 if(!currentUser||!(currentUser.email_confirmed_at||currentUser.confirmed_at)){
  b.textContent="ログインしてフォロー";
  b.onclick=()=>location.href="login.html?redirect="+encodeURIComponent(location.href);
  return;
 }
 b.onclick=async()=>{
  b.disabled=true;
  try{
   const {data,error}=await supabaseClient.rpc("toggle_user_follow",{p_following_id:profileId});
   if(error)throw error;
   b.textContent=data?.[0]?.is_following?"フォロー中":"フォロー";
   const s=await supabaseClient.rpc("get_profile_follow_stats",{p_profile_id:profileId});
   const x=s.data?.[0];
   if(x){const el=document.querySelector("#followers-link strong");if(el)el.textContent=String(x.followers_count||0);}
  }catch(e){console.error("フォロー更新エラー",e);alert("フォローを更新できませんでした。")}
  finally{b.disabled=false}
 };
}
function renderAnimeRows(rows,map,label){
 const el=document.getElementById("list");
 el.innerHTML=(rows||[]).map(x=>{
  const a=map.get(x.anime_id);if(!a)return "";
  return '<a class="list-item" href="anime-detail.html?id='+encodeURIComponent(a.id)+'">'+imageMarkup(a.poster_url,titleOf(a))+'<div class="grow"><div class="title">'+esc(titleOf(a))+'</div><div class="meta"><span class="pill">'+esc(label(x))+'</span></div></div></a>';
 }).join("")||'<div class="empty">公開されている作品はありません。</div>';
}
async function renderUsers(ids){
 const el=document.getElementById("list");
 if(!ids.length){el.innerHTML='<div class="empty">ユーザーはいません。</div>';return}
 const {data,error}=await supabaseClient.from("profiles").select("id,username,display_name,avatar_url,bio,updated_at").in("id",ids);
 if(error)throw error;
 const map=new Map((data||[]).map(p=>[p.id,p]));
 el.innerHTML=ids.map(id=>{
  const p=map.get(id);if(!p)return "";
  const name=p.display_name||p.username||"ANIXIAユーザー";
  const avatar=p.avatar_url?'<img class="thumb" src="'+esc(mediaUrl(p.avatar_url,p.updated_at))+'" alt="" loading="lazy" decoding="async">':'<div class="thumb" style="display:grid;place-items:center">'+esc(name.slice(0,1))+'</div>';
  return '<a class="list-item" href="profile.html?id='+encodeURIComponent(id)+'">'+avatar+'<div class="grow"><div class="title">'+esc(name)+'</div><div class="meta">'+(p.username?"@"+esc(p.username):"")+'</div></div></a>';
 }).join("")||'<div class="empty">公開されているユーザーはいません。</div>';
}
async function loadTab(tab){
 const el=document.getElementById("list");el.innerHTML='<div class="loading">読み込み中…</div>';
 try{
  if(tab==="posts"){
   const {data,error}=await supabaseClient.from("social_posts").select("id,author_id,body,attachment_url,created_at").eq("author_id",profileId).is("deleted_at",null).is("reply_to_id",null).order("created_at",{ascending:false}).limit(100);
   if(error)throw error;
   const ids=(data||[]).map(x=>x.id),media=new Map();
   if(ids.length){const mr=await supabaseClient.from("social_post_media").select("post_id,public_url,sort_order").in("post_id",ids).order("sort_order",{ascending:true});if(!mr.error)(mr.data||[]).forEach(x=>{if(!media.has(x.post_id))media.set(x.post_id,[]);media.get(x.post_id).push(x.public_url)})}
   el.innerHTML=(data||[]).map(x=>'<article class="review-item"><div class="sub">投稿 ・ '+esc(new Date(x.created_at).toLocaleString("ja-JP"))+'</div><div style="margin-top:8px;white-space:pre-wrap;line-height:1.7">'+esc(x.body||"")+'</div>'+((media.get(x.id)||[]).length?'<div class="post-media-grid">'+media.get(x.id).map(u=>'<img src="'+esc(u)+'" alt="投稿された写真" loading="lazy" decoding="async">').join("")+'</div>':x.attachment_url?'<img src="'+esc(x.attachment_url)+'" alt="投稿された写真" loading="lazy" style="display:block;max-width:min(100%,420px);max-height:360px;object-fit:contain;border-radius:12px;margin-top:9px" decoding="async">':"")+'<div style="margin-top:9px"><a class="btn secondary" href="community.html?post='+encodeURIComponent(x.id)+'">投稿を開く</a></div></article>').join("")||'<div class="empty">公開されている投稿はありません。</div>';
   return;
  }
  if(tab==="favorites"||tab==="plan_to_watch"||tab==="watching"||tab==="completed"||tab==="ratings"||tab==="ranking"){
   let query;
   if(tab==="favorites")query=supabaseClient.from("favorites").select("anime_id,created_at").eq("user_id",profileId).order("created_at",{ascending:false});
   else if(tab==="ratings"||tab==="ranking")query=supabaseClient.from("ratings").select("anime_id,score,updated_at").eq("user_id",profileId).order(tab==="ranking"?"score":"updated_at",{ascending:false});
   else query=supabaseClient.from("watch_entries").select("anime_id,status,episodes_watched,updated_at").eq("user_id",profileId).eq("status",tab==="plan_to_watch"?"plan_to_watch":tab).order("updated_at",{ascending:false});
   const {data,error}=await query;if(error)throw error;
   const rows=data||[],map=await getAnime(rows.map(x=>x.anime_id));
   const labels={
    favorites:()=>"お気に入り",
    plan_to_watch:()=>"視聴予定",
    watching:x=>"視聴中"+(x.episodes_watched!=null?" ・ "+x.episodes_watched+"話":""),
    completed:()=>"視聴完了",
    ratings:x=>"評価 "+x.score+"/10",
    ranking:(x,i)=>"高評価順 "+(i+1)+"位 ・ "+x.score+"/10"
   };
   if(tab==="ranking"){
    el.innerHTML=rows.map((x,i)=>{const a=map.get(x.anime_id);if(!a)return "";return '<a class="list-item" href="anime-detail.html?id='+encodeURIComponent(a.id)+'"><div style="width:34px;text-align:center;font-weight:900;color:#03AF6A">'+(i+1)+'</div>'+imageMarkup(a.poster_url,titleOf(a))+'<div class="grow"><div class="title">'+esc(titleOf(a))+'</div><div class="meta">'+esc(labels.ranking(x,i))+'</div></div></a>'}).join("")||'<div class="empty">評価済みの作品はありません。</div>';
   }else renderAnimeRows(rows,map,labels[tab]);
   return;
  }
  if(tab==="reviews"){
   const {data,error}=await supabaseClient.from("reviews").select("id,anime_id,title,body,spoiler,is_published,created_at").eq("user_id",profileId).order("created_at",{ascending:false}).limit(100);
   if(error)throw error;
   const map=await getAnime((data||[]).map(x=>x.anime_id));
   el.innerHTML=(data||[]).map(x=>{const a=map.get(x.anime_id);if(!a)return "";return '<article class="review-item"><a class="title" href="anime-detail.html?id='+encodeURIComponent(a.id)+'">'+esc(titleOf(a))+'</a><div class="sub">'+esc(x.title||"レビュー")+(x.spoiler?" ・ ネタバレあり":"")+(x.is_published?"":" ・ 公開審査待ち")+'</div><div class="meta" style="white-space:pre-wrap">'+esc(x.body)+'</div></article>'}).join("")||'<div class="empty">公開されているレビューはありません。</div>';
   return;
  }
  if(tab==="user_following"||tab==="user_followers"){
   const col=tab==="user_following"?"follower_id":"following_id";
   const {data,error}=await supabaseClient.from("user_follows").select("follower_id,following_id,created_at").eq(col,profileId).order("created_at",{ascending:false}).limit(100);
   if(error)throw error;
   const ids=(data||[]).map(x=>tab==="user_following"?x.following_id:x.follower_id);
   await renderUsers(ids);return;
  }
  el.innerHTML='<div class="empty">表示できる情報はありません。</div>';
 }catch(e){console.error("プロフィール項目の読み込みエラー",e);el.innerHTML='<div class="error">情報を読み込めませんでした。<br><small>'+esc(e.message||"データ取得エラー")+'</small></div>'}
}
async function start(){
 if(!profileId){app.innerHTML='<div class="error">プロフィールIDが指定されていません。</div>';return}
 try{
  const {data,error}=await supabaseClient.from("profiles").select("id,username,display_name,avatar_url,bio,is_public,avatar_position_x,avatar_position_y,avatar_zoom,background_url,background_position_x,background_position_y,background_zoom,show_posts,show_favorites,show_anime_follows,show_watch_status,show_ratings,show_reviews,show_user_follows,show_ranking,updated_at").eq("id",profileId).maybeSingle();
  if(error||!data){app.innerHTML='<div class="error">プロフィールを取得できませんでした。</div>';return}
  profile=data;
  visibility={
   posts:data.show_posts!==false,favorites:data.show_favorites!==false,
   anime_follows:data.show_anime_follows!==false,watch_status:data.show_watch_status!==false,
   ratings:data.show_ratings!==false,reviews:data.show_reviews!==false,
   user_follows:data.show_user_follows!==false,ranking:data.show_ranking!==false
  };
  const name=profile.display_name||profile.username||"ANIXIAユーザー";
  document.title=name+" | ANIXIA";
  const meta=document.getElementById("meta-description");if(meta)meta.content=name+"のANIXIAプロフィール。";
  await renderContent();
 }catch(e){console.error("プロフィール取得エラー",e);app.innerHTML='<div class="error">プロフィールを読み込めませんでした。</div>'}
}
document.addEventListener("DOMContentLoaded",start);
</script>
