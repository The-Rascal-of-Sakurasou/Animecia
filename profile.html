<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>プロフィール | Animecia</title>
<meta id="meta-description" name="description" content="Animeciaユーザーのプロフィール。">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="anime-data.js"></script>
<style>
main{max-width:1100px;margin:0 auto;padding:28px 16px 70px}
.profile-card,.panel{background:#fff;border:1px solid #e3e6ea;border-radius:16px;box-shadow:0 8px 26px rgba(17,24,39,.05)}
.profile-card{overflow:hidden;margin-bottom:16px}.profile-cover{height:150px;background:linear-gradient(135deg,#11151d 0%,#252b36 55%,#d9002b 180%);position:relative}.profile-cover:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 25%,rgba(255,255,255,.16),transparent 28%)}
.profile-main{padding:0 22px 20px;position:relative}.profile-avatar-wrap{position:relative;margin-top:-42px;width:88px;height:88px}.profile-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;object-position:50% 50%;background:#e8eaed;border:4px solid #fff;display:block}.profile-avatar-fallback{display:grid;place-items:center;font-size:30px;font-weight:900;color:#555}
.profile-actions{position:absolute;right:20px;top:16px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.profile-name{margin:12px 0 1px;font-size:25px;font-weight:950;letter-spacing:-.04em}.profile-handle{font-size:13px;color:#70757d}.profile-bio{margin:14px 0 16px;color:#343940;line-height:1.65;white-space:pre-wrap}.profile-stats{display:flex;gap:20px;flex-wrap:wrap}.profile-stat{font-size:13px;color:#666;background:none;border:0;padding:0;cursor:pointer}.profile-stat strong{color:#17191d;font-size:16px;margin-right:3px}.profile-stat:hover strong{color:#d9002b}
.panel{padding:20px}.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid #e3e6ea;margin:-20px -20px 0;padding:0 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:none;border:0;border-bottom:3px solid transparent;padding:15px 13px;background:transparent;color:#70757d;font-size:12px;font-weight:850;cursor:pointer;white-space:nowrap}.tab:hover{background:#f7f8fa;color:#17191d}.tab.active{border-bottom-color:#d9002b;color:#17191d;background:#fff}
.list{display:grid;gap:9px;margin-top:18px}.list-item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #e7e9ec;border-radius:11px;background:#fff;text-decoration:none;color:inherit}.thumb{width:58px;height:78px;object-fit:cover;border-radius:7px;background:#e5e7eb;flex:none}.avatar-small{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#e5e7eb;flex:none}.grow{flex:1;min-width:0}.title{font-weight:850;line-height:1.5;color:#17191d}.sub,.meta{color:#737373;font-size:12px;margin-top:4px}.meta{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0f1f3;color:#444;font-size:11px;font-weight:750}.review-item{padding:15px;border:1px solid #e7e9ec;border-radius:11px}.empty,.loading,.error{text-align:center;padding:34px 12px;color:#737373}.error{color:#b42318}
@media(max-width:600px){main{padding:16px 10px 50px}.profile-cover{height:120px}.profile-main{padding:0 16px 17px}.profile-actions{position:static;margin-top:10px;justify-content:flex-start}.profile-name{font-size:22px}.panel{padding:16px}.tabs{margin:-16px -16px 0}.tab{padding:14px 11px;font-size:11px}}
</style>

<script src="performance.js" defer></script>
<link rel="preconnect" href="https://bhgdjuwlxvbaeraaivmh.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="auth-core.js" defer></script>
<link rel="stylesheet" href="site-theme.css?v=20261012">
</head>
<body>
<header><div class="wrap head"><a class="logo" href="index.html">Animecia</a><nav>
<a href="index.html">ホーム</a><a href="discover.html">探す</a>
<a href="season.html">今期</a><a href="recommendations.html">おすすめ</a><a href="community.html">コミュニティ</a><a href="compare.html">作品比較</a><a href="mypage.html">ユーザー検索</a><a href="mypage.html">マイページ</a>
</nav></div></header>
<main><div id="app" class="loading">読み込み中…</div></main>
<script>
const SUPABASE_URL="https://bhgdjuwlxvbaeraaivmh.supabase.co";
const SUPABASE_KEY="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
const supabaseClient=AnimeciaAuth.client();
const profileId=new URLSearchParams(location.search).get("id");
const mediaUrl=(url,stamp)=>{if(!url)return "";try{const u=new URL(url,location.href);if(stamp)u.searchParams.set("v",String(new Date(stamp).getTime()));return u.href}catch(_){return url}};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titleOf=a=>AnimeciaData.title(a);
const imageMarkup=(url,alt)=>url?'<img class="thumb" src="'+esc(url)+'" alt="'+esc(alt)+'" loading="lazy" decoding="async" fetchpriority="high">':'<div class="thumb" style="display:grid;place-items:center;color:#888">画像なし</div>';
const getAnime=async ids=>{const u=[...new Set((ids||[]).map(Number).filter(Number.isInteger))],m=new Map();for(let i=0;i<u.length;i+=500){const {data}=await supabaseClient.from("animecia_public_anime").select("id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,english_title,cover_image,format,season,season_year,status").in("id",u.slice(i,i+500));(data||[]).forEach(a=>m.set(Number(a.id),a));}return m;};
let profile=null,visibility={},currentUser=null,tabs=[];
function renderHeader(followStats,reviewCount,isSelf){
 const name=profile.display_name||profile.username||"Animeciaユーザー";
 const ax=Math.min(100,Math.max(0,Number(profile.avatar_position_x??50))),ay=Math.min(100,Math.max(0,Number(profile.avatar_position_y??50))),az=Math.min(220,Math.max(100,Number(profile.avatar_zoom??100)));
 const avatar=profile.avatar_url?'<img class="profile-avatar" style="object-position:'+ax+'% '+ay+'%;transform:scale('+(az/100)+')" src="'+esc(mediaUrl(profile.avatar_url,profile.updated_at))+'" alt="'+esc(name)+'" decoding="async" loading="lazy">':'<div class="profile-avatar profile-avatar-fallback">'+esc(name.slice(0,1))+'</div>';
 const actions=isSelf?'<a class="btn" href="mypage.html">プロフィールを編集</a>':'<button id="follow-button" class="btn" type="button">'+(followStats.is_following?"フォロー中":"フォロー")+'</button><a class="btn secondary" href="messages.html?user='+encodeURIComponent(profileId)+'">メッセージ</a>';
 const reviewStat=visibility.reviews!==false?'<span class="profile-stat"><strong>'+esc(reviewCount||0)+'</strong>レビュー</span>':"";
 const follows=visibility.user_follows!==false?'<div class="profile-stats">'+reviewStat+'<button id="followers-link" class="profile-stat"><strong>'+esc(followStats.followers_count||0)+'</strong>フォロワー</button><button id="following-link" class="profile-stat"><strong>'+esc(followStats.following_count||0)+'</strong>フォロー中</button></div>':(reviewStat?'<div class="profile-stats">'+reviewStat+'</div>':"");
 return '<section class="profile-card"><div id="profile-cover" class="profile-cover" style="background-image:"></div><div class="profile-main"><div class="profile-avatar-wrap">'+avatar+'</div><div class="profile-actions">'+actions+'</div><h1 class="profile-name">'+esc(name)+'</h1><div class="profile-handle">'+(profile.username?"@"+esc(String(profile.username).replace(/^@/,"")):"@ユーザー名未設定")+'</div><div class="profile-bio">'+esc(profile.bio||"自己紹介はまだありません。")+'</div>'+follows+'</div></section>';
}
function makeTabs(){
 const defs=[
  ["posts","投稿","show_posts"],["favorites","お気に入り","show_favorites"],["follows","作品フォロー","show_anime_follows"],
  ["watching","視聴中","show_watch_status"],["completed","視聴完了","show_watch_status"],["want_to_watch","視聴予定","show_watch_status"], ["ratings","評価","show_ratings"],["reviews","レビュー","show_reviews"],["ranking","個人ランキング","show_ranking"],
  ["user_following","フォロー","show_user_follows"],["user_followers","フォロワー","show_user_follows"]
 ];
 return defs.filter(x=>visibility[x[2]]!==false);
}
async function renderContent(){
 const {data:followData}=await supabaseClient.rpc("get_profile_follow_stats",{p_profile_id:profileId});
 const followStats=followData?.[0]||{followers_count:0,following_count:0,is_following:false};
 const {count:reviewCount}=await supabaseClient.from("reviews").select("id",{count:"exact",head:true}).eq("user_id",profileId);
 const user=await supabaseClient.auth.getUser();currentUser=user.data?.user||null;
 const isSelf=currentUser?.id===profileId;
 document.getElementById("app").innerHTML=renderHeader(followStats,reviewCount||0,isSelf)+'<section class="panel"><div id="tabs" class="tabs">'+makeTabs().map((x,i)=>'<button class="tab'+(i===0?" active":"")+'" data-tab="'+x[0]+'" type="button">'+x[1]+'</button>').join("")+'</div><div id="list" class="list"></div></section>';
 tabs=makeTabs().map(x=>x[0]);
 document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");loadTab(b.dataset.tab);}));
 if(visibility.user_follows!==false){
  document.getElementById("followers-link")?.addEventListener("click",()=>activateTab("user_followers"));
  document.getElementById("following-link")?.addEventListener("click",()=>activateTab("user_following"));
 }
 await setupFollow(isSelf);
 const cover=document.getElementById("profile-cover");if(cover&&profile.background_url){const bx=Math.min(100,Math.max(0,Number(profile.background_position_x??50))),by=Math.min(100,Math.max(0,Number(profile.background_position_y??50))),bz=Math.min(180,Math.max(100,Number(profile.background_zoom??100)));cover.style.backgroundImage="url(\""+mediaUrl(profile.background_url,profile.updated_at).replace(/\"/g,"%22")+"\")";cover.style.backgroundPosition=bx+"% "+by+"%";cover.style.backgroundSize=bz+"% auto";}
 if(tabs.length)await loadTab(tabs[0]);else document.getElementById("list").innerHTML='<div class="empty">公開されている項目はありません。</div>';
}
function activateTab(name){if(!tabs.includes(name))return;const b=document.querySelector('.tab[data-tab="'+name+'"]');if(b)b.click();}
async function setupFollow(isSelf){
 const b=document.getElementById("follow-button");if(!b||isSelf)return;
 const {data}=await supabaseClient.auth.getUser(),u=data?.user;
 if(!u||!u.email_confirmed_at){b.textContent="ログインしてフォロー";b.onclick=()=>location.href="login.html?redirect="+encodeURIComponent(location.href);return;}
 b.onclick=async()=>{b.disabled=true;const {data,error}=await supabaseClient.rpc("toggle_user_follow",{p_following_id:profileId});if(error){b.disabled=false;return;}const r=data?.[0];b.textContent=r?.is_following?"フォロー中":"フォロー";const s=await supabaseClient.rpc("get_profile_follow_stats",{p_profile_id:profileId});const x=s.data?.[0];if(x){const f=document.querySelector("#followers-link strong");if(f)f.textContent=String(x.followers_count||0);}b.disabled=false;};
}
function renderAnimeRows(rows,map,label){
 const list=document.getElementById("list");list.innerHTML=(rows||[]).map(x=>{const a=map.get(Number(x.anime_id));if(!a)return"";return '<a class="list-item" href="anime-detail.html?id='+a.id+'">'+imageMarkup(a.cover_image,titleOf(a))+'<div class="grow"><div class="title">'+esc(titleOf(a))+'</div><div class="meta"><span class="pill">'+esc(label(x))+'</span></div></div></a>';}).join("")||'<div class="empty">公開されている作品はありません。</div>';
}
async function loadTab(tab){
 const el=document.getElementById("list");el.innerHTML='<div class="loading">読み込み中…</div>';
 try{
  if(tab==="posts"){
   const {data,error}=await supabaseClient.from("social_posts").select("id,author_id,body,attachment_url,attachment_type,reply_to_id,quote_post_id,created_at").eq("author_id",profileId).is("deleted_at",null).is("reply_to_id",null).order("created_at",{ascending:false}).limit(100);if(error)throw error;
   el.innerHTML=(data||[]).map(x=>'<article class="review-item"><div class="sub">投稿 ・ '+esc(new Date(x.created_at).toLocaleString("ja-JP"))+'</div><div style="margin-top:8px;white-space:pre-wrap;line-height:1.7">'+esc(x.body||"")+(x.attachment_url?'<img src="'+esc(x.attachment_url)+'" alt="投稿された写真" loading="lazy" style="display:block;max-width:min(100%,420px);max-height:360px;object-fit:contain;border-radius:12px;margin-top:9px;background:#f3f4f6" decoding="async">' : "")+'</div><div style="margin-top:9px"><a class="btn secondary" href="community.html?post='+encodeURIComponent(x.id)+'">投稿を開く</a></div></article>').join("")||'<div class="empty">公開されている投稿はありません。</div>';return;
  }
  if(tab==="favorites"){const {data,error}=await supabaseClient.from("favorites").select("anime_id,created_at").eq("user_id",profileId).order("created_at",{ascending:false});if(error)throw error;renderAnimeRows(data,await getAnime((data||[]).map(x=>x.anime_id)),()=> "お気に入り");return;}
  if(tab==="follows"){const {data,error}=await supabaseClient.from("user_anime_follows").select("anime_id,created_at").eq("user_id",profileId).order("created_at",{ascending:false});if(error)throw error;renderAnimeRows(data,await getAnime((data||[]).map(x=>x.anime_id),),()=> "作品フォロー");return;}
  if(["watching","completed","want_to_watch"].includes(tab)){const {data,error}=await supabaseClient.from("user_anime_status").select("anime_id,status,progress,updated_at").eq("user_id",profileId).eq("status",tab).order("updated_at",{ascending:false});if(error)throw error;const labels={watching:"視聴中",completed:"視聴完了",want_to_watch:"視聴予定"};renderAnimeRows(data,await getAnime((data||[]).map(x=>x.anime_id)),x=>labels[x.status]+(x.progress!=null?" ・ "+x.progress+"話":""));return;}
  if(tab==="ratings"){const {data,error}=await supabaseClient.from("user_ratings").select("anime_id,rating,updated_at").eq("user_id",profileId).order("updated_at",{ascending:false});if(error)throw error;renderAnimeRows(data,await getAnime((data||[]).map(x=>x.anime_id)),x=>"★ "+x.rating+"/10");return;}

  if(tab==="ranking"){const {data,error}=await supabaseClient.from("user_anime_rankings").select("anime_id,rank,updated_at").eq("user_id",profileId).order("rank",{ascending:true});if(error)throw error;const rows=data||[],map=await getAnime(rows.map(x=>x.anime_id));el.innerHTML=rows.map((x,i)=>{const a=map.get(Number(x.anime_id));if(!a)return"";return '<a class="list-item" href="anime-detail.html?id='+a.id+'"><div style="width:34px;text-align:center;font-weight:900;color:#e87900">'+(i+1)+'</div>'+imageMarkup(a.cover_image,titleOf(a))+'<div class="grow"><div class="title">'+esc(titleOf(a))+'</div><div class="sub">個人ランキング '+(i+1)+'位</div></div></a>';}).join("")||'<div class="empty">公開されている個人ランキングはありません。</div>';return;}
  if(tab==="reviews"){const {data,error}=await supabaseClient.from("reviews").select("id,anime_id,title,content,rating,spoiler,likes_count,created_at,updated_at").eq("user_id",profileId).order("created_at",{ascending:false}).limit(100);if(error)throw error;const map=await getAnime((data||[]).map(x=>x.anime_id));el.innerHTML=(data||[]).map(x=>{const a=map.get(Number(x.anime_id));if(!a)return"";return '<article class="review-item"><a class="title" href="anime-detail.html?id='+a.id+'">'+esc(titleOf(a))+'</a><div class="sub">'+esc(x.title||"レビュー")+(x.rating!=null?" ・ ★ "+esc(x.rating)+"/10":"")+(x.spoiler?" ・ ネタバレあり":"")+'</div><div class="meta">'+(x.updated_at?new Date(x.updated_at).toLocaleDateString("ja-JP"):"")+(Number(x.likes_count||0)>0?" ・ いいね "+esc(x.likes_count):"")+'</div><div class="sub" style="margin-top:10px;white-space:pre-wrap;line-height:1.7">'+esc(x.content||"")+'</div></article>';}).join("")||'<div class="empty">公開されているレビューはありません。</div>';return;}
  if(tab==="user_following"||tab==="user_followers"){const col=tab==="user_followers"?"following_id":"follower_id";const {data,error}=await supabaseClient.from("user_follows").select("follower_id,following_id,created_at").eq(col,profileId).order("created_at",{ascending:false}).limit(100);if(error)throw error;const ids=(data||[]).map(x=>tab==="user_followers"?x.follower_id:x.following_id);const {data:ps}=ids.length?await supabaseClient.from("profiles").select("id,username,display_name,avatar_url,avatar_position_x,avatar_position_y,avatar_zoom,updated_at,bio").in("id",ids):{data:[]};const pm=new Map((ps||[]).map(p=>[p.id,p]));el.innerHTML=ids.map(id=>{const p=pm.get(id);if(!p)return"";const n=p.display_name||p.username||"Animeciaユーザー";return '<a class="list-item" href="profile.html?id='+encodeURIComponent(id)+'">'+(p.avatar_url?'<img class="avatar-small" src="'+esc(mediaUrl(p.avatar_url,p.updated_at))+'" alt="" decoding="async" loading="lazy">':'<div class="avatar-small" style="display:grid;place-items:center;font-weight:800;color:#888">'+esc(n.slice(0,1))+'</div>')+'<div class="grow"><div class="title">'+esc(n)+'</div><div class="sub">'+(p.username?"@"+esc(String(p.username).replace(/^@/,"")):"ユーザー名未設定")+'</div>'+(p.bio?'<div class="sub">'+esc(p.bio).slice(0,120)+'</div>':"")+'</div></a>';}).join("")||'<div class="empty">ユーザーはいません。</div>';return;}
 }catch(e){console.error("profile tab error",e);el.innerHTML='<div class="error">この項目を取得できませんでした。</div>';}
}
async function start(){
 const app=document.getElementById("app");
 if(!profileId){app.innerHTML='<div class="error">プロフィールIDが指定されていません。</div>';return;}
 const {data,error}=await supabaseClient.from("profiles").select("id,username,display_name,avatar_url,background_url,avatar_position_x,avatar_position_y,avatar_zoom,background_position_x,background_position_y,background_zoom,bio,show_posts,show_favorites,show_anime_follows,show_watch_status,show_ratings,show_reviews,show_user_follows,show_ranking,updated_at").eq("id",profileId).maybeSingle();
 if(error||!data){app.innerHTML='<div class="error">プロフィールを取得できませんでした。</div>';return;}
 profile=data;visibility={favorites:data.show_favorites!==false,anime_follows:data.show_anime_follows!==false,watch_status:data.show_watch_status!==false,ratings:data.show_ratings!==false,reviews:data.show_reviews!==false,user_follows:data.show_user_follows!==false,ranking:data.show_ranking!==false,posts:data.show_posts!==false};
 const name=profile.display_name||profile.username||"Animeciaユーザー";document.title=name+" | Animecia";document.getElementById("meta-description").content=name+"のAnimeciaプロフィール。";await renderContent();
}
start();
</script>
</body></html>
