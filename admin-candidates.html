<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>アニメ候補審査 | Animecia</title>

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  


  <style>

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      background: #f5f6f8;

      color: #171717;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      line-height: 1.7;
    }


    button,
    input,
    textarea,
    select {
      font: inherit;
    }


    a {
      color: inherit;
    }


    /* =========================================================
       Header
    ========================================================= */

    header {
      background: #111;

      color: #fff;
    }


    .header-inner {
      width:
        min(
          1200px,
          calc(100% - 30px)
        );

      min-height: 64px;

      margin: 0 auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .logo {
      color: #fff;

      text-decoration: none;

      font-size: 20px;

      font-weight: 700;

      white-space: nowrap;
    }


    .header-actions {
      display: flex;

      align-items: center;

      gap: 10px;
    }


    .header-actions a,
    .header-actions button {
      min-height: 40px;

      padding:
        8px 13px;

      border:
        1px solid #444;

      border-radius: 8px;

      background: #222;

      color: #fff;

      text-decoration: none;

      cursor: pointer;
    }


    .header-actions a:hover,
    .header-actions button:hover {
      background: #333;
    }


    /* =========================================================
       Main
    ========================================================= */

    main {
      width:
        min(
          1200px,
          calc(100% - 30px)
        );

      margin: 0 auto;

      padding:
        35px 0 70px;
    }


    .page-header {
      margin-bottom: 24px;
    }


    .page-header h1 {
      margin:
        0 0 8px;

      font-size: 30px;

      line-height: 1.35;
    }


    .page-header p {
      margin: 0;

      color: #666;

      font-size: 14px;

      line-height: 1.8;
    }


    /* =========================================================
       Summary
    ========================================================= */

    .summary-grid {
      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );

      gap: 12px;

      margin-bottom: 20px;
    }


    .summary-card {
      padding:
        16px;

      border:
        1px solid #ddd;

      border-radius: 12px;

      background: #fff;
    }


    .summary-label {
      color: #666;

      font-size: 12px;
    }


    .summary-value {
      margin-top: 4px;

      font-size: 25px;

      font-weight: 700;
    }


    .summary-value.accepted {
      color: #19733c;
    }


    .summary-value.review {
      color: #9b6800;
    }


    .summary-value.rejected {
      color: #a52b2b;
    }


    /* =========================================================
       Filter
    ========================================================= */

    .filter-bar {
      display: flex;

      flex-wrap: wrap;

      align-items: center;

      gap: 8px;

      margin-bottom: 20px;
    }


    .filter-button {
      min-height: 38px;

      padding:
        7px 12px;

      border:
        1px solid #d5d5d5;

      border-radius: 999px;

      background: #fff;

      color: #333;

      cursor: pointer;
    }


    .filter-button:hover {
      background: #f0f0f0;
    }


    .filter-button.active {
      border-color: #111;

      background: #111;

      color: #fff;
    }


    /* =========================================================
       Message
    ========================================================= */

    .message {
      min-height: 24px;

      margin-bottom: 16px;

      font-size: 14px;
    }


    .message.success {
      color: #16723a;
    }


    .message.error {
      color: #b00020;
    }


    /* =========================================================
       Candidate list
    ========================================================= */

    .candidate-list {
      display: grid;

      gap: 18px;
    }


    .candidate-card {
      overflow: hidden;

      border:
        1px solid #ddd;

      border-radius: 14px;

      background: #fff;

      box-shadow:
        0 2px 12px
        rgba(0, 0, 0, .04);
    }


    .candidate-card.accepted {
      border-color: #b9d9c4;
    }


    .candidate-card.review {
      border-color: #e3d09b;
    }


    .candidate-card.rejected {
      border-color: #e4bcbc;
    }


    .candidate-main {
      padding: 22px;
    }


    .candidate-header {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 16px;
    }


    .candidate-title {
      margin: 0;

      font-size: 23px;

      line-height: 1.45;

      word-break: break-word;
    }


    .candidate-id {
      margin-top: 5px;

      color: #777;

      font-size: 12px;
    }


    /* =========================================================
       Decision
    ========================================================= */

    .decision-area {
      flex:
        0 0 auto;

      min-width: 180px;

      text-align: right;
    }


    .decision-badge {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 110px;

      padding:
        7px 11px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 700;
    }


    .decision-badge.accepted {
      background: #dff2e4;

      color: #176b35;
    }


    .decision-badge.review {
      background: #fff1c7;

      color: #8b6100;
    }


    .decision-badge.rejected {
      background: #f6dddd;

      color: #922727;
    }


    .confidence {
      margin-top: 7px;

      color: #666;

      font-size: 12px;
    }


    .confidence-bar {
      width: 180px;

      height: 7px;

      margin:
        5px 0 0 auto;

      overflow: hidden;

      border-radius: 999px;

      background: #e8e8e8;
    }


    .confidence-bar-inner {
      height: 100%;

      border-radius: inherit;

      background: #222;

      transition:
        width .2s ease;
    }


    /* =========================================================
       Reasons
    ========================================================= */

    .reason-box {
      margin-top: 18px;

      padding: 14px 16px;

      border-radius: 10px;

      background: #f7f7f7;
    }


    .reason-title {
      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 700;
    }


    .reason-list {
      margin: 0;

      padding-left: 20px;

      color: #555;

      font-size: 13px;
    }


    .reason-list li + li {
      margin-top: 3px;
    }


    /* =========================================================
       Duplicate warning
    ========================================================= */

    .duplicate-warning {
      margin-top: 12px;

      padding:
        11px 13px;

      border:
        1px solid #e3aaaa;

      border-radius: 9px;

      background: #fff6f6;

      color: #8d2525;

      font-size: 13px;
    }


    /* =========================================================
       Fields
    ========================================================= */

    .fields {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 14px;

      margin-top: 20px;
    }


    .field {
      display: flex;

      flex-direction: column;

      gap: 6px;
    }


    .field.full {
      grid-column:
        1 / -1;
    }


    .field label {
      color: #555;

      font-size: 12px;

      font-weight: 700;
    }


    .field input,
    .field textarea,
    .field select {
      width: 100%;

      padding:
        10px 11px;

      border:
        1px solid #d5d5d5;

      border-radius: 8px;

      outline: none;

      background: #fff;

      color: #111;
    }


    .field textarea {
      min-height: 90px;

      resize: vertical;
    }


    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #111;
    }


    .field input:disabled,
    .field textarea:disabled,
    .field select:disabled {
      background: #f4f4f4;

      color: #777;

      cursor: not-allowed;
    }


    /* =========================================================
       Metadata
    ========================================================= */

    .metadata-grid {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 10px;

      margin-top: 20px;
    }


    .metadata-item {
      padding:
        11px 12px;

      border:
        1px solid #eee;

      border-radius: 9px;

      background: #fafafa;
    }


    .metadata-label {
      color: #777;

      font-size: 11px;
    }


    .metadata-value {
      margin-top: 3px;

      color: #222;

      font-size: 13px;

      font-weight: 600;

      word-break: break-word;
    }


    /* =========================================================
       Source
    ========================================================= */

    .source-area {
      margin-top: 18px;

      padding-top: 16px;

      border-top:
        1px solid #eee;

      color: #555;

      font-size: 13px;

      line-height: 1.7;

      word-break: break-word;
    }


    .source-area a {
      text-decoration: underline;
    }


    /* =========================================================
       Actions
    ========================================================= */

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 9px;

      margin-top: 20px;

      padding-top: 18px;

      border-top:
        1px solid #eee;
    }


    .actions button,
    .actions a {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 41px;

      padding:
        9px 14px;

      border-radius: 8px;

      font-size: 13px;

      font-weight: 600;

      text-decoration: none;

      cursor: pointer;
    }


    .actions button {
      border: 0;
    }


    .btn-save {
      background: #111;

      color: #fff;
    }


    .btn-approve {
      background: #1c7a3e;

      color: #fff;
    }


    .btn-reject {
      background: #a52b2b;

      color: #fff;
    }


    .btn-source {
      border:
        1px solid #ddd;

      background: #eee;

      color: #222;
    }


    .actions button:hover,
    .actions a:hover {
      filter: brightness(.94);
    }


    .actions button:disabled {
      opacity: .5;

      cursor: not-allowed;
    }


    /* =========================================================
       Empty / Loading
    ========================================================= */

    .empty,
    .loading {
      padding:
        50px 20px;

      border:
        1px solid #ddd;

      border-radius: 14px;

      background: #fff;

      color: #666;

      text-align: center;
    }


    /* =========================================================
       Mobile
    ========================================================= */

    @media (max-width: 850px) {

      .summary-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }


      .metadata-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

    }


    @media (max-width: 700px) {

      .header-inner {
        min-height: auto;

        padding:
          14px 0;

        flex-direction: column;

        align-items: stretch;
      }


      .logo {
        text-align: center;
      }


      .header-actions {
        width: 100%;
      }


      .header-actions a,
      .header-actions button {
        flex: 1;

        text-align: center;
      }


      main {
        width:
          calc(100% - 24px);

        padding:
          25px 0 55px;
      }


      .page-header h1 {
        font-size: 25px;
      }


      .candidate-main {
        padding: 17px;
      }


      .candidate-header {
        flex-direction: column;
      }


      .decision-area {
        width: 100%;

        text-align: left;
      }


      .confidence-bar {
        margin-left: 0;

        margin-right: auto;
      }


      .fields {
        grid-template-columns: 1fr;
      }


      .field.full {
        grid-column: auto;
      }


      .metadata-grid {
        grid-template-columns: 1fr;
      }


      .actions {
        flex-direction: column;
      }


      .actions button,
      .actions a {
        width: 100%;
      }

    }


  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

    /* =========================================================
       Supabase
    ========================================================= */

    const SUPABASE_URL =
      "https://bhgdjuwlxvbaeraaivmh.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================================
       DOM
    ========================================================= */

    const candidateList =
      document.getElementById(
        "candidate-list"
      );


    const messageElement =
      document.getElementById(
        "message"
      );


    const pendingCount =
      document.getElementById(
        "pending-count"
      );


    const acceptedCount =
      document.getElementById(
        "accepted-count"
      );


    const reviewCount =
      document.getElementById(
        "review-count"
      );


    const rejectedCount =
      document.getElementById(
        "rejected-count"
      );


    const logoutButton =
      document.getElementById(
        "logout-button"
      );


    let allCandidates = [];

    let currentFilter = "all";


    /* =========================================================
       Message
    ========================================================= */

    function showMessage(
      text,
      type = ""
    ) {

      messageElement.textContent =
        text || "";


      messageElement.className =
        "message";


      if (type) {

        messageElement.classList.add(
          type
        );

      }

    }


    /* =========================================================
       Escape
    ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================================================
       Format value
    ========================================================= */

    function displayValue(
      value
    ) {

      if (
        value === null
        ||
        value === undefined
        ||
        value === ""
      ) {

        return "未設定";
      }


      return escapeHtml(
        value
      );
    }


    /* =========================================================
       Admin check
    ========================================================= */

    async function requireAdmin() {

      const {
        data: {
          session
        },
        error: sessionError
      } =
        await supabaseClient.auth.getSession();


      if (sessionError) {

        console.error(
          sessionError
        );


        showMessage(
          "ログイン状態を確認できませんでした。",
          "error"
        );


        return null;
      }


      if (!session?.user) {

        window.location.href =
          "admin.html";


        return null;
      }

      if (
        session.user.is_anonymous === true ||
        !session.user.email_confirmed_at
      ) {

        await supabaseClient.auth.signOut();

        window.location.href =
          "admin.html";

        return null;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "admin_users"
          )
          .select(
            "user_id"
          )
          .eq(
            "user_id",
            session.user.id
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Admin check error:",
          error
        );


        showMessage(
          "管理者権限を確認できませんでした。",
          "error"
        );


        return null;
      }


      if (!data) {

        showMessage(
          "管理者権限がありません。",
          "error"
        );


        setTimeout(
          () => {
            window.location.href =
              "index.html";
          },
          1200
        );


        return null;
      }


      return session;
    }


    /* =========================================================
       Load candidates
    ========================================================= */

    async function loadCandidates() {

      candidateList.innerHTML = `
        <div class="loading">
          候補を読み込んでいます……
        </div>
      `;


      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "anime_import_candidates"
          )
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "Candidate load error:",
          error
        );


        candidateList.innerHTML = `
          <div class="empty">
            候補を読み込めませんでした。
          </div>
        `;


        showMessage(
          error.message ||
          "候補の読み込みに失敗しました。",
          "error"
        );


        return;
      }


      allCandidates =
        data || [];


      updateCounts(
        allCandidates
      );


      renderFilteredCandidates();
    }


    /* =========================================================
       Counts
    ========================================================= */

    function updateCounts(
      candidates
    ) {

      let pending =
        0;

      let accepted =
        0;

      let review =
        0;

      let rejected =
        0;


      candidates.forEach(
        candidate => {

          if (
            candidate.import_status
            === "pending"
          ) {
            pending++;
          }


          if (
            candidate.auto_decision
            === "accepted"
          ) {
            accepted++;
          }


          if (
            candidate.auto_decision
            === "review"
          ) {
            review++;
          }


          if (
            candidate.auto_decision
            === "rejected"
          ) {
            rejected++;
          }

        }
      );


      pendingCount.textContent =
        pending;


      acceptedCount.textContent =
        accepted;


      reviewCount.textContent =
        review;


      rejectedCount.textContent =
        rejected;
    }


    /* =========================================================
       Filter
    ========================================================= */

    function getFilteredCandidates() {

      if (
        currentFilter === "all"
      ) {

        return allCandidates;
      }


      if (
        currentFilter === "pending"
      ) {

        return allCandidates.filter(
          candidate =>
            candidate.import_status
            === "pending"
        );
      }


      return allCandidates.filter(
        candidate =>
          candidate.auto_decision
          === currentFilter
      );
    }


    function setFilter(
      filter
    ) {

      currentFilter =
        filter;


      document
        .querySelectorAll(
          ".filter-button"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.filter
              === filter
            );

          }
        );


      renderFilteredCandidates();
    }


    /* =========================================================
       Render
    ========================================================= */

    function renderFilteredCandidates() {

      const candidates =
        getFilteredCandidates();


      if (!candidates.length) {

        candidateList.innerHTML = `
          <div class="empty">
            該当する候補はありません。
          </div>
        `;


        return;
      }


      candidateList.innerHTML =
        candidates
          .map(
            candidate =>
              renderCandidate(
                candidate
              )
          )
          .join("");
    }


    /* =========================================================
       Decision labels
    ========================================================= */

    function getDecisionLabel(
      decision
    ) {

      if (
        decision === "accepted"
      ) {

        return "登録候補";
      }


      if (
        decision === "review"
      ) {

        return "要確認";
      }


      if (
        decision === "rejected"
      ) {

        return "自動却下";
      }


      return "未判定";
    }


    function getCategoryLabel(
      category
    ) {

      if (
        category === "anime"
      ) {

        return "アニメ";
      }


      if (
        category === "non_anime"
      ) {

        return "対象外";
      }


      if (
        category === "uncertain"
      ) {

        return "要確認";
      }


      return "未判定";
    }


    function getImportStatusLabel(
      status
    ) {

      if (
        status === "pending"
      ) {

        return "審査待ち";
      }


      if (
        status === "imported"
      ) {

        return "登録済み";
      }


      if (
        status === "rejected"
      ) {

        return "却下済み";
      }


      return "不明";
    }


    /* =========================================================
       Render candidate
    ========================================================= */

    function renderCandidate(
      candidate
    ) {

      const decision =
        candidate.auto_decision
        || "review";


      const confidence =
        Number(
          candidate.auto_confidence
          ?? 0
        );


      const safeConfidence =
        Math.max(
          0,
          Math.min(
            100,
            confidence
          )
        );


      const reasons =
        Array.isArray(
          candidate.auto_reasons
        )
          ? candidate.auto_reasons
          : [];


      const isPending =
        candidate.import_status
        === "pending";


      const title =
        candidate.title
        || "";


      const titleJapanese =
        candidate.title_japanese
        || "";


      const titleNative =
        candidate.title_native
        || "";


      const titleEnglish =
        candidate.title_english
        || "";


      const format =
        candidate.format
        || "";


      const startDate =
        candidate.start_date
        || "";


      const endDate =
        candidate.end_date
        || "";


      const episodes =
        candidate.episodes
        ?? "";


      const duration =
        candidate.duration
        ?? "";


      const genre =
        candidate.genre
        || "";


      const officialUrl =
        candidate.official_url
        || "";


      const sourceUrl =
        candidate.source_url
        || "";


      const status =
        candidate.import_status
        || "";


      const autoCategory =
        getCategoryLabel(
          candidate.auto_category
        );


      const duplicateId =
        candidate.duplicate_anime_id;


      const formatOptions = [

        [
          "TV",
          "TV"
        ],

        [
          "MOVIE",
          "映画"
        ],

        [
          "OVA",
          "OVA"
        ],

        [
          "ONA",
          "ONA"
        ],

        [
          "SPECIAL",
          "SPECIAL"
        ]

      ]
        .map(
          ([value, label]) =>
            `
              <option
                value="${escapeHtml(value)}"
                ${
                  format === value
                    ? "selected"
                    : ""
                }
              >
                ${escapeHtml(label)}
              </option>
            `
        )
        .join("");


      return `

        <article
          class="
            candidate-card
            ${escapeHtml(decision)}
          "
          data-id="${escapeHtml(candidate.id)}"
        >

          <div class="candidate-main">


            <!-- =========================================
                 Header
            ========================================== -->

            <div class="candidate-header">

              <div>

                <h2
                  class="candidate-title"
                >
                  ${escapeHtml(title)}
                </h2>

                <div class="candidate-id">
                  ANN ID:
                  ${escapeHtml(
                    candidate.source_id
                  )}

                  ・

                  状態：
                  ${escapeHtml(
                    getImportStatusLabel(
                      status
                    )
                  )}
                </div>

              </div>


              <div class="decision-area">

                <span
                  class="
                    decision-badge
                    ${escapeHtml(decision)}
                  "
                >
                  ${escapeHtml(
                    getDecisionLabel(
                      decision
                    )
                  )}
                </span>


                <div class="confidence">
                  自動判定信頼度：
                  ${safeConfidence}%
                </div>


                <div class="confidence-bar">
                  <div
                    class="confidence-bar-inner"
                    style="
                      width:
                      ${safeConfidence}%;
                    "
                  ></div>
                </div>

              </div>

            </div>


            <!-- =========================================
                 Automatic classification
            ========================================== -->

            <div class="metadata-grid">

              <div class="metadata-item">

                <div class="metadata-label">
                  自動カテゴリ
                </div>

                <div class="metadata-value">
                  ${escapeHtml(
                    autoCategory
                  )}
                </div>

              </div>


              <div class="metadata-item">

                <div class="metadata-label">
                  ANN形式
                </div>

                <div class="metadata-value">
                  ${displayValue(
                    format
                  )}
                </div>

              </div>


              <div class="metadata-item">

                <div class="metadata-label">
                  ANN ID
                </div>

                <div class="metadata-value">
                  ${escapeHtml(
                    candidate.source_id
                  )}
                </div>

              </div>

            </div>


            <!-- =========================================
                 Reasons
            ========================================== -->

            <div class="reason-box">

              <div class="reason-title">
                自動判定の理由
              </div>


              ${
                reasons.length
                  ? `
                    <ul
                      class="reason-list"
                    >
                      ${
                        reasons
                          .map(
                            reason =>
                              `
                                <li>
                                  ${escapeHtml(
                                    reason
                                  )}
                                </li>
                              `
                          )
                          .join("")
                      }
                    </ul>
                  `
                  : `
                    <div>
                      判定理由はありません。
                    </div>
                  `
              }

            </div>


            ${
              duplicateId
                ? `
                  <div
                    class="duplicate-warning"
                  >
                    Animeciaの既存作品
                    ID ${escapeHtml(
                      duplicateId
                    )}
                    と重複する可能性があります。
                  </div>
                `
                : ""
            }


            <!-- =========================================
                 Editable fields
            ========================================== -->

            <div class="fields">


              <div class="field full">

                <label>
                  タイトル
                </label>

                <input
                  type="text"
                  data-field="title"
                  maxlength="500"
                  value="${escapeHtml(title)}"
                  ${isPending ? "" : "disabled"}
                >

              </div>


              <div class="field">

                <label>
                  日本語タイトル
                </label>

                <input
                  type="text"
                  data-field="title_japanese"
                  maxlength="500"
                  value="${escapeHtml(titleJapanese)}"
                  ${isPending ? "" : "disabled"}
                >

              </div>


              <div class="field">

                <label>
                  Native title
                </label>

                <input
                  type="text"
                  data-field="title_native"
                  maxlength="500"
                  value="${escapeHtml(titleNative)}"
                  ${isPending ? "" : "disabled"}
                >

              </div>


              <div class="field">

                <label>
                  英語タイトル
                </label>

                <input
                  type="text"
                  data-field="title_english"
                  maxlength="500"
                  value="${escapeHtml(titleEnglish)}"
                  ${isPending ? "" : "disabled"}
                >

              </div>


              <div class="field">

                <label>
                  形式
                </label>

                <select
                  data-field="format"
                  ${isPending ? "" : "disabled"}
                >
                  ${formatOptions}
                </select>

              </div>


              <div class="field">

                <label>
                  開始日
                </label>

                <input
                  type="date"
                  data-field="start_date"
                  value="${escapeHtml(startDate)}"
                  ${isPending ? "" : "disabled"}
                >

              </div>


              <div class="field">

                <label>
                  終了日
                </label>

                <input
                  type="date"
                  data-field="end_date"
                  value="${escapeHtml(endDate)}"
                  ${isPending ? "" : "disabled"}
                >

              </div>


              <div class="field">

                <label>
                  話数
                </label>

                <input
                  type="number"
                  min="0"
                  max="10000"
                  step="1"
                  data-field="episodes"
                  value="${escapeHtml(episodes)}"
                  ${isPending ? "" : "disabled"}
                >

              </div>


              <div class="field">

                <label>
                  1話の時間（分）
                </label>

                <input
                  type="number"
                  min="0"
                  max="300"
                  step="1"
                  data-field="duration"
                  value="${escapeHtml(duration)}"
                  ${isPending ? "" : "disabled"}
                >

              </div>


              <div class="field full">

                <label>
                  ジャンル
                </label>

                <input
                  type="text"
                  data-field="genre"
                  maxlength="1000"
                  value="${escapeHtml(genre)}"
                  ${isPending ? "" : "disabled"}
                >

              </div>


              <div class="field full">

                <label>
                  公式サイトURL
                </label>

                <input
                  type="url"
                  data-field="official_url"
                  maxlength="2000"
                  value="${escapeHtml(officialUrl)}"
                  ${isPending ? "" : "disabled"}
                >

              </div>


            </div>


            <!-- =========================================
                 Metadata
            ========================================== -->

            <div class="metadata-grid">

              <div class="metadata-item">

                <div class="metadata-label">
                  状態
                </div>

                <div class="metadata-value">
                  ${displayValue(
                    candidate.status
                  )}
                </div>

              </div>


              <div class="metadata-item">

                <div class="metadata-label">
                  自動チェック日時
                </div>

                <div class="metadata-value">
                  ${displayValue(
                    candidate.auto_checked_at
                      ? new Date(
                          candidate.auto_checked_at
                        ).toLocaleString(
                          "ja-JP"
                        )
                      : null
                  )}
                </div>

              </div>


              <div class="metadata-item">

                <div class="metadata-label">
                  ソース
                </div>

                <div class="metadata-value">
                  Anime News Network Encyclopedia
                </div>

              </div>

            </div>


            <!-- =========================================
                 Sources
            ========================================== -->

            <div class="source-area">

              <strong>
                情報源：
              </strong>


              ${
                sourceUrl
                  ? `
                    <a
                      href="${escapeHtml(sourceUrl)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Anime News Network Encyclopedia
                    </a>
                  `
                  : "なし"
              }


              ${
                officialUrl
                  ? `
                    <br>

                    <strong>
                      公式サイト：
                    </strong>

                    <a
                      href="${escapeHtml(officialUrl)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      公式サイトを開く
                    </a>
                  `
                  : ""
              }

            </div>


            <!-- =========================================
                 Actions
            ========================================== -->

            <div class="actions">


              ${
                isPending
                  ? `

                    <button
                      type="button"
                      class="btn-save"
                      data-action="save"
                    >
                      修正を保存
                    </button>


                    <button
                      type="button"
                      class="btn-approve"
                      data-action="approve"
                    >
                      承認して登録
                    </button>


                    <button
                      type="button"
                      class="btn-reject"
                      data-action="reject"
                    >
                      却下
                    </button>

                  `
                  : ""
              }


              ${
                sourceUrl
                  ? `
                    <a
                      class="btn-source"
                      href="${escapeHtml(sourceUrl)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      ANNページを開く
                    </a>
                  `
                  : ""
              }

            </div>


          </div>

        </article>
      `;

    }


    /* =========================================================
       Get card values
    ========================================================= */

    function getCardValues(
      card
    ) {

      function getValue(
        field
      ) {

        const element =
          card.querySelector(
            `[data-field="${field}"]`
          );


        if (!element) {
          return null;
        }


        const value =
          element.value.trim();


        return value || null;
      }


      const episodesValue =
        getValue(
          "episodes"
        );


      const durationValue =
        getValue(
          "duration"
        );


      return {

        title:
          getValue(
            "title"
          ),

        title_japanese:
          getValue(
            "title_japanese"
          ),

        title_native:
          getValue(
            "title_native"
          ),

        title_english:
          getValue(
            "title_english"
          ),

        format:
          getValue(
            "format"
          ),

        start_date:
          getValue(
            "start_date"
          ),

        end_date:
          getValue(
            "end_date"
          ),

        episodes:
          episodesValue === null
            ? null
            : Number(
                episodesValue
              ),

        duration:
          durationValue === null
            ? null
            : Number(
                durationValue
              ),

        genre:
          getValue(
            "genre"
          ),

        official_url:
          getValue(
            "official_url"
          )

      };
    }


    /* =========================================================
       Validation
    ========================================================= */

    function validateValues(
      values
    ) {

      if (
        !values.title
      ) {

        return "タイトルを入力してください。";
      }


      if (
        values.episodes !== null
      ) {

        if (
          !Number.isInteger(
            values.episodes
          )
          ||
          values.episodes < 0
          ||
          values.episodes > 10000
        ) {

          return "話数が正しくありません。";
        }

      }


      if (
        values.duration !== null
      ) {

        if (
          !Number.isInteger(
            values.duration
          )
          ||
          values.duration < 0
          ||
          values.duration > 300
        ) {

          return "1話の時間が正しくありません。";
        }

      }


      if (
        values.start_date
        &&
        values.end_date
        &&
        values.start_date >
          values.end_date
      ) {

        return "終了日は開始日以降にしてください。";
      }


      if (
        values.official_url
      ) {

        try {

          const url =
            new URL(
              values.official_url
            );


          if (
            ![
              "http:",
              "https:"
            ].includes(
              url.protocol
            )
          ) {

            return "公式サイトURLが正しくありません。";
          }

        } catch {

          return "公式サイトURLが正しくありません。";
        }

      }


      return null;
    }


    /* =========================================================
       Save
    ========================================================= */

    async function saveCandidate(
      card,
      candidateId
    ) {

      const values =
        getCardValues(
          card
        );


      const validationError =
        validateValues(
          values
        );


      if (
        validationError
      ) {

        showMessage(
          validationError,
          "error"
        );


        return false;
      }


      const {
        error
      } =
        await supabaseClient
          .from(
            "anime_import_candidates"
          )
          .update({

            title:
              values.title,

            title_japanese:
              values.title_japanese,

            title_native:
              values.title_native,

            title_english:
              values.title_english,

            format:
              values.format,

            start_date:
              values.start_date,

            end_date:
              values.end_date,

            episodes:
              values.episodes,

            duration:
              values.duration,

            genre:
              values.genre,

            official_url:
              values.official_url,

            updated_at:
              new Date()
                .toISOString()

          })
          .eq(
            "id",
            candidateId
          )
          .eq(
            "import_status",
            "pending"
          );


      if (error) {

        console.error(
          error
        );


        showMessage(
          error.message ||
          "修正の保存に失敗しました。",
          "error"
        );


        return false;
      }


      showMessage(
        "候補情報を保存しました。",
        "success"
      );


      await loadCandidates();


      return true;
    }


    /* =========================================================
       Approve
    ========================================================= */

    async function approveCandidate(
      card,
      candidateId
    ) {

      const values =
        getCardValues(
          card
        );


      const validationError =
        validateValues(
          values
        );


      if (
        validationError
      ) {

        showMessage(
          validationError,
          "error"
        );


        return;
      }


      if (
        card.querySelector(
          ".duplicate-warning"
        )
      ) {

        const duplicateConfirmed =
          window.confirm(
            "既存作品との重複候補が検出されています。このまま登録しますか？"
          );


        if (!duplicateConfirmed) {
          return;
        }

      }


      const saved =
        await saveCandidate(
          card,
          candidateId
        );


      if (!saved) {
        return;
      }


      const confirmed =
        window.confirm(
          "この作品をAnimeciaへ登録しますか？"
        );


      if (!confirmed) {
        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient
          .rpc(
            "approve_anime_candidate",
            {
              p_candidate_id:
                candidateId
            }
          );


      if (error) {

        console.error(
          "Approve error:",
          error
        );


        showMessage(
          error.message ||
          "承認・登録に失敗しました。",
          "error"
        );


        return;
      }


      showMessage(
        `Animeciaへの登録が完了しました。作品ID: ${data}`,
        "success"
      );


      await loadCandidates();
    }


    /* =========================================================
       Reject
    ========================================================= */

    async function rejectCandidate(
      candidateId
    ) {

      const reason =
        window.prompt(
          "却下理由を入力してください。"
        );


      if (
        reason === null
      ) {
        return;
      }


      const {
        error
      } =
        await supabaseClient
          .rpc(
            "reject_anime_candidate",
            {
              p_candidate_id:
                candidateId,

              p_reason:
                reason.trim()
                || null
            }
          );


      if (error) {

        console.error(
          "Reject error:",
          error
        );


        showMessage(
          error.message ||
          "候補の却下に失敗しました。",
          "error"
        );


        return;
      }


      showMessage(
        "候補を却下しました。",
        "success"
      );


      await loadCandidates();
    }


    /* =========================================================
       Click handling
    ========================================================= */

    candidateList.addEventListener(
      "click",
      async event => {

        const button =
          event.target.closest(
            "button[data-action]"
          );


        if (!button) {
          return;
        }


        const card =
          button.closest(
            ".candidate-card"
          );


        if (!card) {
          return;
        }


        const candidateId =
          Number(
            card.dataset.id
          );


        if (
          !Number.isInteger(
            candidateId
          )
          ||
          candidateId <= 0
        ) {

          showMessage(
            "候補IDが不正です。",
            "error"
          );


          return;
        }


        const action =
          button.dataset.action;


        button.disabled =
          true;


        try {

          if (
            action === "save"
          ) {

            await saveCandidate(
              card,
              candidateId
            );


          } else if (
            action === "approve"
          ) {

            await approveCandidate(
              card,
              candidateId
            );


          } else if (
            action === "reject"
          ) {

            await rejectCandidate(
              candidateId
            );

          }

        } catch (error) {

          console.error(
            error
          );


          showMessage(
            error.message ||
            "処理中にエラーが発生しました。",
            "error"
          );

        } finally {

          button.disabled =
            false;
        }

      }
    );


    /* =========================================================
       Filters
    ========================================================= */

    document
      .querySelectorAll(
        ".filter-button"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              setFilter(
                button.dataset.filter
              );

            }
          );

        }
      );


    /* =========================================================
       Logout
    ========================================================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        const {
          error
        } =
          await supabaseClient.auth.signOut();


        if (error) {

          console.error(
            error
          );

          return;
        }


        window.location.href =
          "admin.html";

      }
    );


    /* =========================================================
       Auth
    ========================================================= */

    supabaseClient.auth.onAuthStateChange(
      (
        event,
        session
      ) => {

        if (
          event ===
          "SIGNED_OUT"
        ) {

          window.location.href =
            "admin.html";
        }

      }
    );


    /* =========================================================
       Init
    ========================================================= */

    async function init() {

      const session =
        await requireAdmin();


      if (!session) {
        return;
      }


      await loadCandidates();
    }


    init();

  </script>

</body>

</html>
