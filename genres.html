main{max-width:1240px;margin:auto;padding:34px 20px 80px}.hero{padding:38px;border-radius:22px;background:linear-gradient(135deg,#111216,#292b31);color:#fff;margin-bottom:18px}.hero small{color:#fb7185;font-weight:900;letter-spacing:.16em}.hero h1{font-size:clamp(34px,5vw,52px);margin:12px 0 8px;letter-spacing:-.05em}.hero p{margin:0;color:#d1d5db;line-height:1.8}.tools{display:flex;gap:10px;margin-bottom:16px}.tools input{flex:1;height:46px;border:1px solid #d9dce2;border-radius:11px;padding:0 14px}.count{align-self:center;color:#777;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}.genre{background:#fff;border:1px solid #e3e5e9;border-radius:16px;padding:20px;text-decoration:none;color:inherit;min-height:125px;position:relative;overflow:hidden;transition:.18s}.genre:after{content:"→";position:absolute;right:18px;bottom:16px;color:#a0a3aa}.genre:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(17,18,20,.09);border-color:#cdd1d8}.genre-name{font-size:18px;font-weight:900}.genre-count{margin-top:10px;color:#777;font-size:12px}.genre-count b{color:#111;font-size:20px}.loading,.empty{text-align:center;padding:40px;color:#777}@media(max-width:600px){main{padding:25px 13px 55px}.hero{padding:28px 22px}.tools{flex-direction:column}.grid{grid-template-columns:1fr 1fr}.genre{min-height:110px;padding:16px}}

<main><section class="hero"><small>EXPLORE BY GENRE</small><h1>ジャンルから探す。</h1><p>気分や好みからジャンルを選んで、そのまま作品探索へ。複数ジャンルの組み合わせにも対応しています。</p></section>
<section class="tools"><input id="q" placeholder="ジャンル名を検索"><span id="count" class="count"></span></section>
<section id="grid" class="grid"><div class="loading">ジャンルを読み込み中…</div></section></main>
<script>
let s=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let rows=[];
async function load(){try{await AnimeciaAuth.init();s=AnimeciaAuth.client();let result=await s.rpc("get_catalog_genre_counts");if(result.error){console.warn("Genre counts RPC unavailable; using genre list fallback.",result.error);result=await s.rpc("get_catalog_genres");if(result.error)throw result.error;rows=(result.data||[]).map(g=>({...g,count:null}));}else{rows=(result.data||[]).map(g=>({...g,count:Number(g.anime_count||0)}));}render()}catch(error){console.error("Animecia genre page failed to load:",error);document.getElementById("grid").innerHTML='<div class="empty">ジャンルを読み込めませんでした。時間をおいて再読み込みしてください。</div>';document.getElementById("count").textContent="";}}
function render(){const q=document.getElementById("q").value.trim().toLowerCase();const r=rows.filter(x=>x.name.toLowerCase().includes(q));document.getElementById("count").textContent=r.length+"ジャンル";document.getElementById("grid").innerHTML=r.map(g=>'<a class="genre" href="discover.html?genre='+encodeURIComponent(g.id)+'"><div class="genre-name">'+esc(g.name)+'</div><div class="genre-count"><b>'+(g.count==null?'—':g.count.toLocaleString("ja-JP"))+'</b> '+(g.count==null?'作品数未取得':'作品')+'</div></a>').join("")||'<div class="empty">該当するジャンルがありません。</div>'}
document.getElementById("q").addEventListener("input",render);load();
</script></body></html>
