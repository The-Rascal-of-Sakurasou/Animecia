<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ユーザー検索 | Animecia</title>
<meta name="description" content="Animeciaのユーザーを検索できます。">\n<meta name="robots" content="noindex,nofollow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<style>
main{max-width:1080px;margin:0 auto;padding:36px 20px 70px}.hero{margin-bottom:22px}.hero h1{margin:0 0 8px}.hero p{color:#737373}
.search-box{display:flex;gap:10px;margin:20px 0}.search-box input{flex:1}.results{display:grid;gap:10px}.user-card{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid #e5e7eb;border-radius:14px;background:#fff}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#eef0f3;flex:none}.avatar-placeholder{display:grid;place-items:center;font-weight:800;color:#697386}.grow{flex:1;min-width:0}.name{font-weight:800}.username,.bio,.meta{color:#737373;font-size:13px}.bio{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:7px}.empty,.error{text-align:center;padding:36px;color:#737373}
</style>
<script src="performance.js" defer></script>
<link rel="preconnect" href="https://bhgdjuwlxvbaeraaivmh.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="auth-core.js" defer></script>
<link rel="stylesheet" href="site-theme.css?v=20261012">
</head>
<body>
<header><div class="wrap head"><a class="logo" href="index.html">Animecia</a><nav>
<a href="index.html">ホーム</a><a href="discover.html">探す</a><a href="ranking.html">ランキング</a><a href="season.html">今期</a><a href="recommendations.html">おすすめ</a><a href="community.html">コミュニティ</a><a href="mypage.html">マイページ</a>
</nav></div></header>
<main>
<section class="hero"><h1>ユーザー検索</h1><p>ユーザー名や表示名からAnimeciaユーザーを探せます。</p></section>
<form id="search-form" class="search-box"><input id="q" maxlength="50" autocomplete="off" placeholder="ユーザー名・表示名を入力"><button class="btn" type="submit">検索</button></form>
<div id="results" class="results"><div class="empty">検索したいユーザー名や表示名を入力してください。</div></div>
</main>
<script>
const SUPABASE_URL="https://bhgdjuwlxvbaeraaivmh.supabase.co";
const SUPABASE_KEY="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
const supabaseClient=AnimeciaAuth.client();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const form=document.getElementById("search-form"),q=document.getElementById("q"),results=document.getElementById("results");
function render(rows){
 if(!rows.length){results.innerHTML='<div class="empty">該当するユーザーが見つかりませんでした。</div>';return;}
 results.innerHTML=rows.map(p=>{
  const name=p.display_name||p.username||"Animeciaユーザー";
  const avatar=p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="" decoding="async" loading="eager" fetchpriority="high">':'<div class="avatar avatar-placeholder">'+esc(name.slice(0,1))+'</div>';
  return '<a class="user-card" href="profile.html?id='+encodeURIComponent(p.id)+'">'+avatar+'<div class="grow"><div class="name">'+esc(name)+'</div>'+(p.username?'<div class="username">@'+esc(String(p.username).replace(/^@/,""))+'</div>':'')+(p.bio?'<div class="bio">'+esc(p.bio)+'</div>':'')+'</div></a>';
 }).join("");
}
async function search(){
 const term=q.value.trim().replace(/^@/,"");
 if(!term){render([]);results.innerHTML='<div class="empty">検索したいユーザー名や表示名を入力してください。</div>';return;}
 results.innerHTML='<div class="empty">検索中…</div>';
 const pattern="%"+term.replace(/[%_\\]/g,"\\$&")+"%";
 const {data,error}=await supabaseClient.from("profiles").select("id,username,display_name,avatar_url,bio").or("username.ilike."+pattern+",display_name.ilike."+pattern).limit(50);
 if(error){console.error(error);results.innerHTML='<div class="error">ユーザー検索に失敗しました。</div>';return;}
 render(data||[]);
}
form.addEventListener("submit",e=>{e.preventDefault();search();});
const initial=new URLSearchParams(location.search).get("q");if(initial){q.value=initial;search();}
</script>
</body>
</html>
